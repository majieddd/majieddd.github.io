      /* Arcing shells rise then fall, purely visual: the impact point is
         already decided by the tracking above. */
      if (p.arc) {
        var total = V.dist(p.start, aim);
        var travelled = V.dist(p.start, p.pos);
        var frac = total > 0.01 ? travelled / total : 1;
        p.pos[1] += Math.sin(frac * Math.PI) * total * 0.22;
      }
      p.dir = dir;
      p.spin += dt * 9;
      G.projs[w++] = p;
    }
    G.projs.length = w;
  }

  function detonate(p, at) {
    try {
      var col = U.hex2rgb(DATA.ELEMENTS[p.element] ? DATA.ELEMENTS[p.element].color : '#ffffff');
      if (p.splash > 0) {
        var hitAny = false;
        for (var i = 0; i < G.denizens.length; i++) {
          var d = G.denizens[i];
          if (!d.alive || d.dying > 0) continue;
          var dd = V.dist(d.pos, at);
          if (dd > p.splash) continue;
          var falloff = 1 - (dd / p.splash) * 0.55;
          applyHit(p, d, p.dmg * falloff);
          hitAny = true;
        }
        /* Every splash impact: a light heart, sparks, ground dust, embers,
           a wide ring and a screen kick. The ring radius scales with the
           splash so a mortar and a canister land with different weight. */
        FX.coreFlash(at, col, 1.2 + p.splash * 0.25, 0.3);
        FX.sparks(at, col, { count: 16, speed: 10 + p.splash, size: 0.26, life: 0.7 });
        FX.shockRing(at, col, p.splash * 1.9, 0.36);
        FX.dust(at, [0.4, 0.32, 0.55], 5, p.splash * 0.35 + 0.4);
        for (var emb = 0; emb < 6; emb++) FX.ember(at, col);
        FX.smoke(at, [0.4, 0.32, 0.55], 3, p.splash * 0.3);
        AUDIO.play('impact_splash', { pan: panOf(at) });
        FX.hit(0.35 + p.splash * 0.05);
      } else {
        /* SINGLE TARGET. Re-find the nearest living body within a tolerance
           rather than requiring the stored target to still be alive: without
           this, a shot whose target dies in flight does nothing at all, which
           in a dense wave is a large fraction of every shot fired. */
        var best = null, bestD = 1e9;
        for (var j = 0; j < G.denizens.length; j++) {
          var e = G.denizens[j];
          if (!e.alive || e.dying > 0) continue;
          var ed = V.dist(e.pos, at);
          if (ed < bestD) { bestD = ed; best = e; }
        }
        if (best && bestD < 2.6) {
          applyHit(p, best, p.dmg);
          FX.impactKick(at, col, { scale: 0.7, count: 8, speed: 9, ring: false, dust: 3 });
          AUDIO.play('impact_small', { pan: panOf(at) });
        } else {
          FX.coreFlash(at, col, 0.7, 0.18);
          FX.sparks(at, col, { count: 5, speed: 6, size: 0.2, life: 0.3 });
        }
      }
    } catch (e) {
      recordError('detonate', e);
    }
  }

  function applyHit(p, d, amount) {
    var amt = amount;
    if ((d.flying || d.airborne > 0) && p.airBonus > 1) amt *= p.airBonus;
    damage(d, amt, { element: p.element, source: p.source, execute: p.execute });
    if (!d.alive) return;
    if (p.slow) { d.slow = Math.max(d.slow, p.slow.amount); d.slowT = Math.max(d.slowT, p.slow.dur); }
    if (p.burn) {
      d.burn = Math.max(d.burn, p.burn.dps);
      d.burnT = Math.max(d.burnT, p.burn.dur);
      d.burnSrc = p.source;
    }
    if (p.poison) {
      d.poisonStacks = Math.min(p.poison.maxStacks, d.poisonStacks + 1);
      d.poison = p.poison.pctHp;
      d.poisonT = p.poison.dur * (G.commander.id === 'sevra' ? 1.4 : 1);
      d.poisonSrc = p.source;
    }
    if (p.launch > 0 && !d.flying && !d.def.boss) {
      d.airborne = Math.max(d.airborne, 1.4 * p.launch);
    }
  }

  /* ---------- tower firing ---------- */

  function fireTower(t, s, def, dt) {
    var model = MODELS.tower(t.id, t.tier);
    /* The muzzle is authored in turret-local space, so it has to be rotated
       into world space by the turret's current yaw before anything is spawned
       from it. Skipping this is why muzzle flashes in prototypes so often
       appear on the wrong side of the tower. */
    var m = model.muzzle;
    var cy = Math.cos(t.yaw), sy = Math.sin(t.yaw);
    var muzzleWorld = [
      t.pos[0] + m[0] * cy + m[2] * sy,
      t.pos[1] + model.turretY + m[1],
      t.pos[2] + (-m[0] * sy + m[2] * cy)
    ];
    var target = t.target;
    var pan = panOf(t.pos);
    var accent = model.accent;

    switch (def.kind) {
      case 'bullet':
      case 'shell': {
        fireProjectile(t, s, muzzleWorld, target, def);
        var dir = V.norm(V.sub(target.pos, muzzleWorld));
        FX.muzzle(muzzleWorld, dir, accent);
        AUDIO.playShot(def.kind === 'shell' ? 'shell' : 'bullet', { pan: pan });
        t.recoil = 1;
        FX.hit(def.kind === 'shell' ? 0.10 : 0.03, { aberr: false });
        break;
      }
      case 'chain': {
        var hits = [], cur = target, used = {};
        var dmg = s.dps / Math.max(0.001, s.fireRate);
        for (var c = 0; c <= s.chains && cur; c++) {
          used[cur.uid] = true;
          hits.push({ d: cur, dmg: dmg * Math.pow(s.chainFalloff, c) });
          var next = null, nd = 1e9;
          for (var i = 0; i < G.denizens.length; i++) {
            var o = G.denizens[i];
            if (!o.alive || o.dying > 0 || used[o.uid]) continue;
            if (o.flying && !def.air) continue;
            var od = V.dist(o.pos, cur.pos);
            if (od < s.chainRange && od < nd) { nd = od; next = o; }
          }
          cur = next;
        }
        var prev = muzzleWorld;
        for (var h = 0; h < hits.length; h++) {
          var hd = hits[h].d;
          damage(hd, hits[h].dmg, { element: def.element, source: t });
          t.arcs = t.arcs || [];
          t.arcs.push({ a: prev.slice(), b: [hd.pos[0], hd.pos[1] + 0.8 * hd.scale, hd.pos[2]], life: 0.16 });
          prev = [hd.pos[0], hd.pos[1] + 0.8 * hd.scale, hd.pos[2]];
          FX.burst(prev, accent, { count: 5, speed: 6, life: 0.25, size: 0.22 });
        }
        AUDIO.playShot('chain', { pan: pan });
        t.recoil = 0.6;
        break;
      }
      case 'cone': {
        var fwd = [Math.sin(t.yaw), 0, Math.cos(t.yaw)];
        var dmgC = s.dps / Math.max(0.001, s.fireRate);
        var any = false;
        for (var k = 0; k < G.denizens.length; k++) {
          var e = G.denizens[k];
          if (!inRange(t, e, s)) continue;
          var to = V.norm([e.pos[0] - t.pos[0], 0, e.pos[2] - t.pos[2]]);
          if (V.dot(to, fwd) < Math.cos(s.coneAngle)) continue;
          damage(e, dmgC, { element: def.element, source: t });
          if (e.alive && s.burn) { e.burn = Math.max(e.burn, s.burn.dps); e.burnT = Math.max(e.burnT, s.burn.dur); e.burnSrc = t; }
          any = true;
        }
        /* The flame is drawn as particles rather than geometry: a cone mesh
           reads as a solid object, and fire does not. */
        for (var f = 0; f < 12; f++) {
          var spread = (Math.random() - 0.5) * s.coneAngle * 2;
          var ca = Math.cos(spread), sa = Math.sin(spread);
          var d2 = [fwd[0] * ca - fwd[2] * sa, 0.12, fwd[0] * sa + fwd[2] * ca];
          FX.spawn({
            x: muzzleWorld[0], y: muzzleWorld[1], z: muzzleWorld[2],
            vx: d2[0] * (9 + Math.random() * 10), vy: 1.6 + Math.random() * 2,
            vz: d2[2] * (9 + Math.random() * 10),
            r: accent[0], g: accent[1], b: accent[2],
            life: 0.30 + Math.random() * 0.25, size: 0.5, size1: 1.5,
            rot: Math.random() * 6, rotv: (Math.random() - 0.5) * 6,
            kind: FX.KIND.SMOKE, drag: 2.6, grav: 2.2, alpha: 0.8
          });
        }
        AUDIO.playShot('cone', { pan: pan });
        t.recoil = 0.35;
        break;
      }
      case 'hitscan': {
        var dirH = V.norm([target.pos[0] - t.pos[0], 0, target.pos[2] - t.pos[2]]);
        var dmgH = s.dps / Math.max(0.001, s.fireRate);
        var hitCount = 0;
        for (var q = 0; q < G.denizens.length; q++) {
          var g2 = G.denizens[q];
          if (!g2.alive || g2.dying > 0) continue;
          if (g2.flying && !def.air) continue;
          /* Perpendicular distance to the firing line, forward only. */
          var rel = [g2.pos[0] - t.pos[0], 0, g2.pos[2] - t.pos[2]];
          var along = V.dot(rel, dirH);
          if (along < 0 || along > s.range * 1.4) continue;
          var perp = V.len(V.sub(rel, V.scale(dirH, along)));
          if (perp > 1.5) continue;
          damage(g2, dmgH, { element: def.element, source: t });
          hitCount++;
          if (hitCount > s.pierce) break;
        }
        t.beams = t.beams || [];
        t.beams.push({
          a: muzzleWorld.slice(),
          b: [t.pos[0] + dirH[0] * s.range * 1.4, muzzleWorld[1], t.pos[2] + dirH[2] * s.range * 1.4],
          life: 0.22, width: 0.5
        });
        FX.muzzle(muzzleWorld, dirH, accent);
        AUDIO.playShot('hitscan', { pan: pan });
        t.recoil = 1.4;
        FX.hit(0.4, { stop: 0.02 });
        break;
      }
    }
  }

  /* ---------- main step ---------- */

  function step(dt) {
    if (!G || G.status === 'won' || G.status === 'lost') return;
    try {
      G.time += dt;

      /* abilities */
      var ab = G.abilities;
      ab.q.cd = Math.max(0, ab.q.cd - dt);
      ab.e.cd = Math.max(0, ab.e.cd - dt);
      var wasQ = ab.q.active > 0, wasE = ab.e.active > 0;
      ab.q.active = Math.max(0, ab.q.active - dt);
      ab.e.active = Math.max(0, ab.e.active - dt);
      if (wasQ && ab.q.active <= 0) clearAbility('q');
      if (wasE && ab.e.active <= 0) clearAbility('e');

      stepWave(dt);
      stepDenizens(dt);
      stepTowers(dt);
      updateProjectiles(dt);
      stepDelayed(dt);

      /* Music intensity from board pressure: how much of the wave is alive and
         how close the leader is to the goal. */
      var pressure = 0;
      for (var i = 0; i < G.denizens.length; i++) {
        var d = G.denizens[i];
        if (!d.alive) continue;
        pressure += 0.035 + (d.dist / G.board.path.length) * 0.05;
        if (d.def.boss) pressure += 0.3;
      }
      AUDIO.setIntensity(U.clamp(pressure, 0, 1));
    } catch (e) {
      recordError('step', e);
    }
  }

  function stepDelayed(dt) {
    for (var i = G.delayed.length - 1; i >= 0; i--) {
      var d = G.delayed[i];
      d.t -= dt;
      if (d.t <= 0) {
        G.delayed.splice(i, 1);
        /* Reported, NOT swallowed. A delayed effect that throws every time it
           fires would otherwise be invisible forever. */
        try { d.fn(); } catch (e) { recordError('delayed:' + (d.tag || '?'), e); }
      }
    }
  }
  function after(seconds, fn, tag) {
    G.delayed.push({ t: seconds, fn: fn, tag: tag });
  }

  function stepWave(dt) {
    if (G.status !== 'play') return;
    if (G.waveActive) {
      G.waveTimer += dt;
      while (G.spawnQueue.length && G.spawnQueue[0].at <= G.waveTimer) {
        var s = G.spawnQueue.shift();
        spawnDenizen(s.of, {});
      }
      if (!G.spawnQueue.length) {
        var anyAlive = false;
        for (var i = 0; i < G.denizens.length; i++) {
          if (G.denizens[i].alive) { anyAlive = true; break; }
        }
        if (!anyAlive) endWave();
      }
    } else {
      G.waveTimer += dt;
      if (G.waveTimer >= G.betweenWaves) startWave();
    }
  }

  function stepDenizens(dt) {
    var w = 0;
    var pathLen = G.board.path.length;
    for (var i = 0; i < G.denizens.length; i++) {
      var d = G.denizens[i];

      if (!d.alive) {
        d.dying -= dt;
        if (d.dying > 0) { G.denizens[w++] = d; }
        continue;
      }

      /* status timers */
      if (d.markT > 0) { d.markT -= dt; if (d.markT <= 0) d.mark = null; }
      if (d.reactCd > 0) d.reactCd -= dt;
      if (d.sparkCd > 0) d.sparkCd -= dt;
      if (d.spawnT > 0) d.spawnT -= dt;
      if (d.slowT > 0) { d.slowT -= dt; if (d.slowT <= 0) d.slow = 0; }
      if (d.shredT > 0) { d.shredT -= dt; if (d.shredT <= 0) d.shred = 0; }
      if (d.stun > 0) d.stun -= dt;
      if (d.healRev > 0) d.healRev -= dt;
      if (d.airborne > 0) d.airborne -= dt;
      if (d.flash > 0) d.flash = Math.max(0, d.flash - dt * 4.5);

      /* damage over time */
      if (d.burnT > 0) {
        d.burnT -= dt * (G.commander.id === 'sevra' ? 0.72 : 1);
        damage(d, d.burn * dt, { element: null, source: d.burnSrc });
        if (!d.alive) { G.denizens[w++] = d; continue; }
        if (Math.random() < dt * 8) {
          FX.spawn({ x: d.pos[0] + (Math.random() - 0.5), y: d.pos[1] + Math.random() * 1.5, z: d.pos[2] + (Math.random() - 0.5),
            vx: 0, vy: 2.4, vz: 0, r: 1, g: 0.45, b: 0.3, life: 0.5, size: 0.3, size1: 0.05,
            rot: 0, rotv: 3, kind: FX.KIND.SPARK, drag: 1.5, grav: 3, alpha: 0.9 });
        }
      }
      if (d.poisonT > 0 && d.poisonStacks > 0) {
        d.poisonT -= dt;
        /* PERCENT-MAX-HP DAMAGE IS RESISTED BY BOSSES.
           Poison is meant to be the answer to something too big to shoot, and
           that is exactly why it needs a ceiling: a percentage of maximum
           health scales linearly with the wave curve, which multiplies health
           by more than 40x by wave twenty. Unbounded, one 145 gold tower
           out-damages the entire rest of the board against the HARBINGER.
           Measured before this: 45x the damage-per-gold of the next tower.
           Bosses take 30%, which keeps TOXIN the right pick against them
           without making it the only pick. */
        var pctMul = d.def.boss ? 0.30 : 1.0;
        damage(d, d.maxHp * d.poison * d.poisonStacks * pctMul * dt,
          { element: null, source: d.poisonSrc });
        if (!d.alive) { G.denizens[w++] = d; continue; }
        if (d.poisonT <= 0) d.poisonStacks = 0;
      }

      /* MENDER: heals nearby wounded, unless BLIGHT has reversed it. */
      if (d.def.trait === 'mender' && d.def.mend) {
        for (var m = 0; m < G.denizens.length; m++) {
          var o = G.denizens[m];
          if (!o.alive || o === d) continue;
          if (V.dist(o.pos, d.pos) > d.def.mend.radius) continue;
          if (o.healRev > 0) { damage(o, d.def.mend.rate * dt * 1.4, {}); }
          else if (o.hp < o.maxHp) o.hp = Math.min(o.maxHp, o.hp + d.def.mend.rate * dt);
        }
      }

      /* SUMMON */
      if (d.def.trait === 'summon' && d.def.summon) {
        d.summonT -= dt;
        if (d.summonT <= 0) {
          d.summonT = d.def.summon.every;
          for (var sc = 0; sc < d.def.summon.count; sc++) {
            spawnDenizen(d.def.summon.of, { dist: Math.max(0, d.dist - 1.5 - sc), hpScale: 0.7 });
          }
        }
      }

      /* BOSS PHASES */
      if (d.def.trait === 'boss' && d.def.phases) {
        var frac = d.hp / d.maxHp;
        while (d.phaseIdx < d.def.phases.length && frac <= d.def.phases[d.phaseIdx].at) {
          var ph = d.def.phases[d.phaseIdx];
          d.enrage = ph.enrage || d.enrage;
          if (ph.summon) {
            for (var q = 0; q < 3; q++) spawnDenizen(ph.summon, { dist: Math.max(0, d.dist - 3 - q * 2) });
          }
          FX.hit(1.8, { flash: 0.25, stop: 0.12, flashColor: [1, 0.18, 0.84] });
          AUDIO.play('bossSpawn');
          FX.shockRing([d.pos[0], d.pos[1] + 0.5, d.pos[2]], [1, 0.18, 0.84], 12, 0.7);
          FX.burst([d.pos[0], d.pos[1] + 1.5, d.pos[2]], [1, 0.18, 0.84],
            { count: 30, speed: 16, life: 0.7, size: 0.4 });
          FX.text([d.pos[0], d.pos[1] + 5, d.pos[2]], 'PHASE ' + (d.phaseIdx + 2),
            { color: '#ff2fd6', life: 1.6, size: 1.6, cls: 'reaction' });
          d.phaseIdx++;
        }
      }

      /* movement */
      var spd = d.speed * d.enrage;
      spd *= (1 - d.slow);
      spd *= (1 - G.globalBuffs.slowAll);
      if (d.stun > 0 || G.globalBuffs.stopAll > 0) spd = 0;
      if (d.airborne > 0) spd *= 0.15;
      d.dist += spd * dt;

      if (d.dist >= pathLen) { leak(d); G.denizens[w++] = d; continue; }

      var sample = G.board.pathAt(d.dist);
      var groundY = G.board.heightAt(sample.pos[0], sample.pos[2]);
      d.pos[0] = sample.pos[0];
      d.pos[2] = sample.pos[2];
      var baseY = d.flying ? groundY + 3.4 : groundY;
      if (d.airborne > 0) baseY += Math.sin(U.sat(d.airborne / 1.4) * Math.PI) * 5.5;
      d.pos[1] = baseY;

      var wantYaw = Math.atan2(sample.dir[0], sample.dir[2]);
      var dy = U.angDiff(d.yaw, wantYaw);
      /* Lean into the turn. Small, but it is most of what makes a walking
         creature look like it has mass rather than like it is on rails. */
      var leanTarget = U.clamp(-dy * 2.4, -0.35, 0.35);
      var lr = RIG.spring(d.lean, d.leanV, leanTarget, 55, dt);
      d.lean = lr[0]; d.leanV = lr[1];
      d.yaw += dy * Math.min(1, dt * 7);

      d.animPhase += dt * spd * (d.def.rig === 'crawler' ? 0.62 : 0.42) / Math.max(0.3, d.scale);
      G.denizens[w++] = d;
    }
    G.denizens.length = w;
  }

  function stepTowers(dt) {
    for (var i = 0; i < G.towers.length; i++) {
      var t = G.towers[i];
      var def = DATA.TOWERS[t.id];
      var s = stats(t);
      t.buildT = Math.min(1, t.buildT + dt * 1.8);
      t.recoil = Math.max(0, t.recoil - dt * 6.5);
      if (t.disabled > 0) { t.disabled -= dt; continue; }

      /* decay transient visual lists */
      if (t.arcs) {
        for (var a = t.arcs.length - 1; a >= 0; a--) {
          t.arcs[a].life -= dt;
          if (t.arcs[a].life <= 0) t.arcs.splice(a, 1);
        }
      }
      if (t.beams) {
        for (var b = t.beams.length - 1; b >= 0; b--) {
          t.beams[b].life -= dt;
          if (t.beams[b].life <= 0) t.beams.splice(b, 1);
        }
      }

      /* SUPPORT towers never target. */
      if (def.kind === 'support') { t.spin += dt * 0.7; continue; }

      /* FIELD towers apply continuously to everything in range. */
      if (def.kind === 'field') {
        t.spin += dt * 1.6;
        /* The element is applied on a beat, not on every substep. A field that
           marks 120 times a second is indistinguishable from one that marks
           twice a second except in how much noise it makes. */
        t.fieldT = (t.fieldT || 0) - dt;
        var applyEl = t.fieldT <= 0;
        if (applyEl) t.fieldT = 0.5;
        for (var f = 0; f < G.denizens.length; f++) {
          var d = G.denizens[f];
          if (!inRange(t, d, s)) continue;
          damage(d, s.dps * dt, { element: applyEl ? def.element : null, source: t });
          if (d.alive && s.pull > 0 && !d.def.boss) {
            /* Pull along the path rather than in space: moving a unit off its
               lane would desync its position from its progress and let it
               arrive without walking. */
            var toward = t.pos;
            var ahead = G.board.pathAt(Math.min(G.board.path.length, d.dist + 1));
            var closer = V.dist(ahead.pos, toward) < V.dist(d.pos, toward);
            d.dist += (closer ? 1 : -1) * s.pull * dt * 0.5;
            d.dist = Math.max(0, d.dist);
          }
        }
        continue;
      }

      /* SWEEP towers rotate at a fixed rate and damage what they cross. */
      if (def.kind === 'sweep') {
        t.sweepAngle += dt * s.sweepRate;
        t.yaw = t.sweepAngle;
        var fwd = [Math.sin(t.yaw), 0, Math.cos(t.yaw)];
        for (var k = 0; k < G.denizens.length; k++) {
          var e = G.denizens[k];
          if (!inRange(t, e, s)) continue;
          var to = V.norm([e.pos[0] - t.pos[0], 0, e.pos[2] - t.pos[2]]);
          if (V.dot(to, fwd) < 0.985) continue;
          damage(e, s.dps * dt * 3.2, { element: def.element, source: t });
        }
        if (!t.voice && AUDIO.isReady()) t.voice = AUDIO.beamVoice();
        if (t.voice) t.voice.set(0.35, panOf(t.pos), 0.4);
        continue;
      }

      /* Everything else needs a target. */
      var keep = t.target && inRange(t, t.target, s);
      if (!keep) t.target = pickTarget(t, s);
      var target = t.target;

      if (target) {
        var wantYaw = Math.atan2(target.pos[0] - t.pos[0], target.pos[2] - t.pos[2]);
        var dy = U.angDiff(t.yaw, wantYaw);
        /* Spring-damped tracking rather than a snap. A turret that snaps to
           its target reads as a UI element; one that swings and settles reads
           as a machine with mass. */
        var r = RIG.spring(0, t.yawVel, dy, 90, dt);
        t.yawVel = r[1];
        t.yaw += r[0];
      }

      if (def.kind === 'beam') {
        if (target) {
          if (t.lastTarget !== target) { t.beamRamp = 0; t.lastTarget = target; }
          t.beamRamp = Math.min(s.rampMax, t.beamRamp + dt * s.rampRate);
          t.beamOn = Math.min(1, t.beamOn + dt * 6);
          damage(target, s.dps * (1 + t.beamRamp) * dt, { element: def.element, source: t });
          if (!t.voice && AUDIO.isReady()) t.voice = AUDIO.beamVoice();
          if (t.voice) t.voice.set(t.beamOn, panOf(t.pos), t.beamRamp / Math.max(0.01, s.rampMax));
          if (Math.random() < dt * 22) {
            FX.burst([target.pos[0], target.pos[1] + 0.9 * target.scale, target.pos[2]],
              MODELS.tower(t.id, t.tier).accent, { count: 2, speed: 5, life: 0.28, size: 0.2 });
          }
        } else {
          t.beamOn = Math.max(0, t.beamOn - dt * 5);
          t.beamRamp = Math.max(0, t.beamRamp - dt * 1.4);
          if (t.voice) t.voice.set(0, panOf(t.pos), 0);
        }
        continue;
      }

      t.cooldown -= dt * s.fireRate * (def.kind === 'bullet' ? 1 : 1);
      if (target && t.cooldown <= 0) {
        t.cooldown += 1;
        fireTower(t, s, def, dt);
      }
      if (t.cooldown < -2) t.cooldown = 0;
    }
  }

  /* ---------- abilities ---------- */

  function clearAbility(slot) {
    var c = G.commander;
    var a = slot === 'q' ? c.q : c.e;
    if (!a) return;
    if (a.id === 'overclock') G.globalBuffs.fireRate = 1;
    if (a.id === 'dampen') G.globalBuffs.slowAll = 0;
    if (a.id === 'smokescreen') G.globalBuffs.stopAll = 0;
    if (a.id === 'lattice') G.globalBuffs.range = 1;
  }

  function useAbility(slot) {
    /* An unknown slot used to fall through to the E ability and then read
       G.abilities[slot], which is undefined for anything but q and e, and threw
       on .cd. Validating the slot first is one line and turns a crash into a
       refusal. */
    if (slot !== 'q' && slot !== 'e') return false;
    var c = G.commander;
    var a = slot === 'q' ? c.q : c.e;
    var st = G.abilities[slot];
    if (!a || !st || st.cd > 0 || G.status !== 'play') { AUDIO.play('denied'); return false; }
    st.cd = a.cd;
    st.active = a.dur || 0;
    AUDIO.play('ability');
    FX.hit(0.6, { flash: 0.10 });

    switch (a.id) {
      case 'overclock': G.globalBuffs.fireRate = 1.7; break;
      case 'dampen': G.globalBuffs.slowAll = 0.5; break;
      case 'smokescreen': G.globalBuffs.stopAll = 1; break;
      case 'lattice':
        G.globalBuffs.range = 1.3;
        for (var i = 0; i < G.towers.length; i++) G.towers[i].disabled = 0;
        break;
      case 'sanctify':
        G.lives = Math.min(G.maxLives, G.lives + 3);
        for (var j = 0; j < G.towers.length; j++) G.towers[j].disabled = 0;
        break;
      case 'zealotry': break; /* handled in stats() while active */
      case 'ravenous':
        for (var k = 0; k < G.denizens.length; k++) {
          var d = G.denizens[k];
          if (!d.alive) continue;
          d.poisonStacks = Math.min(6, d.poisonStacks + 3);
          d.poison = 0.012;
          d.poisonT = a.dur;
        }
        break;
      case 'consume': {
        var alive = G.denizens.filter(function (x) { return x.alive && !x.def.boss; });
        alive.sort(function (x, y) { return x.hp - y.hp; });
        var n = Math.ceil(alive.length / 3);
        for (var m = 0; m < n; m++) kill(alive[m], {});
        break;
      }
      case 'broadside': {
        var lead = null, best = -1;
        for (var p = 0; p < G.denizens.length; p++) {
          if (G.denizens[p].alive && G.denizens[p].dist > best) { best = G.denizens[p].dist; lead = G.denizens[p]; }
        }
        if (lead) {
          for (var s2 = 0; s2 < 7; s2++) {
            (function (idx) {
              after(idx * 0.11, function () {
                var at = G.board.pathAt(Math.max(0, best - 6 + idx * 3.2));
                var pos = [at.pos[0], G.board.heightAt(at.pos[0], at.pos[2]), at.pos[2]];
                for (var z = 0; z < G.denizens.length; z++) {
                  var dz = G.denizens[z];
                  if (!dz.alive) continue;
                  if (V.dist(dz.pos, pos) < 5.0) damage(dz, 190, { element: 'fire' });
                }
                FX.burst(pos, [1, 0.5, 0.25], { count: 22, speed: 14, life: 0.6, size: 0.5 });
                FX.shockRing(pos, [1, 0.5, 0.25], 7, 0.4);
                FX.smoke(pos, [0.4, 0.3, 0.35], 5, 1.4);
                AUDIO.play('impact_splash', { pan: panOf(pos) });
                FX.hit(0.7);
              }, 'broadside');
            })(s2);
          }
        }
        break;
      }
      case 'quake': {
        for (var qi = 0; qi < G.denizens.length; qi++) {
          var qd = G.denizens[qi];
          if (!qd.alive || qd.flying) continue;
          damage(qd, 160, { element: 'kinetic' });
          if (qd.alive) qd.stun = Math.max(qd.stun, 0.9);
        }
        FX.hit(2.0, { stop: 0.1, flash: 0.18 });
        var gp = G.board.pathAt(G.board.path.length * 0.5).pos;
        FX.shockRing([gp[0], 0.4, gp[2]], [0.7, 0.8, 1], 40, 0.7);
        break;
      }
    }
    return true;
  }

  function clear() {
    if (G) {
      for (var i = 0; i < G.towers.length; i++) {
        if (G.towers[i].voice) G.towers[i].voice.stop();
      }
    }
    errors.length = 0;
  }

  return {
    create: create, state: state, step: step,
    place: place, upgrade: upgrade, sell: sell, canPlace: canPlace, findPlot: findPlot,
    stats: stats, upgradeCost: upgradeCost, sellValue: sellValue, costOf: costOf,
    startWave: startWave, useAbility: useAbility,
    spawnDenizen: spawnDenizen, damage: damage, kill: kill,
    armorOf: armorOf, panOf: panOf, after: after,
    endGame: endGame, clear: clear,
    errors: function () { return errors.slice(); }
  };
})();


/* ===== 13-game.js ===== */
/* RELIQUARY :: 13-game
   The loop, the camera, the input, and the drawing of everything the sim
   owns. This is the layer where the simulation becomes a picture.

   FIXED TIMESTEP, INTERPOLATED NOTHING. The sim runs at a fixed 120Hz
   substep and the renderer draws whatever the latest state is. Interpolation
   was considered and rejected: at 120Hz the positional error is under a
   millimetre at gameplay speeds, and the bookkeeping to interpolate every
   rig, turret and particle would cost more than it buys.

   THE ACCUMULATOR IS CLAMPED. A backgrounded tab produces a multi-second dt on
   its first frame back. Feeding that to the accumulator makes the sim run
   hundreds of substeps in one frame, which locks the page for a second and
   then dumps a wave that spawned while nobody was looking. Clamping to 0.25s
   loses time and keeps the game playable, which is the correct trade. */
'use strict';

var GAME = (function () {

  var V = U.V;
  var canvas = null;
  var running = false;
  var raf = 0;
  var lastT = 0;
  var accum = 0;
  var STEP = 1 / 120;

  var speed = 1;
  var paused = false;
  var G = null;

  /* rig instances, keyed by denizen uid, pooled by archetype */
  var rigs = Object.create(null);
  var rigPool = Object.create(null);
  var liveUids = new Set();

  var cam = {
    yaw: 0, pitch: 0.86, dist: 74,
    targetYaw: 0, targetPitch: 0.86, targetDist: 74,
    focus: [0, 0, 0], targetFocus: [0, 0, 0],
    fitDist: 100, shakeSeed: 0
  };

  var input = {
    mx: 0, my: 0, down: false, dragging: false,
    lastX: 0, lastY: 0, dragDist: 0,
    hoverPlot: null, hoverTower: null, ground: null
  };

  var stats = { fps: 60, frameMs: 0, drawCalls: 0, particles: 0, tris: 0 };
  var fpsSamples = [];

  var errors = [];
  function recordError(where, e) {
    if (errors.length < 40) errors.push({ where: where, msg: String(e && e.message || e) });
    if (typeof console !== 'undefined') console.error('[GAME:' + where + ']', e);
  }

  /* ---------- boot ---------- */

  function init(cv) {
    canvas = cv;
    R.init(cv);
    resize();
    window.addEventListener('resize', resize);
    bindInput();
    return true;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    R.resize(w, h, Math.min(2, window.devicePixelRatio || 1));
    /* Re-fit on resize, so rotating a tablet or dragging a window narrow does
       not leave half the board off screen. */
    if (G) fitCamera(true);
  }

  function fitCamera(keepUserZoom) {
    if (!G) return;
    var aspect = R.W / Math.max(1, R.H);
    var extent = Math.max(G.board.halfW / aspect, G.board.halfH) * 1.12;
    var d = extent / Math.tan(R.cam.fov / 2);
    d = U.clamp(d, 30, 210);
    /* On a resize the player may have zoomed deliberately, so only the LIMIT
       moves; on a fresh run the camera snaps to the fit. */
    if (keepUserZoom) {
      cam.targetDist = Math.min(cam.targetDist, d);
    } else {
      cam.targetDist = cam.dist = d;
      cam.targetYaw = cam.yaw = 0;
      cam.targetPitch = cam.pitch = 0.86;
      cam.focus = [0, 0, 0];
      cam.targetFocus = [0, 0, 0];
    }
    cam.fitDist = d;
  }

  /* Board meshes belong to a RUN, not to the cache, because the board changes
     between runs. GL.mesh uploads a VAO and one or two buffers per call, and
     nothing reclaims them when the reference is dropped: WebGL objects are not
     garbage collected on the JS side. Twenty restarts leaked twenty ground
     meshes and twenty decor meshes of GPU memory, which is invisible until it
     is not. */
  var runMeshes = [];
  function trackMesh(m) { if (m) runMeshes.push(m); return m; }
  function disposeRunMeshes() {
    for (var i = 0; i < runMeshes.length; i++) {
      try { runMeshes[i].dispose(); } catch (e) { recordError('disposeMesh', e); }
    }
    runMeshes.length = 0;
  }

  function start(opts) {
    disposeRunMeshes();
    G = SIM.create(opts);
    R.setPalette(opts.faction || 'human');
    rigs = Object.create(null);
    rigPool = Object.create(null);
    FX.clear();

    /* Board meshes, rebuilt per run because the board can change. */
    G.groundMesh = trackMesh(GL.mesh(G.board.groundData));
    G.decorMesh = G.board.decorData ? trackMesh(GL.mesh(G.board.decorData)) : null;
    var pal = R.palette();
    G.goalMesh = MODELS.goalMesh(pal.accent);
    G.spawnMesh = MODELS.spawnMesh(PAINT.FACTIONS[G.enemyFaction].accent);
    G.rangeRing = MODELS.ring(0.985, 1.0, 72, pal.accent);
    G.plotRing = MODELS.ring(0.80, 1.0, 6, pal.accent);
    G.beamMesh = MODELS.beam('#ffffff');
    /* A near-solid disc: inner radius is a hair above zero so the fan does not
       emit degenerate triangles at the centre. */
    G.shadowDisc = MODELS.ring(0.02, 1.0, 18, '#ffffff');

    /* FRAME THE WHOLE BOARD, computed rather than guessed.
       A hand-picked multiplier cropped the plate at 16:9 and would have
       cropped it differently at every other aspect ratio. The half-extent the
       camera must cover is halfW/aspect horizontally or halfH vertically,
       whichever is larger, and the distance that covers it is that extent over
       tan(fov/2). The 1.12 is real margin for the spires that sit outside the
       play area. */
    fitCamera();
    G.status = 'play';
    G.waveTimer = 0;
    speed = 1;
    paused = false;
    AUDIO.startMusic();
    if (!running) { running = true; lastT = U.nowMs(); raf = requestAnimationFrame(frame); }
    return G;
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    AUDIO.stopMusic();
    SIM.clear();
  }

  /* ---------- input ---------- */

  function bindInput() {
    canvas.addEventListener('mousemove', function (e) {
      input.mx = e.clientX; input.my = e.clientY;
      if (input.down) {
        var dx = e.clientX - input.lastX, dy = e.clientY - input.lastY;
        input.dragDist += Math.abs(dx) + Math.abs(dy);
        if (input.dragDist > 5) input.dragging = true;
        if (input.dragging) {
          cam.targetYaw -= dx * 0.005;
          cam.targetPitch = U.clamp(cam.targetPitch + dy * 0.004, 0.42, 1.32);
        }
      }
      input.lastX = e.clientX; input.lastY = e.clientY;
    });
    canvas.addEventListener('mousedown', function (e) {
      input.down = true; input.dragging = false; input.dragDist = 0;
      input.lastX = e.clientX; input.lastY = e.clientY;
      AUDIO.resume();
    });
    window.addEventListener('mouseup', function (e) {
      if (input.down && !input.dragging) handleClick(e.button);
      input.down = false; input.dragging = false;
    });
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      cam.targetDist = U.clamp(cam.targetDist * (1 + Math.sign(e.deltaY) * 0.10), 26, (cam.fitDist || 160) * 1.15);
    }, { passive: false });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    /* Touch: one finger orbits, two pinch to zoom. Enough to be playable on a
       tablet without pretending this is a mobile-first layout. */
    var touchDist = 0;
    canvas.addEventListener('touchstart', function (e) {
      AUDIO.resume();
      if (e.touches.length === 1) {
        input.lastX = e.touches[0].clientX; input.lastY = e.touches[0].clientY;
        input.mx = input.lastX; input.my = input.lastY;
        input.down = true; input.dragging = false; input.dragDist = 0;
      } else if (e.touches.length === 2) {
        touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                               e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', function (e) {
      if (e.touches.length === 1 && input.down) {
        var dx = e.touches[0].clientX - input.lastX, dy = e.touches[0].clientY - input.lastY;
        input.dragDist += Math.abs(dx) + Math.abs(dy);
        if (input.dragDist > 8) input.dragging = true;
        if (input.dragging) {
          cam.targetYaw -= dx * 0.006;
          cam.targetPitch = U.clamp(cam.targetPitch + dy * 0.005, 0.42, 1.32);
        }
        input.lastX = e.touches[0].clientX; input.lastY = e.touches[0].clientY;
        input.mx = input.lastX; input.my = input.lastY;
      } else if (e.touches.length === 2) {
        var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
        if (touchDist > 0) cam.targetDist = U.clamp(cam.targetDist * (touchDist / d), 26, (cam.fitDist || 160) * 1.15);
        touchDist = d;
      }
    }, { passive: true });
    canvas.addEventListener('touchend', function () {
      if (input.down && !input.dragging) handleClick(0);
      input.down = false; input.dragging = false; touchDist = 0;
    }, { passive: true });
  }

  function handleClick(button) {
    if (!G || G.status !== 'play') return;
    AUDIO.resume();
    if (button === 2) { G.selected = null; G.inspecting = null; UI.refresh(); return; }
    if (input.hoverPlot && G.selected) {
      var r = SIM.place(input.hoverPlot.id, G.selected);
      if (r) {
        AUDIO.play('build', { pan: SIM.panOf(r.pos) });
        FX.burst([r.pos[0], r.pos[1] + 1, r.pos[2]], R.palette().rim,
          { count: 18, speed: 8, life: 0.6, size: 0.4 });
        FX.shockRing([r.pos[0], r.pos[1] + 0.2, r.pos[2]], R.palette().rim, 5, 0.4);
        FX.hit(0.25);
        G.inspecting = r;
        /* Keep the tower selected so a player laying down a line of the same
           tower does not have to re-pick it every single time. */
        if (G.gold < DATA.TOWERS[G.selected].cost) G.selected = null;
      } else {
        AUDIO.play('denied');
      }
      UI.refresh();
      return;
    }
    if (input.hoverTower) {
      G.inspecting = input.hoverTower;
      G.selected = null;
      AUDIO.play('click');
      UI.refresh();
      return;
    }
    G.inspecting = null;
    G.selected = null;
    UI.refresh();
  }

  function keydown(e) {
    if (!G) return;
    var k = e.key;
    AUDIO.resume();
    if (k === ' ') { e.preventDefault(); toggleSpeed(); return; }
    if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
    if (k === 'q' || k === 'Q') { SIM.useAbility('q'); UI.refresh(); return; }
    if (k === 'e' || k === 'E') { SIM.useAbility('e'); UI.refresh(); return; }
    if (k === 'u' || k === 'U') {
      if (G.inspecting && SIM.upgrade(G.inspecting)) {
        AUDIO.play('upgrade', { pan: SIM.panOf(G.inspecting.pos) });
        FX.burst([G.inspecting.pos[0], G.inspecting.pos[1] + 2, G.inspecting.pos[2]],
          R.palette().rim, { count: 22, speed: 9, life: 0.7, size: 0.4 });
      } else AUDIO.play('denied');
      UI.refresh();
      return;
    }
    if (k === 's' || k === 'S') {
      if (G.inspecting) {
        AUDIO.play('sell', { pan: SIM.panOf(G.inspecting.pos) });
        FX.burst([G.inspecting.pos[0], G.inspecting.pos[1] + 1, G.inspecting.pos[2]],
          [0.9, 0.75, 0.3], { count: 14, speed: 7, life: 0.6, size: 0.34 });
        SIM.sell(G.inspecting);
      }
      UI.refresh();
      return;
    }
    if (k === 'Enter') { if (!G.waveActive) { SIM.startWave(); UI.refresh(); } return; }
    var n = parseInt(k, 10);
    if (!isNaN(n) && n >= 1 && n <= 9) {
      var id = DATA.TOWER_ORDER[n - 1];
      if (id) { G.selected = (G.selected === id) ? null : id; AUDIO.play('click'); UI.refresh(); }
    }
  }

  function toggleSpeed() {
    speed = speed === 1 ? 2 : (speed === 2 ? 4 : 1);
    UI.refresh();
  }
  function togglePause() {
    paused = !paused;
    UI.refresh();
  }

  /* ---------- picking ---------- */

  function updateHover() {
    input.hoverPlot = null;
    input.hoverTower = null;
    if (!G || G.status !== 'play') return;
    var g = R.screenToGround(input.mx, input.my, 0);
    input.ground = g;
    if (!g) return;
    var best = null, bestD = 1e9, bestT = null;
    for (var i = 0; i < G.board.plots.length; i++) {
      var p = G.board.plots[i];
      var dx = p.x - g[0], dz = p.z - g[2];
      var d = dx * dx + dz * dz;
      if (d < bestD) { bestD = d; best = p; }
    }
    /* A generous radius: the player is pointing at a plot on a tilted plane
       through a perspective camera, and demanding pixel accuracy there feels
       broken rather than precise. */
    if (best && bestD < 9.0) {
      if (best.tower) { input.hoverTower = best.tower; bestT = best.tower; }
      else if (G.selected) input.hoverPlot = best;
      else input.hoverPlot = best;
    }
  }

  /* ---------- animation ----------
     Everything below decides how the game MOVES, which is most of what makes
     it feel expensive. */

  function rigFor(d) {
    var r = rigs[d.uid];
    if (r) return r;
    var model = MODELS.denizen(d.def.rig, G.enemyFaction);
    /* Pool by archetype: a wave spawns and dies in bursts, and building a
       fresh part tree for every chitling is a guaranteed allocation spike at
       exactly the moment the screen is busiest. */
    var pool = rigPool[d.def.rig] || (rigPool[d.def.rig] = []);
    r = pool.pop();
    if (!r) {
      r = RIG.build(model.parts.map(function (p) {
        return { name: p.name, parent: p.parent, bind: p.bind, mesh: p.mesh };
      }));
    }
    /* The archetype is stamped on the rig so the release pass can put it back
       in the right pool without needing the denizen that owned it, which by
       then may already be gone from the list. */
    r.__arch = d.def.rig;
    rigs[d.uid] = r;
    return r;
  }

  function poseDenizen(d, rig, dt) {
    RIG.rest(rig);
    var body = rig.get('body');
    var moving = d.stun <= 0 && d.airborne <= 0;

    if (d.def.rig === 'flyer') {
      /* Flyers bank into the turn and bob on a slow sine. The vanes counter
         rotate, which is a two-line touch that reads as active control
         surfaces rather than as a decoration. */
      var t = G.time * 2.2 + d.animPhase * 9;
      if (body) {
        body.pos[1] = Math.sin(t) * 0.22;
        body.rot[2] = d.lean * 1.6 + Math.sin(t * 0.7) * 0.06;
        body.rot[0] = Math.sin(t * 1.3) * 0.05 - 0.06;
      }
      var vl = rig.get('vaneL'), vr = rig.get('vaneR');
      if (vl) vl.rot[2] = Math.sin(t * 3.1) * 0.20 - d.lean * 0.5;
      if (vr) vr.rot[2] = -Math.sin(t * 3.1) * 0.20 - d.lean * 0.5;
      return;
    }

    /* WALKING RIGS. Legs are driven by gait + IK to world-stationary foot
       targets, expressed in the creature's local frame. */
    var legCount = 0;
    while (rig.get('legU' + legCount)) legCount++;
    if (!legCount) return;

    var strideLen = d.def.rig === 'crawler' ? 1.0 : 1.5;
    var lift = d.def.rig === 'crawler' ? 0.28 : 0.45;
    var upperLen = d.def.rig === 'crawler' ? 0.44 : (d.def.rig === 'strider' ? 1.25 : 0.92);
    var lowerLen = d.def.rig === 'crawler' ? 0.50 : (d.def.rig === 'strider' ? 1.15 : 0.88);
    var hipY = upperLen + lowerLen;

    var plantedCount = 0;
    var bodyDip = 0;
    for (var i = 0; i < legCount; i++) {
      var up = rig.get('legU' + i);
      if (!up) continue;
      /* Diagonal gait: legs on opposite corners move together, which is what
         a real quadruped does and reads instantly as animal rather than as
         machine. Bipeds get a simple half-cycle offset. */
      var phaseOff = legCount === 2 ? (i * 0.5) : ((i === 0 || i === 3) ? 0 : 0.5);
      var phase = d.animPhase + phaseOff;
      var g = moving ? RIG.gait(phase, strideLen, lift, 0.6)
                     : { x: 0, y: 0, planted: true, t: 0 };
      if (g.planted) { plantedCount++; }

      var hip = [up.bind[0], hipY, up.bind[2]];
      var foot = [up.bind[0] * 1.06, g.y, up.bind[2] + g.x];
      /* The pole points forward so knees bend backward on the rear pair and
         forward on the front, which is the difference between a walking
         creature and a folding chair. */
      var pole = [0, 0, (legCount > 2 && i >= 2) ? -1 : 1];
      RIG.driveLeg(rig, 'legU' + i, 'legL' + i, hip, foot, upperLen, lowerLen, pole);
      if (g.planted) bodyDip += Math.sin(g.t * Math.PI) * 0.04;
    }

    if (body) {
      /* Body bob at twice stride frequency, plus the dip from loaded legs.
         Weight is most of what separates expensive animation from cheap. */
      var bobT = d.animPhase * U.TAU * 2;
      body.pos[1] = (moving ? Math.sin(bobT) * 0.085 : Math.sin(G.time * 1.6 + d.animPhase * 6) * 0.03) - bodyDip;
      body.rot[2] = d.lean;
      body.rot[0] = moving ? Math.sin(bobT + 1.1) * 0.045 : 0;
      body.rot[1] = Math.sin(d.animPhase * U.TAU) * 0.06;
      /* BREATH. A half-percent vertical swell on the chest, so a standing
         body is never a statue at rest. */
      body.scl[0] = body.scl[2] = 1 + Math.sin(G.time * 2.3 + d.animPhase * 4) * 0.006;
      body.scl[1] = 1 + Math.sin(G.time * 2.3 + d.animPhase * 4 + 1.7) * 0.008;
    }
    /* Heavy frames kick up dust when they plant. Gated to big silhouettes so
       a crowd of chitlings does not bury the lane in particles. */
    if (d.scale >= 1.3 && plantedCount > 0 && moving && Math.random() < dt * 3.5) {
      FX.dust([d.pos[0], d.pos[1], d.pos[2]], [0.35, 0.28, 0.5], 2, 1.0);
    }
    var head = rig.get('head');
    if (head) {
      /* The head lags the body and looks slightly toward the goal, so the
         creature reads as intent rather than as a machine on a rail. A slow
         scan while moving keeps the neck alive. */
      head.rot[0] = -0.12 + Math.sin(d.animPhase * U.TAU * 2 + 2.2) * 0.05;
      head.rot[1] = Math.sin(d.animPhase * U.TAU + 0.7) * 0.10 - d.lean * 0.5 + Math.sin(G.time * 0.9 + d.uid) * 0.04;
    }
    /* Stun and launch read on the pose, not just on a status icon. */
    if (d.stun > 0 && body) {
      body.rot[2] += Math.sin(G.time * 30) * 0.12;
    }
    if (d.airborne > 0 && body) {
      body.rot[0] += d.airborne * 0.8;
      body.rot[2] += Math.sin(G.time * 6) * 0.3;
    }
  }

  /* ---------- draw ---------- */

  var TMP = U.m4ident();

  function drawDenizens() {
    var pal = PAINT.FACTIONS[G.enemyFaction] || PAINT.FACTIONS.xeno;
    for (var i = 0; i < G.denizens.length; i++) {
      var d = G.denizens[i];
      var rig = rigFor(d);
      var dying = !d.alive && d.dying > 0;

      var scale = d.scale;
      /* SPAWN POP. A body arrives at 60% size and springs to full, so the
         spawn ring (in the sim) and the body land on the same beat. */
      if (d.spawnT > 0) {
        scale *= U.ease.outBack(U.sat(1 - d.spawnT / 0.32));
      }
      /* Squash and stretch on hit. Brief, and the single cheapest way to make
         a hit feel like it connected. */
      var sq = 1 + d.flash * 0.16;
      var sy = scale * (1 - d.flash * 0.12) * (dying ? Math.max(0.1, d.dying / 0.55) : 1);

      var root = U.m4trs(d.pos[0], d.pos[1], d.pos[2], 0, d.yaw, 0,
        scale * sq, sy, scale * sq, TMP);

      poseDenizen(d, rig, 0);
      RIG.resolve(rig, root);

      /* THE SHATTER, fired exactly once on the frame a body starts dying.
         It reads the model's own facets and throws each one as a flake in its
         own colour, so the creature comes apart into the strokes it was
         painted with rather than into generic debris. The `shattered` flag is
         on the denizen rather than local, because this runs every frame while
         the corpse fades and firing it twice would double every death. */
      if (dying && !d.shattered) {
        d.shattered = true;
        var mdl = MODELS.denizen(d.def.rig, G.enemyFaction);
        var origin = [d.pos[0], d.pos[1] + 0.8 * scale, d.pos[2]];
        for (var pi = 0; pi < mdl.parts.length; pi++) {
          var part = rig.parts[pi];
          if (!part || !mdl.parts[pi].data) continue;
          FX.shatter(mdl.parts[pi].data, part.world, {
            max: d.def.boss ? 30 : 12,
            force: d.def.boss ? 13 : 8,
            size: 0.34 * scale,
            origin: origin
          });
        }
      }

      var opts = {
        flash: d.flash * 0.8,
        flashColor: d.mark ? U.hex2rgb(DATA.ELEMENTS[d.mark].color) : [1, 0.85, 0.9],
        dissolve: dying ? U.sat(1 - d.dying / 0.55) * 0.9 : 0
      };
      RIG.draw(rig, opts);

      /* A CONTACT SHADOW under every body.
         The shadow map alone does not do this job: a unit is small, its cast
         shadow falls away from the camera, and against a lit lane the body
         ends up looking pasted on rather than standing on the ground. A dark
         disc directly beneath it costs one blended draw and is most of what
         makes a unit feel present. Flyers get a smaller, fainter one further
         below, which also reads as altitude. */
      if (!dying) {
        var groundY = G.board.heightAt(d.pos[0], d.pos[2]);
        var alt = d.pos[1] - groundY;
        var shR = scale * (d.flying ? 0.62 : 0.92) / (1 + alt * 0.10);
        /* A COOL-HUED SHADOW POOL, bright enough to read on the dark board.
           Unit shadows are the primary depth cue at gameplay distance, so
           they sit just above the paint's darkest band instead of inside it. */
        R.pushUnlit(G.shadowDisc,
          U.m4trs(d.pos[0], groundY + 0.06, d.pos[2], 0, 0, 0, shR, 1, shR),
          { tint: [0.075, 0.035, 0.115], alpha: U.clamp(0.62 / (1 + alt * 0.18), 0.12, 0.62),
            additive: false });
      }

      /* A mark ring under a marked body, so the player can see at a glance
         which reaction is available without reading a health bar. */
      if (d.mark && !dying) {
        var mc = U.hex2rgb(DATA.ELEMENTS[d.mark].color);
        R.pushUnlit(G.rangeRing,
          U.m4trs(d.pos[0], d.pos[1] + 0.08, d.pos[2], 0, G.time * 1.2, 0,
            1.1 * scale, 1, 1.1 * scale),
          { tint: mc, alpha: 0.55, additive: true, pulse: 0.5 });
      }
    }
  }

  function drawTowers() {
    var pal = R.palette();
    beamCount = 0;
    for (var i = 0; i < G.towers.length; i++) {
      var t = G.towers[i];
      var model = MODELS.tower(t.id, t.tier);
      var def = DATA.TOWERS[t.id];
      var s = SIM.stats(t);

      /* BUILD-IN. A tower rises and settles rather than appearing. The
         overshoot is what makes it land. */
      var b = U.sat(t.buildT);
      var rise = (1 - U.ease.outBack(b)) * -2.4;
      var bs = 0.7 + 0.3 * U.ease.outBack(b);

      R.push(model.base,
        U.m4trs(t.pos[0], t.pos[1] + rise, t.pos[2], 0, 0, 0, bs, bs, bs),
        { dissolve: (1 - b) * 0.55 });

      /* A grounding shadow under EVERY tower, not just a selected one, so a
         tower reads as standing on the paint rather than floating over it. */
      R.pushUnlit(G.shadowDisc,
        U.m4trs(t.pos[0], t.pos[1] + 0.07, t.pos[2], 0, 0, 0, 1.5 + bs * 0.2, 1, 1.5 + bs * 0.2),
        { tint: [0.075, 0.035, 0.115], alpha: 0.4, additive: false });

      if (model.turret) {
        /* IDLE SCAN. With no target the turret hunts gently instead of
           freezing, which is the cheapest sign a machine is alive. */
        var idleYaw = t.target ? 0 : Math.sin(G.time * 0.45 + t.uid) * 0.35;
        /* Recoil pushes the turret back along its own facing. */
        var rec = t.recoil * 0.42;
        var tx = t.pos[0] - Math.sin(t.yaw + idleYaw) * rec;
        var tz = t.pos[2] - Math.cos(t.yaw + idleYaw) * rec;
        var ty = t.pos[1] + model.turretY + rise;
        var spin = def.kind === 'support' ? t.spin : 0;
        R.push(model.turret,
          U.m4trs(tx, ty, tz, 0, t.yaw + idleYaw + spin, 0, bs, bs, bs),
          { dissolve: (1 - b) * 0.55 });
        if (model.barrel) {
          /* The barrel recoils further than the turret, and CYCLONE's fan
             spins continuously instead. */
          var brec = def.kind === 'cone' ? 0 : t.recoil * 0.75;
          var bx = t.pos[0] - Math.sin(t.yaw) * brec;
          var bz = t.pos[2] - Math.cos(t.yaw) * brec;
          var barrelSpin = t.id === 'cyclone' ? t.spin : 0;
          R.push(model.barrel,
            U.m4trs(bx, ty, bz, 0, t.yaw, barrelSpin, bs, bs, bs),
            { dissolve: (1 - b) * 0.55 });
        }
      }

      /* BEAM towers draw a continuous shaft to their target. */
      if (def.kind === 'beam' && t.target && t.beamOn > 0.02) {
        drawBeam(
          muzzleWorldOf(t, model),
          [t.target.pos[0], t.target.pos[1] + 0.8 * t.target.scale, t.target.pos[2]],
          model.accent, 0.10 + t.beamRamp * 0.10, t.beamOn * 0.9);
      }
      /* SWEEP towers draw a fixed-length shaft along their facing. */
      if (def.kind === 'sweep') {
        var from = muzzleWorldOf(t, model);
        var to = [from[0] + Math.sin(t.yaw) * s.range, from[1] - 0.6, from[2] + Math.cos(t.yaw) * s.range];
        drawBeam(from, to, model.accent, 0.22, 0.55);
      }
      /* FIELD towers draw a pulsing dome. */
      if (def.kind === 'field') {
        R.pushUnlit(MODELS.dome('#ffffff'),
          U.m4trs(t.pos[0], t.pos[1] + 0.1, t.pos[2], 0, t.spin * 0.4, 0, s.range, s.range * 0.55, s.range),
          { tint: model.accent, alpha: 0.10, additive: true, fresnel: 0.9, pulse: 0.35 });
      }
      /* transient arcs and hitscan beams */
      if (t.arcs) {
        for (var a = 0; a < t.arcs.length; a++) {
          var arc = t.arcs[a];
          drawBeam(arc.a, arc.b, model.accent, 0.09, U.sat(arc.life / 0.16));
        }
      }
      if (t.beams) {
        for (var bm = 0; bm < t.beams.length; bm++) {
          var be = t.beams[bm];
          drawBeam(be.a, be.b, model.accent, be.width * U.sat(be.life / 0.22), U.sat(be.life / 0.22));
        }
      }
    }
  }

  function muzzleWorldOf(t, model) {
    var m = model.muzzle;
    var cy = Math.cos(t.yaw), sy = Math.sin(t.yaw);
    return [
      t.pos[0] + m[0] * cy + m[2] * sy,
      t.pos[1] + model.turretY + m[1],
      t.pos[2] + (-m[0] * sy + m[2] * cy)
    ];
  }

  /* A beam is a unit prism scaled and aimed. Building the matrix by hand from
     an orthonormal basis is both cheaper and more stable than composing two
     rotations, which gimbal-locks when the beam points straight down.
     MATRICES ARE POOLED: a beam-heavy frame (prism + arc) can build dozens of
     beams, and a fresh matrix per beam per frame was measured as persistent
     GC churn on the render path. The pool resets per frame in drawTowers. */
  var beamPool = [];
  var beamCount = 0;
  function drawBeam(a, b, color, width, alpha) {
    var d = V.sub(b, a);
    var len = V.len(d);
    if (len < 0.01) return;
    var fwd = V.scale(d, 1 / len);
    var up = Math.abs(fwd[1]) > 0.95 ? [1, 0, 0] : [0, 1, 0];
    var right = V.norm(V.cross(up, fwd));
    var realUp = V.cross(fwd, right);
    var m = beamPool[beamCount] || (beamPool[beamCount] = new Float32Array(16));
    beamCount++;
    m[0] = right[0] * width; m[1] = right[1] * width; m[2] = right[2] * width; m[3] = 0;
    m[4] = realUp[0] * width; m[5] = realUp[1] * width; m[6] = realUp[2] * width; m[7] = 0;
    m[8] = fwd[0] * len; m[9] = fwd[1] * len; m[10] = fwd[2] * len; m[11] = 0;
    m[12] = a[0]; m[13] = a[1]; m[14] = a[2]; m[15] = 1;
    R.pushUnlit(G.beamMesh, m, { tint: color, alpha: alpha, additive: true, pulse: 0.25 });
  }

  function drawProjectiles() {
    for (var i = 0; i < G.projs.length; i++) {
      var p = G.projs[i];
      var el = DATA.ELEMENTS[p.element];
      var col = el ? el.color : '#ffffff';
      var mesh = MODELS.projectile(p.splash > 0 ? 'shell' : 'bolt', col);
      var yaw = p.dir ? Math.atan2(p.dir[0], p.dir[2]) : 0;
      var pitch = p.dir ? Math.asin(U.clamp(-p.dir[1], -1, 1)) : 0;
      var sc = p.splash > 0 ? 1.5 : 1.1;
      R.push(mesh, U.m4trs(p.pos[0], p.pos[1], p.pos[2], pitch, yaw, p.spin, sc, sc, sc),
        { castShadow: false });
      /* A short trail, emitted rather than drawn, so it inherits the paint
         particle look instead of being a stripe. */
      if (Math.random() < 0.75) {
        var c = U.hex2rgb(col);
        FX.spawn({
          x: p.pos[0], y: p.pos[1], z: p.pos[2],
          vx: 0, vy: 0, vz: 0, r: c[0], g: c[1], b: c[2],
          life: 0.20, size: sc * 0.30, size1: 0.02,
          rot: Math.random() * 6, rotv: 0,
          kind: FX.KIND.SPARK, drag: 6, grav: 0, alpha: 0.85
        });
      }
    }
  }

  function drawBoard() {
    R.push(G.groundMesh, U.m4ident(), { castShadow: false, facetJitter: 0.26 });
    if (G.decorMesh) R.push(G.decorMesh, U.m4ident());

    var pal = R.palette();
    var sp = G.board.spawn, gl = G.board.goal;
    R.push(G.spawnMesh, U.m4trs(sp[0], G.board.heightAt(sp[0], sp[2]) - 0.3, sp[2], 0, 0, 0, 1, 1, 1));
    R.push(G.goalMesh, U.m4trs(gl[0], G.board.heightAt(gl[0], gl[2]) - 0.2, gl[2], 0, 0, 0, 1, 1, 1));

    /* The goal pulses harder as lives drop, which is a readable panic signal
       that costs nothing and needs no UI. */
    var danger = 1 - G.lives / G.maxLives;
    R.pushUnlit(G.rangeRing,
      U.m4trs(gl[0], G.board.heightAt(gl[0], gl[2]) + 0.15, gl[2], 0, G.time * 0.5, 0, 4.5, 1, 4.5),
      { tint: danger > 0.5 ? [1, 0.3, 0.35] : pal.rim, alpha: 0.4 + danger * 0.4, additive: true, pulse: 0.6 + danger });

    /* Build plots. Only drawn while a tower is selected, so the board is not
       permanently covered in UI. */
    if (G.selected) {
      var def = DATA.TOWERS[G.selected];
      var afford = G.gold >= def.cost;
      for (var i = 0; i < G.board.plots.length; i++) {
        var p = G.board.plots[i];
        if (p.tower) continue;
        var isHover = input.hoverPlot === p;
        var col = afford ? (isHover ? pal.rim : pal.keyRgb) : [0.7, 0.25, 0.3];
        R.pushUnlit(G.plotRing,
          U.m4trs(p.x, p.y + 0.12, p.z, 0, 0.4, 0, 1.5, 1, 1.5),
          { tint: col, alpha: isHover ? 0.85 : 0.32, additive: true, pulse: isHover ? 0.5 : 0 });
      }
      /* Ghost preview at the hovered plot, including its range. */
      if (input.hoverPlot) {
        var m = MODELS.tower(G.selected, 0);
        var hp = input.hoverPlot;
        R.push(m.base, U.m4trs(hp.x, hp.y, hp.z, 0, 0, 0, 1, 1, 1),
          { dissolve: 0.45, castShadow: false, alpha: 0.6 });
        R.pushUnlit(G.rangeRing,
          U.m4trs(hp.x, hp.y + 0.16, hp.z, 0, 0, 0, def.range, 1, def.range),
          { tint: afford ? pal.rim : [1, 0.3, 0.3], alpha: 0.5, additive: true, pulse: 0.3 });
      }
    }

    /* Range ring for the inspected or hovered tower. */
    var show = G.inspecting || input.hoverTower;
    if (show) {
      var st = SIM.stats(show);
      if (st.range > 0) {
        R.pushUnlit(G.rangeRing,
          U.m4trs(show.pos[0], show.pos[1] + 0.16, show.pos[2], 0, 0, 0, st.range, 1, st.range),
          { tint: pal.rim, alpha: 0.55, additive: true, pulse: 0.25 });
      }
      R.pushUnlit(G.plotRing,
        U.m4trs(show.pos[0], show.pos[1] + 0.14, show.pos[2], 0, 0.4, 0, 1.7, 1, 1.7),
        { tint: pal.rim, alpha: 0.7, additive: true, pulse: 0.4 });
    }
  }

  /* ---------- frame ---------- */

  function frame(now) {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    var t0 = U.nowMs();
    try {
      var dt = (now - lastT) / 1000;
      lastT = now;
      if (!isFinite(dt) || dt < 0) dt = 1 / 60;
      /* Clamped: see the header note on backgrounded tabs. */
      dt = Math.min(dt, 0.25);

      fpsSamples.push(dt);
      if (fpsSamples.length > 40) fpsSamples.shift();
      var avg = 0;
      for (var f = 0; f < fpsSamples.length; f++) avg += fpsSamples[f];
      stats.fps = fpsSamples.length / Math.max(1e-6, avg);

      AUDIO.tick(dt);
      FX.updateImpact(dt);

      var simDt = paused ? 0 : FX.consumeStop(dt) * speed;
      if (simDt > 0 && G) {
        accum += simDt;
        var steps = 0;
        while (accum >= STEP && steps < 40) {
          SIM.step(STEP);
          accum -= STEP;
          steps++;
        }
        if (steps >= 40) accum = 0;
        FX.update(simDt);
        FX.updateText(simDt);

        /* RETURN RIGS OF DEPARTED DENIZENS TO THE POOL.
           Done here rather than in the sim because a rig is a presentation
           concern the sim knows nothing about. The live-uid set is rebuilt
           each pass: the previous version compared `key | 0` against uids
           inside a nested loop, which was both O(rigs x denizens) every frame
           and leaked, because it deleted the entry without ever pushing the
           rig back to its pool. Left alone that turns the pool into a
           permanent allocator and defeats the reason it exists. */
        liveUids.clear();
        for (var li = 0; li < G.denizens.length; li++) liveUids.add(G.denizens[li].uid);
        for (var key in rigs) {
          if (liveUids.has(+key)) continue;
          var rr = rigs[key];
          delete rigs[key];
          var arch = rr && rr.__arch;
          if (arch) {
            var pool = rigPool[arch] || (rigPool[arch] = []);
            if (pool.length < 48) pool.push(rr);
          }
        }
      }

      if (G) {
        updateCamera(dt);
        updateHover();
        /* AMBIENT EMBERS. A quiet drift of embers along the lane keeps the
           painted ground alive even between waves. Low rate, low alpha. */
        if (Math.random() < dt * 5) {
          var amb = G.board.pathAt(Math.random() * G.board.path.length);
          var er = R.palette().rim;
          FX.ember([amb.pos[0] + (Math.random() - 0.5) * 6, amb.pos[1] + 0.3, amb.pos[2] + (Math.random() - 0.5) * 6], er);
        }
        R.reset();
        drawBoard();
        drawTowers();
        drawDenizens();
        drawProjectiles();
        FX.submit();
        R.render(dt);
        UI.tickOverlay(dt);
      }
      stats.particles = FX.count;
      stats.frameMs = U.nowMs() - t0;
    } catch (e) {
      recordError('frame', e);
    }
  }

  function updateCamera(dt) {
    cam.yaw = U.damp(cam.yaw, cam.targetYaw, 9, dt);
    cam.pitch = U.damp(cam.pitch, cam.targetPitch, 9, dt);
    cam.dist = U.damp(cam.dist, cam.targetDist, 8, dt);
    cam.focus[0] = U.damp(cam.focus[0], cam.targetFocus[0], 5, dt);
    cam.focus[1] = U.damp(cam.focus[1], cam.targetFocus[1], 5, dt);
    cam.focus[2] = U.damp(cam.focus[2], cam.targetFocus[2], 5, dt);

    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    R.cam.pos = [
      cam.focus[0] + Math.sin(cam.yaw) * cp * cam.dist,
      cam.focus[1] + sp * cam.dist,
      cam.focus[2] + Math.cos(cam.yaw) * cp * cam.dist
    ];
    R.cam.target = [cam.focus[0], cam.focus[1] + 1.5, cam.focus[2]];
    /* FOV PUNCH. The camera widens a little with the shake, so an impact
       feels like the world breathes rather than like a frame slips. */
    R.cam.fov = 0.72 + (FX.impact.shake || 0) * 0.024;
    R.sun.extent = Math.max(40, cam.dist * 0.72);
    R.sun.dir = [0.34, 0.88, 0.42];
  }

/* Manual frame hook for the perf audit and verification: draws one complete
   frame synchronously and returns its wall time in ms. Used instead of rAF
   so a headless driver that never pumps animation frames can still measure
   the real cost of the render pipeline (shadow, bloom, ink included). */
  window.__RQX = function () {
    if (!G) return -1;
    var t0 = U.nowMs();
    updateCamera(1 / 60);
    updateHover();
    R.reset();
    drawBoard();
    drawTowers();
    drawDenizens();
    drawProjectiles();
    FX.submit();
    R.render(1 / 60);
    /* gl.finish forces the raster to complete, so the wall time is the whole
       frame cost and not just the command submission. */
    if (R._glFinish) R._glFinish();
    return U.nowMs() - t0;
  };

  return {
    init: init, start: start, stop: stop, resize: resize,
    keydown: keydown, toggleSpeed: toggleSpeed, togglePause: togglePause,
    get state() { return G; },
    get speed() { return speed; },
    set speed(v) { speed = v; },
    get paused() { return paused; },
    set paused(v) { paused = v; },
    cam: cam, input: input, stats: stats,
    errors: function () { return errors.slice(); }
  };
})();


/* ===== 14-ui.js ===== */
/* RELIQUARY :: 14-ui
   The DOM layer: start screen, HUD, inspector, banners, floating combat text.

   WHY DOM AND NOT CANVAS. Text rendered into the WebGL canvas would have to
   reimplement font shaping, wrapping, focus, tab order and screen-reader
   access, all of which the browser already does correctly. The canvas gets the
   world; the DOM gets everything the player reads.

   THE COST THAT MATTERS is layout thrash. Reading a computed style or an
   offset forces a synchronous layout, and doing that per element per frame is
   how a HUD ends up costing more than the renderer under it. So:
     - refresh() rebuilds structure only when structure CHANGES
     - tickOverlay() runs every frame but only ever WRITES transforms and
       opacity, never reads geometry back
     - floating text divs are POOLED, because a busy wave creates and destroys
       dozens a second and the churn is visible in the profiler */
'use strict';

var UI = (function () {

  var el = {};
  var floatPool = [];
  var floatUsed = [];
  var barPool = [];
  var lastDockSig = '';
  var lastInspectSig = '';
  var bannerTimer = 0;
  var toastTimer = 0;
  var lastGold = -1;
  var perfOn = false;

  var pending = {
    faction: 'human',
    enemyFaction: 'xeno',
    commander: 'vanta',
    board: 0,
    difficulty: 1
  };

  function $(id) { return document.getElementById(id); }
  function mk(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  function init() {
    el.hud = $('hud');
    el.topbar = $('topbar');
    el.wave = $('v-wave');
    el.gold = $('v-gold');
    el.lives = $('v-lives');
    el.wavefill = $('wavefill');
    el.dock = $('dock');
    el.inspector = $('inspector');
    el.abilities = $('abilities');
    el.banner = $('banner');
    el.floats = $('floats');
    el.toast = $('toast');
    el.perf = $('perf');
    el.startScreen = $('start-screen');
    el.endScreen = $('end-screen');
    el.pauseScreen = $('pause-screen');
    el.speedBtn = $('btn-speed');
    el.pauseBtn = $('btn-pause');
    el.nextBtn = $('btn-next');

    buildStartScreen();
    bindChrome();
    applyPalette(pending.faction);
    return true;
  }

  /* ---------- palette ----------
     One accent, driven from the chosen faction, so the whole interface is the
     same colour as the world it sits on top of (gate G3). */
  function applyPalette(factionId) {
    var pal = PAINT.FACTIONS[factionId] || PAINT.FACTIONS.human;
    var rgb = U.hex2rgb(pal.accent);
    var r = Math.round(rgb[0] * 255), g = Math.round(rgb[1] * 255), b = Math.round(rgb[2] * 255);
    var s = document.documentElement.style;
    s.setProperty('--accent', pal.accent);
    s.setProperty('--accent-2', pal.accent2);
    s.setProperty('--accent-dim', 'rgba(' + r + ',' + g + ',' + b + ',0.18)');
    s.setProperty('--accent-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.42)');
  }

  /* ---------- start screen ---------- */

  function buildStartScreen() {
    var sheet = $('start-sheet');
    if (!sheet) return;
    sheet.innerHTML = '';

    var head = mk('div');
    head.appendChild(mk('h1', 'title',
      'COSMIC CONQUEST<br><span class="thin">HIGHPOLY</span>'));
    head.appendChild(mk('p', 'tagline',
      'A high-fidelity 3D tower defence painted in the Neon Reliquary language. ' +
      'Hold the lane, build the lattice, and read the reactions before wave twenty arrives.'));
    sheet.appendChild(head);

    /* FACTION: sets the palette of the whole board and interface. */
    sheet.appendChild(mk('div', 'grouplabel', 'YOUR BANNER'));
    var fw = mk('div', 'opts');
    ['human', 'light', 'xeno', 'pirate', 'robotic'].forEach(function (fid) {
      var p = PAINT.FACTIONS[fid];
      var b = mk('button', 'opt' + (fid === pending.faction ? ' sel' : ''));
      b.type = 'button';
      b.innerHTML = '<div class="on"><span class="swatch" style="background:' + p.accent + '"></span>' +
        p.name + '</div><div class="od">' + p.motto + '</div>';
      b.onclick = function () {
        pending.faction = fid;
        applyPalette(fid);
        /* Fighting your own banner would break the style law that rival
           colours never share a frame, and is also nonsense. */
        if (pending.enemyFaction === fid) {
          pending.enemyFaction = fid === 'xeno' ? 'pirate' : 'xeno';
        }
        buildStartScreen();
        AUDIO.play('click');
      };
      fw.appendChild(b);
    });
    sheet.appendChild(fw);

    sheet.appendChild(mk('div', 'grouplabel', 'WHAT IS COMING'));
    var ew = mk('div', 'opts');
    ['xeno', 'pirate', 'robotic', 'human', 'light'].forEach(function (fid) {
      if (fid === pending.faction) return;
      var p = PAINT.FACTIONS[fid];
      var b = mk('button', 'opt' + (fid === pending.enemyFaction ? ' sel' : ''));
      b.type = 'button';
      var names = DATA.FACTION_NAMES[fid];
      b.innerHTML = '<div class="on"><span class="swatch" style="background:' + p.accent + '"></span>' +
        p.name + '</div><div class="od">Fields ' + names.chitling.toLowerCase() +
        ', ' + names.hivelord.toLowerCase() + ' and ' + names.harbinger.toLowerCase() + '.</div>';
      b.onclick = function () { pending.enemyFaction = fid; buildStartScreen(); AUDIO.play('click'); };
      ew.appendChild(b);
    });
    sheet.appendChild(ew);

    sheet.appendChild(mk('div', 'grouplabel', 'COMMANDER'));
    var cw = mk('div', 'opts');
    DATA.COMMANDER_ORDER.forEach(function (cid) {
      var c = DATA.COMMANDERS[cid];
      var p = PAINT.FACTIONS[c.faction];
      var b = mk('button', 'opt' + (cid === pending.commander ? ' sel' : ''));
      b.type = 'button';
      /* Mechanics first, flavour second (gate G12). */
      b.innerHTML = '<div class="on"><span class="swatch" style="background:' + p.accent + '"></span>' +
        c.name + '</div><div class="od"><strong>' + c.trait + '</strong>: ' + c.traitBlurb +
        '<br>Q ' + c.q.name + ' &middot; E ' + c.e.name + '</div>';
      b.onclick = function () { pending.commander = cid; buildStartScreen(); AUDIO.play('click'); };
      cw.appendChild(b);
    });
    sheet.appendChild(cw);

    sheet.appendChild(mk('div', 'grouplabel', 'BOARD'));
    var bw = mk('div', 'opts');
    DATA.BOARDS.forEach(function (bd, i) {
      var b = mk('button', 'opt' + (i === pending.board ? ' sel' : ''));
      b.type = 'button';
      b.innerHTML = '<div class="on">' + bd.name + '</div><div class="od">' + bd.blurb +
        '<br><span class="faint">' + bd.sub + '</span></div>';
      b.onclick = function () { pending.board = i; buildStartScreen(); AUDIO.play('click'); };
      bw.appendChild(b);
    });
    sheet.appendChild(bw);

    sheet.appendChild(mk('div', 'grouplabel', 'DIFFICULTY'));
    var dw = mk('div', 'opts');
    DATA.DIFFICULTIES.forEach(function (df, i) {
      var b = mk('button', 'opt' + (i === pending.difficulty ? ' sel' : ''));
      b.type = 'button';
      b.innerHTML = '<div class="on">' + df.name + '</div><div class="od">' +
        df.lives + ' lives, enemy health x' + df.hp.toFixed(2) +
        '<br><span class="faint">' + df.blurb + '</span></div>';
      b.onclick = function () { pending.difficulty = i; buildStartScreen(); AUDIO.play('click'); };
      dw.appendChild(b);
    });
    sheet.appendChild(dw);

    var row = mk('div', 'startrow');
    var go = mk('button', 'btn btn-primary', 'DEPLOY');
    go.type = 'button';
    go.onclick = function () { AUDIO.resume(); AUDIO.play('click'); beginRun(); };
    row.appendChild(go);
    var help = mk('button', 'btn', 'CODEX');
    help.type = 'button';
    help.onclick = function () { AUDIO.play('click'); showHelp(); };
    row.appendChild(help);
    row.appendChild(mk('div', 'spacer'));
    row.appendChild(mk('div', 'faint',
      'Drag to orbit, wheel to zoom. 1 to 9 picks a tower, U upgrades, S sells.'));
    sheet.appendChild(row);
  }

  function beginRun() {
    var opts = {
      faction: pending.faction,
      enemyFaction: pending.enemyFaction,
      commander: pending.commander,
      boardDef: DATA.BOARDS[pending.board],
      difficulty: DATA.DIFFICULTIES[pending.difficulty]
    };
    el.startScreen.classList.remove('show');
    el.endScreen.classList.remove('show');
    GAME.start(opts);
    lastDockSig = ''; lastInspectSig = '';
    buildAbilities();
    refresh();
    showBanner('WAVE 1', 'HOLD THE LANE', 2.2);
  }

  /* ---------- chrome ---------- */

  function bindChrome() {
    if (el.speedBtn) el.speedBtn.onclick = function () { AUDIO.play('click'); GAME.toggleSpeed(); };
    if (el.pauseBtn) el.pauseBtn.onclick = function () { AUDIO.play('click'); GAME.togglePause(); };
    if (el.nextBtn) el.nextBtn.onclick = function () {
      var G = GAME.state;
      if (G && !G.waveActive) { AUDIO.play('click'); SIM.startWave(); refresh(); }
      else AUDIO.play('denied');
    };
    var mute = $('btn-mute');
    if (mute) mute.onclick = function () {
      var on = mute.classList.toggle('on');
      AUDIO.setMuted(on);
      mute.textContent = on ? 'MUTED' : 'SOUND';
    };
    var perf = $('btn-perf');
    if (perf) perf.onclick = function () {
      perfOn = !perfOn;
      perf.classList.toggle('on', perfOn);
      el.perf.classList.toggle('hidden', !perfOn);
      AUDIO.play('click');
    };
    var resume = $('btn-resume');
    if (resume) resume.onclick = function () { AUDIO.play('click'); GAME.togglePause(); };
    var quit = $('btn-quit');
    if (quit) quit.onclick = function () {
      AUDIO.play('click');
      GAME.paused = false;
      el.pauseScreen.classList.remove('show');
      el.startScreen.classList.add('show');
      GAME.stop();
    };
    var again = $('btn-again');
    if (again) again.onclick = function () { AUDIO.play('click'); beginRun(); };
    var back = $('btn-back');
    if (back) back.onclick = function () {
      AUDIO.play('click');
      el.endScreen.classList.remove('show');
      el.startScreen.classList.add('show');
      buildStartScreen();
    };
    var closeHelp = $('btn-closehelp');
    if (closeHelp) closeHelp.onclick = function () {
      AUDIO.play('click');
      $('help-screen').classList.remove('show');
    };
    window.addEventListener('keydown', function (e) {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      GAME.keydown(e);
    });
  }

  /* ---------- abilities ---------- */

  function buildAbilities() {
    var G = GAME.state;
    if (!G || !el.abilities) return;
    el.abilities.innerHTML = '';
    ['q', 'e'].forEach(function (slot) {
      var a = slot === 'q' ? G.commander.q : G.commander.e;
      var n = mk('button', 'ability glass');
      n.type = 'button';
      n.id = 'ab-' + slot;
      n.title = a.name + ': ' + a.blurb;
      n.innerHTML = '<span class="sweep"></span>' +
        '<span class="key">' + slot.toUpperCase() + '</span>' +
        '<span><span class="nm">' + a.name + '</span><br><span class="cd">READY</span></span>';
      n.onclick = function () { SIM.useAbility(slot); refresh(); };
      el.abilities.appendChild(n);
    });
  }

  /* ---------- dock ---------- */

  function refresh() {
    var G = GAME.state;
    if (!G) return;
    /* Structure is rebuilt only when the SIGNATURE changes. Rebuilding the
       dock every frame would destroy and recreate fourteen buttons sixty times
       a second, which loses hover state and costs more than the renderer.

       THE SIGNATURE USES AFFORDABILITY, NOT RAW GOLD. Keying it on G.gold
       meant the dock rebuilt on every single coin earned, which during a wave
       is several times a second: the guard was present and doing nothing. What
       the dock actually renders from gold is one bit per card (can I afford
       this), so that is what the signature carries. */
    var afford = '';
    for (var ai = 0; ai < DATA.TOWER_ORDER.length; ai++) {
      afford += (G.gold >= DATA.TOWERS[DATA.TOWER_ORDER[ai]].cost) ? '1' : '0';
    }
    var sig = G.selected + '|' + afford + '|' + G.towers.length;
    if (sig !== lastDockSig) { buildDock(); lastDockSig = sig; }

    var isig = G.inspecting ? (G.inspecting.uid + ':' + G.inspecting.tier + ':' + G.gold) : 'none';
    if (isig !== lastInspectSig) { buildInspector(); lastInspectSig = isig; }

    if (el.wave) el.wave.textContent = Math.max(1, G.wave) + '/' + DATA.WAVES.length;
    if (el.gold) {
      el.gold.textContent = U.fmt(G.gold);
      if (lastGold >= 0 && G.gold !== lastGold) {
        el.gold.classList.remove('bump');
        /* Force a reflow so the animation restarts. This is the one place a
           forced layout is correct: it is once per gold change, not per
           frame. */
        void el.gold.offsetWidth;
        el.gold.classList.add('bump');
      }
      lastGold = G.gold;
    }
    if (el.lives) {
      el.lives.textContent = G.lives;
      el.lives.classList.toggle('low', G.lives <= Math.max(3, G.maxLives * 0.3));
    }
    if (el.speedBtn) el.speedBtn.textContent = GAME.speed + 'x';
    if (el.pauseBtn) el.pauseBtn.textContent = GAME.paused ? 'PLAY' : 'PAUSE';
    if (el.nextBtn) el.nextBtn.disabled = G.waveActive;
  }

  function buildDock() {
    var G = GAME.state;
    if (!el.dock || !G) return;
    el.dock.innerHTML = '';
    DATA.TOWER_ORDER.forEach(function (id, i) {
      var d = DATA.TOWERS[id];
      var poor = G.gold < d.cost;
      var b = mk('button', 'card' + (G.selected === id ? ' sel' : '') + (poor ? ' poor' : ''));
      b.type = 'button';
      b.title = d.name + ': ' + d.blurb;
      b.innerHTML =
        (i < 9 ? '<span class="hk">' + (i + 1) + '</span>' : '') +
        '<div class="el" style="background:' + DATA.ELEMENTS[d.element].color + '"></div>' +
        '<div class="nm">' + d.name + '</div>' +
        '<div class="rl">' + d.role + '</div>' +
        '<div class="cost mono">' + d.cost + '</div>';
      b.onmouseenter = function () { AUDIO.play('hover'); };
      b.onclick = function () {
        G.selected = (G.selected === id) ? null : id;
        G.inspecting = null;
        AUDIO.play('click');
        lastDockSig = '';
        refresh();
      };
      el.dock.appendChild(b);
    });
  }

  function buildInspector() {
    var G = GAME.state;
    if (!el.inspector || !G) return;
    var t = G.inspecting;
    if (!t) { el.inspector.classList.remove('show'); return; }

    var d = DATA.TOWERS[t.id];
    var s = SIM.stats(t);
    var next = t.tier < 2 ? d.upgrades[t.tier] : null;
    var upCost = SIM.upgradeCost(t);
    var canUp = next && G.gold >= upCost;

    var h = '';
    h += '<h3>' + d.name + '</h3>';
    h += '<div class="sub">' + DATA.ELEMENTS[d.element].name + ' &middot; TIER ' + (t.tier + 1) + '</div>';
    h += '<div class="tiers">';
    for (var i = 0; i < 3; i++) h += '<span class="tierpip' + (i <= t.tier ? ' on' : '') + '"></span>';
    h += '</div>';
    h += '<div class="rows">';
    if (d.kind !== 'support') {
      h += row('Damage', Math.round(s.dps) + '/s');
      h += row('Range', s.range.toFixed(1));
    }
    if (d.kind === 'support') h += row('Income', '+' + Math.round(s.income) + '/wave');
    if (s.splash > 0) h += row('Splash', s.splash.toFixed(1));
    if (s.chains > 0) h += row('Chains', String(s.chains));
    if (s.execute > 0) h += row('Execute', Math.round(s.execute * 100) + '%');
    if (!d.air) h += row('Targets', 'Ground only');
    if (d.airBonus > 1) h += row('Vs air', 'x' + d.airBonus.toFixed(1));
    h += row('Kills', String(t.kills));
    h += row('Damage done', U.fmt(t.damage));
    h += '</div>';
    h += '<div class="flavor">' + d.flavor + '</div>';
    if (next) {
      h += '<div class="rows" style="margin-top:12px"><div class="row"><span class="k">Next tier</span>' +
        '<span class="v up">' + upCost + 'g</span></div></div>';
      h += '<div class="faint" style="font-size:11.5px">' + next.note + '</div>';
    }
    h += '<div class="acts">';
    h += '<button type="button" class="btn' + (canUp ? ' btn-primary' : '') + '" id="ins-up"' +
      (canUp ? '' : ' disabled') + '>' + (next ? 'UPGRADE' : 'MAX') + '</button>';
    h += '<button type="button" class="btn" id="ins-sell">SELL ' + SIM.sellValue(t) + '</button>';
    h += '</div>';

    el.inspector.innerHTML = h;
    el.inspector.classList.add('show');

    var up = $('ins-up');
    if (up) up.onclick = function () {
      if (SIM.upgrade(t)) {
        AUDIO.play('upgrade', { pan: SIM.panOf(t.pos) });
        FX.burst([t.pos[0], t.pos[1] + 2, t.pos[2]], R.palette().rim,
          { count: 24, speed: 9, life: 0.7, size: 0.42 });
        FX.shockRing([t.pos[0], t.pos[1] + 0.3, t.pos[2]], R.palette().rim, 5, 0.4);
        FX.hit(0.3);
      } else AUDIO.play('denied');
      lastInspectSig = ''; lastDockSig = '';
      refresh();
    };
    var sell = $('ins-sell');
    if (sell) sell.onclick = function () {
      AUDIO.play('sell', { pan: SIM.panOf(t.pos) });
      FX.burst([t.pos[0], t.pos[1] + 1, t.pos[2]], [0.9, 0.75, 0.3],
        { count: 16, speed: 7, life: 0.6, size: 0.34 });
      SIM.sell(t);
      lastInspectSig = ''; lastDockSig = '';
      refresh();
    };
  }

  function row(k, v) {
    return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  /* ---------- banner and toast ---------- */

  function showBanner(big, small, seconds) {
    if (!el.banner) return;
    el.banner.innerHTML = '<div class="big">' + big + '</div>' +
      (small ? '<div class="small">' + small + '</div>' : '');
    el.banner.classList.add('show');
    bannerTimer = seconds || 2.0;
  }

  function toast(msg) {
    if (!el.toast) return;
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    toastTimer = 2.2;
  }

  /* ---------- per-frame overlay ----------
     WRITES ONLY. Nothing in this function reads layout back from the DOM,
     which is what keeps a HUD with fifty live elements off the critical path.
     Floating text divs come from a pool and are parked off-screen rather than
     removed, because removing and re-adding nodes is what makes the browser
     recalculate style for the whole container. */
