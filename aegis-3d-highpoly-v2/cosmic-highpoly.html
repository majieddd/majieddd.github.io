      var srad = Math.min(halfW, halfH) * (1.02 + dr() * 0.30);
      var sx = Math.cos(sa) * srad * (halfW / Math.min(halfW, halfH));
      var sz = Math.sin(sa) * srad * (halfH / Math.min(halfW, halfH));
      if (distToPath(path, sx, sz) < pathWidth * 2.0) continue;
      var sb = MESH.builder('spire' + sp + seed);
      sb.tooth(1.0).color(spireCols[sp % spireCols.length]);
      var hgt = 6 + dr() * 16;
      var rad0 = 0.9 + dr() * 1.5;
      sb.prism(rad0, rad0 * (0.15 + dr() * 0.3), hgt, 5 + (sp % 3), 0, dr() * 3);
      sb.color(spireCols[(sp + 1) % spireCols.length]);
      sb.prism(rad0 * 0.7, rad0 * 0.42, hgt * 0.34, 5, hgt * 0.55, dr() * 3);
      var sd = sb.build({ jitter: 0.10, warp: { freq: 0.22, amp: 0.42, phase: dr() * 6 } });
      /* Spires stand outside the grid, where heightAt() correctly reports the
         out-of-bounds sentinel rather than a surface. Reading that sentinel as
         a ground height would sink every spire to y = -6. They are anchored
         below the rim instead, so they rise out of the void the plate floats
         in, which is what the board wants at its edge anyway. */
      var baseY = -3.2 - dr() * 2.0;
      pieces.push(MESH.transform(sd, U.m4trs(sx, baseY, sz, 0, dr() * U.TAU, 0, 1, 1, 1)));
    }

    var decorData = pieces.length ? MESH.merge(pieces) : null;

    return {
      id: def.id,
      def: def,
      path: path,
      cell: CS, gw: GW, gh: GH, halfW: halfW, halfH: halfH,
      pathWidth: pathWidth,
      height: height, heightAt: heightAt,
      plots: plots,
      groundData: groundData,
      decorData: decorData,
      spawn: pathAt(path, 0).pos,
      goal: pathAt(path, path.length).pos,
      pathAt: function (d) { return pathAt(path, d); },
      distToPath: function (x, z) { return distToPath(path, x, z); }
    };
  }

  return {
    build: build,
    buildPath: buildPath,
    pathAt: pathAt,
    distToPath: distToPath,
    catmull: catmull
  };
})();


/* ===== 07-rig.js ===== */
/* RELIQUARY :: 07-rig
   Procedural skeletal animation.

   WHY NOT VERTEX SKINNING. Every model in this game is low-poly and built from
   separate rigid pieces, so a bone can simply own a whole mesh and be drawn
   with its own matrix. That removes the entire skinning pipeline (weights,
   bind poses, a skinning shader, a bone texture) and costs nothing visually
   at this facet density. It also keeps the hard facet edges intact, which
   smooth skinning would soften at exactly the joints where this art direction
   wants them sharpest.

   WHAT MAKES ANIMATION READ AS EXPENSIVE. Not bone count. Four things, all of
   which are here:

   1. FEET THAT PLANT. A walk cycle where the foot slides along the ground is
      the single loudest tell of cheap animation. Legs here are driven by
      two-bone IK to a foot TARGET that is stationary in world space during
      the stance phase, so the foot is genuinely planted and the body moves
      over it.

   2. WEIGHT. The body bobs twice per stride, dips on the loaded leg, and
      leans into turns and acceleration. A body that translates at constant
      height reads as a hovering prop.

   3. OVERLAP AND FOLLOW-THROUGH. Heads, tails and antennae lag the body by a
      few frames through a spring, so nothing starts and stops at once.

   4. ANTICIPATION. An attack winds back before it strikes. Without it a hit
      lands with no readable cause.

   All of it is procedural: there is not a single authored keyframe in this
   project, which is what keeps the whole game inside one HTML file. */
'use strict';

var RIG = (function () {

  var V = U.V;

  /* ---------- two-bone IK ----------
     Solves for the knee/elbow angle that puts the end effector at `target`,
     in the plane defined by the root, the target and a pole vector.

     The law of cosines gives the joint angles directly. The only subtlety is
     the clamp: when the target is further than the limb can reach, the naive
     acos returns NaN and the leg vanishes. Clamping the cosine keeps the limb
     straight and stretched toward the target, which is also what a real leg
     does at full extension. */
  function ik2(rootPos, target, len1, len2, poleDir) {
    var toTarget = V.sub(target, rootPos);
    var dist = V.len(toTarget);
    var maxReach = len1 + len2 - 1e-4;
    var minReach = Math.abs(len1 - len2) + 1e-4;
    if (dist > maxReach) { dist = maxReach; }
    if (dist < minReach) { dist = minReach; }
    var dir = V.len(toTarget) > 1e-6 ? V.scale(toTarget, 1 / V.len(toTarget)) : [0, -1, 0];
    var clampedTarget = V.add(rootPos, V.scale(dir, dist));

    /* Angle at the root between the limb's first bone and the root-to-target
       line. cos A = (len1^2 + dist^2 - len2^2) / (2 * len1 * dist) */
    var cosA = (len1 * len1 + dist * dist - len2 * len2) / (2 * len1 * dist);
    cosA = U.clamp(cosA, -1, 1);
    var a = Math.acos(cosA);

    /* Build an orthonormal basis: along the target, and a bend axis derived
       from the pole. The pole is what stops the knee choosing an arbitrary
       rotation about the target axis, which is the classic IK popping bug. */
    var pole = poleDir || [0, 0, 1];
    var side = V.cross(dir, pole);
    if (V.len2(side) < 1e-8) {
      side = V.cross(dir, [1, 0, 0]);
      if (V.len2(side) < 1e-8) side = V.cross(dir, [0, 0, 1]);
    }
    side = V.norm(side);
    var bendAxis = V.norm(V.cross(side, dir));

    var kneeDir = V.add(V.scale(dir, Math.cos(a)), V.scale(bendAxis, Math.sin(a)));
    var knee = V.add(rootPos, V.scale(kneeDir, len1));
    return { knee: knee, foot: clampedTarget, stretched: V.len(toTarget) > maxReach };
  }

  /* ---------- gait ----------
     A foot's position over one stride. `phase` is 0..1. The foot is in STANCE
     for `duty` of the cycle (planted, moving backward relative to the body at
     exactly body speed, so it does not slide) and in SWING for the rest,
     arcing forward and up.

     Returning the planted flag matters: the caller uses it to decide when to
     kick up dust and when to apply the body's weight dip. */
  function gait(phase, strideLen, liftHeight, duty) {
    duty = duty === undefined ? 0.62 : duty;
    phase = phase - Math.floor(phase);
    if (phase < duty) {
      /* STANCE. Travels from +half a stride to -half a stride, linearly, which
         is what keeps the foot stationary in world space while the body
         advances at constant speed. Any easing here reintroduces sliding. */
      var t = phase / duty;
      return {
        x: strideLen * (0.5 - t),
        y: 0,
        planted: true,
        t: t
      };
    }
    /* SWING. A raised cosine forward, and a sine arc upward with a slight
       forward bias so the foot reaches its peak before mid-swing, the way a
       real leg does. */
    var s = (phase - duty) / (1 - duty);
    var eased = s * s * (3 - 2 * s);
    return {
      x: strideLen * (-0.5 + eased),
      y: Math.sin(Math.pow(s, 0.85) * Math.PI) * liftHeight,
      planted: false,
      t: s
    };
  }

  /* ---------- spring ----------
     A critically damped spring, used for every piece of secondary motion.
     Returns the new [value, velocity]. Critically damped because overshoot on
     a head or a turret reads as wobble, not as weight. */
  function spring(cur, vel, target, stiffness, dt) {
    var damping = 2 * Math.sqrt(stiffness);
    var accel = (target - cur) * stiffness - vel * damping;
    vel += accel * dt;
    cur += vel * dt;
    return [cur, vel];
  }

  function spring3(cur, vel, target, stiffness, dt) {
    for (var i = 0; i < 3; i++) {
      var r = spring(cur[i], vel[i], target[i], stiffness, dt);
      cur[i] = r[0]; vel[i] = r[1];
    }
  }

  /* ---------- part tree ----------
     A model is a flat list of parts, each naming its parent. Parts must be
     declared after their parent so a single forward pass resolves every world
     matrix, which is enforced rather than assumed: an out-of-order parent
     would silently animate against the previous frame's matrix, a bug that
     looks like mysterious one-frame lag. */
  function build(spec) {
    var parts = [];
    var byName = Object.create(null);
    for (var i = 0; i < spec.length; i++) {
      var s = spec[i];
      var parentIdx = -1;
      if (s.parent) {
        if (!(s.parent in byName)) {
          throw new Error('RIG: part "' + s.name + '" names parent "' + s.parent +
            '" which is not declared before it');
        }
        parentIdx = byName[s.parent];
      }
      byName[s.name] = parts.length;
      parts.push({
        name: s.name,
        parent: parentIdx,
        mesh: s.mesh || null,
        /* bind: the rest offset of this part from its parent */
        bind: s.bind || [0, 0, 0],
        /* animated local transform, written by the pose function each frame */
        pos: [0, 0, 0],
        rot: [0, 0, 0],
        scl: [1, 1, 1],
        /* scratch */
        local: U.m4ident(),
        world: U.m4ident(),
        hidden: !!s.hidden,
        emissive: s.emissive || 0,
        /* free-form per-part state for springs */
        v: [0, 0, 0],
        s: [0, 0, 0]
      });
    }
    return {
      parts: parts,
      byName: byName,
      get: function (n) {
        var idx = byName[n];
        return idx === undefined ? null : parts[idx];
      }
    };
  }

  /* Reset every part to its bind pose. Called at the top of each pose
     function so a pose that forgets to write a joint gets the rest value
     rather than last frame's, which is how animation state leaks between
     two different actions and produces drift over minutes of play. */
  function rest(rig) {
    for (var i = 0; i < rig.parts.length; i++) {
      var p = rig.parts[i];
      p.pos[0] = 0; p.pos[1] = 0; p.pos[2] = 0;
      p.rot[0] = 0; p.rot[1] = 0; p.rot[2] = 0;
      p.scl[0] = 1; p.scl[1] = 1; p.scl[2] = 1;
      p.hidden = false;
    }
  }

  /* Resolve world matrices for the whole tree given a root transform. */
  function resolve(rig, rootMatrix) {
    for (var i = 0; i < rig.parts.length; i++) {
      var p = rig.parts[i];
      U.m4trs(
        p.bind[0] + p.pos[0], p.bind[1] + p.pos[1], p.bind[2] + p.pos[2],
        p.rot[0], p.rot[1], p.rot[2],
        p.scl[0], p.scl[1], p.scl[2],
        p.local
      );
      if (p.parent < 0) U.m4mul(rootMatrix, p.local, p.world);
      else U.m4mul(rig.parts[p.parent].world, p.local, p.world);
    }
  }

  /* Submit every visible part. `opts` is passed through to R.push so a whole
     creature can flash or dissolve as one. */
  function draw(rig, opts) {
    for (var i = 0; i < rig.parts.length; i++) {
      var p = rig.parts[i];
      if (p.hidden || !p.mesh) continue;
      R.push(p.mesh, p.world, opts);
    }
  }

  /* ---------- leg driver ----------
     Wraps gait + ik2 for a limb whose root is a part in the tree. Writes the
     upper and lower bone rotations so they point along the solved segments.

     Bones are modelled as pointing down -Y in their bind pose, which matches
     how the limb primitive is authored in the model files. */
  function driveLeg(rig, upperName, lowerName, hipLocal, footTarget, len1, len2, poleDir) {
    var upper = rig.get(upperName), lower = rig.get(lowerName);
    if (!upper || !lower) return null;
    var sol = ik2(hipLocal, footTarget, len1, len2, poleDir || [0, 0, 1]);

    /* Convert the solved segment directions into the YXZ euler the transform
       builder wants. A bone pointing along `d` from its root has
         yaw   = atan2(d.x, d.z)
         pitch = asin(-d.y) offset by 90 degrees because rest points down
    */
    function aim(from, to, part) {
      var d = V.norm(V.sub(to, from));
      var yaw = Math.atan2(d[0], d[2]);
      var pitch = Math.acos(U.clamp(-d[1], -1, 1));
      part.rot[1] = yaw;
      part.rot[0] = pitch - Math.PI;
      return { yaw: yaw, pitch: pitch };
    }
    aim(hipLocal, sol.knee, upper);
    /* The lower bone is a child of the upper, so its rotation must be
       expressed relative to the parent. Rather than compose inverses, the
       lower bone is authored as a SIBLING in every model that uses this,
       positioned at the knee. That keeps the maths readable and costs one
       extra part per limb. */
    lower.pos[0] = sol.knee[0] - lower.bind[0];
    lower.pos[1] = sol.knee[1] - lower.bind[1];
    lower.pos[2] = sol.knee[2] - lower.bind[2];
    aim(sol.knee, sol.foot, lower);
    return sol;
  }

  return {
    build: build,
    rest: rest,
    resolve: resolve,
    draw: draw,
    ik2: ik2,
    gait: gait,
    spring: spring,
    spring3: spring3,
    driveLeg: driveLeg
  };
})();

/* ===== 09-models.js ===== */
/* RELIQUARY :: 09-models
   Every mesh in the game, built procedurally.

   COLOUR POLICY, and why it is not the obvious one. The style law says faction
   colour dominates a frame to the point of monochrome. A tower defence puts
   fourteen tower types on one board, so colouring each by its ORIGIN would put
   five rival palettes in one frame, which the law forbids outright.

   The resolution: the BOARD owns the frame. Towers are built from a shared
   dark hull material in every faction's game, and carry a small bright accent
   in their ELEMENT colour. The accent is a few percent of the silhouette, so
   it never competes with the board for dominance, and it encodes the one thing
   a player must read at a glance to plan reactions. Identity by silhouette,
   information by accent, mood by the board.

   TIERS CHANGE THE MODEL. Every upgrade adds or replaces geometry rather than
   only scaling numbers. An upgrade the player cannot see is an upgrade the
   player does not feel, and this is the cheapest place in the whole project to
   buy that feeling.

   All builders are memoised: a board has up to forty towers and a wave up to
   sixty denizens, and rebuilding a mesh per instance would allocate megabytes
   a second. */
'use strict';

var MODELS = (function () {

  var cache = Object.create(null);
  function memo(key, fn) {
    var v = cache[key];
    if (v === undefined) { v = fn(); cache[key] = v; }
    return v;
  }

  /* Shared hull palette. Deliberately narrow: three values of the same cold
     graphite, so every tower reads as built by the same hands and the accent
     is the only thing that varies. */
  /* THE HULL MUST OUT-VALUE THE BOARD. These were roughly half this bright to
     begin with, which put every tower BELOW the ground it stood on in
     luminance: the towers read as holes in the board rather than as objects
     on it, and the whole set flattened into silhouette at any distance.
     A defended position should have the player's own assets as the brightest
     solid things on the field, with the denizens as the dark shapes moving
     through it. That ordering is what makes a glance tell you who is winning. */
  var HULL = {
    dark: '#1c2436',
    mid: '#2b3750',
    light: '#415373',
    trim: '#5a6d92'
  };

  function elementColor(el) {
    var e = DATA.ELEMENTS[el];
    return e ? e.color : '#ffffff';
  }

  /* A plinth every tower stands on, so the whole set shares a footprint and
     reads as one army. Tier adds rings to it, which is a cheap, legible
     "this one has been upgraded" signal visible even at full zoom out. */
  function plinth(b, tier, r) {
    r = r || 2.15;
    b.color(HULL.dark).tooth(1.0);
    b.prism(r, r * 0.92, 0.85, 6, 0);
    b.color(HULL.mid);
    b.prism(r * 0.86, r * 0.74, 0.42, 6, 0.85);
    if (tier >= 1) {
      b.color(HULL.trim).tooth(0.6);
      b.ring(r * 0.95, r * 1.12, 6, 0.9);
    }
    if (tier >= 2) {
      b.color(HULL.trim);
      for (var i = 0; i < 6; i++) {
        var a = (i / 6) * U.TAU + 0.3;
        b.push();
        b.translate(Math.cos(a) * r * 1.02, 0.42, Math.sin(a) * r * 1.02);
        b.box(0.26, 0.85, 0.26);
        b.pop();
      }
    }
  }

  /* ---------- tower builders ----------
     Each returns { base, turret, barrel, muzzle, turretY, spin } where the
     three meshes are the parts of the rig and `muzzle` is where projectiles
     and muzzle flash originate, in TURRET-local space. */

  var TOWER_BUILD = {

    bolt: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(0.95);
      b.frustum(2.05, 2.05, 1.55, 1.55, 1.25, 1.25);
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.85);
          tb.prism(1.05, 0.88, 0.72, 7, 0);
          tb.color(HULL.mid);
          tb.box(1.5, 0.62, 1.15);
          tb.color(acc).tooth(0.2).emissive(0.85);
          tb.push(); tb.translate(0, 0.42, -0.42); tb.box(0.5, 0.16, 0.2); tb.pop();
          tb.emissive(0);
        },
        barrel: function (bb) {
          bb.color(HULL.dark).tooth(0.55);
          bb.limb([0, 0, 0.2], [0, 0, 2.0 + t * 0.42], 0.20, 0.155, 6);
          if (t >= 1) bb.limb([0.30, 0, 0.2], [0.30, 0, 1.85 + t * 0.35], 0.15, 0.12, 5);
          if (t >= 2) bb.limb([-0.30, 0, 0.2], [-0.30, 0, 1.85 + t * 0.35], 0.15, 0.12, 5);
          bb.color(HULL.trim);
          bb.push(); bb.translate(0, 0, 0.55); bb.prism(0.30, 0.30, 0.26, 6, 0); bb.pop();
        },
        turretY: 2.5, muzzle: [0, 0, 2.3 + t * 0.42]
      };
    },

    cryo: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(0.95);
      b.frustum(2.2, 2.2, 1.9, 1.9, 0.95, 1.25);
      /* Coolant flasks: the read-at-a-glance identity for this tower. */
      b.color(acc).tooth(0.25).emissive(0.55);
      for (var i = 0; i < 3 + t; i++) {
        var a = (i / (3 + t)) * U.TAU + 0.4;
        b.push();
        b.translate(Math.cos(a) * 1.5, 1.5, Math.sin(a) * 1.5);
        b.lathe([[0, 0], [0.26, 0.12], [0.3, 0.7], [0.16, 0.95], [0, 1.0]], 6);
        b.pop();
      }
      b.emissive(0);
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.8);
          tb.lathe([[0.95, 0], [1.05, 0.35], [0.72, 0.78], [0.5, 0.9]], 7);
          tb.color(acc).tooth(0.15).emissive(0.9);
          tb.push(); tb.translate(0, 0.72, 0); tb.shard(0.34, 0.85 + t * 0.2, 0.2, 5, 0); tb.pop();
          tb.emissive(0);
        },
        barrel: function (bb) {
          bb.color(HULL.dark).tooth(0.5);
          bb.limb([0, 0.1, 0.3], [0, 0.42, 1.5], 0.28, 0.36, 6);
          bb.color(acc).tooth(0.1).emissive(0.7);
          bb.push(); bb.translate(0, 0.44, 1.55); bb.prism(0.38, 0.30, 0.2, 6, 0); bb.pop();
        },
        turretY: 2.2, muzzle: [0, 0.5, 1.8]
      };
    },

    mortar: function (b, t, acc) {
      plinth(b, t, 2.3);
      b.color(HULL.mid).tooth(1.0);
      b.frustum(2.4, 2.4, 2.0, 2.0, 0.8, 1.25);
      b.color(HULL.trim).tooth(0.9);
      b.push(); b.translate(0, 1.4, -1.1); b.box(1.9, 0.5, 0.5); b.pop();
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.85);
          tb.box(1.7, 0.75, 1.9);
          tb.color(HULL.mid);
          tb.push(); tb.translate(0, 0.4, -0.8); tb.box(1.2, 0.85, 0.6); tb.pop();
          tb.color(acc).tooth(0.2).emissive(0.75);
          tb.push(); tb.translate(0, 0.55, -0.85); tb.box(0.55, 0.22, 0.16); tb.pop();
          tb.emissive(0);
        },
        barrel: function (bb) {
          /* Pitched steeply upward: the silhouette that says artillery from
             across the board, and the reason it cannot hit anything close. */
          bb.color(HULL.dark).tooth(0.6);
          var n = t >= 2 ? 3 : 1;
          for (var i = 0; i < n; i++) {
            var off = (i - (n - 1) / 2) * 0.55;
            bb.limb([off, 0, 0], [off, 2.1 + t * 0.3, 1.0 + t * 0.12], 0.32, 0.28, 6);
          }
          bb.color(HULL.trim);
          bb.push(); bb.translate(0, 0.25, 0.1); bb.prism(0.5, 0.46, 0.35, 6, 0); bb.pop();
        },
        turretY: 2.1, muzzle: [0, 2.3 + t * 0.3, 1.1]
      };
    },

    flak: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(0.95);
      b.prism(1.8, 1.6, 1.1, 8, 1.25);
      b.color(HULL.trim).tooth(0.7);
      b.ring(1.65, 1.95, 8, 2.32);
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.8);
          tb.prism(1.15, 1.0, 0.6, 8, 0);
          tb.color(HULL.mid);
          tb.push(); tb.translate(0, 0.35, -0.5); tb.box(1.5, 0.7, 0.9); tb.pop();
          /* Ammunition drums, one per tier, so the count is the upgrade. */
          tb.color(acc).tooth(0.3).emissive(0.6);
          for (var i = 0; i <= t; i++) {
            tb.push();
            tb.translate(-0.7 + i * 0.7, 0.55, -0.75);
            tb.prism(0.3, 0.3, 0.42, 6, 0);
            tb.pop();
          }
          tb.emissive(0);
        },
        barrel: function (bb) {
          bb.color(HULL.dark).tooth(0.5);
          var n = 2 + t;
          for (var i = 0; i < n; i++) {
            var a = (i / n) * U.TAU;
            var ox = Math.cos(a) * 0.26, oy = Math.sin(a) * 0.26;
            bb.limb([ox, oy + 0.35, 0.2], [ox, oy + 0.35, 1.85], 0.115, 0.09, 5);
          }
          bb.color(HULL.trim);
          bb.push(); bb.translate(0, 0.35, 0.35); bb.prism(0.42, 0.38, 0.3, 7, 0); bb.pop();
        },
        turretY: 2.9, muzzle: [0, 0.35, 2.0]
      };
    },

    arc: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(0.95);
      b.frustum(1.9, 1.9, 1.2, 1.2, 1.9, 1.25);
      /* Insulator stack: the tesla silhouette. */
      b.color(HULL.trim).tooth(0.55);
      for (var i = 0; i < 3; i++) {
        b.push(); b.translate(0, 3.15 + i * 0.34, 0);
        b.lathe([[0.62, 0], [0.72, 0.09], [0.5, 0.18], [0.5, 0.26]], 8);
        b.pop();
      }
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.6);
          tb.prism(0.7, 0.55, 0.5, 7, 0);
          tb.color(acc).tooth(0.1).emissive(1.0);
          tb.push(); tb.translate(0, 0.95, 0); tb.ico(0.62 + t * 0.09, 0); tb.pop();
          if (t >= 1) { tb.push(); tb.translate(0, 0.95, 0); tb.ring(0.95, 1.12, 10, 0); tb.pop(); }
          if (t >= 2) {
            tb.push(); tb.translate(0, 0.95, 0); tb.rotateX(1.05); tb.ring(1.05, 1.2, 10, 0); tb.pop();
          }
          tb.emissive(0);
        },
        barrel: null,
        turretY: 4.2, muzzle: [0, 0.95, 0]
      };
    },

    prism: function (b, t, acc) {
      plinth(b, t);
      /* The Federation is a cathedral culture: this is the one tower allowed
         ceremonial geometry rather than plate and weld. */
      b.color(HULL.mid).tooth(0.9);
      b.lathe([[1.7, 0], [1.5, 0.5], [1.55, 0.75], [1.1, 1.3], [0.95, 1.9]], 8, 0.2);
      b.color(HULL.trim).tooth(0.6);
      b.ring(1.5, 1.85, 8, 1.28);
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.55);
          tb.lathe([[0.85, 0], [0.95, 0.28], [0.6, 0.6]], 8);
          tb.color(acc).tooth(0.08).emissive(1.0);
          tb.push(); tb.translate(0, 1.1, 0);
          tb.shard(0.45 + t * 0.08, 1.05 + t * 0.18, 0.55, 6, 0);
          tb.pop();
          if (t >= 1) {
            for (var i = 0; i < 3; i++) {
              var a = (i / 3) * U.TAU;
              tb.push();
              tb.translate(Math.cos(a) * 0.85, 0.85, Math.sin(a) * 0.85);
              tb.shard(0.16, 0.42, 0.2, 4, 0);
              tb.pop();
            }
          }
          if (t >= 2) { tb.push(); tb.translate(0, 1.1, 0); tb.ring(1.25, 1.42, 14, 0); tb.pop(); }
          tb.emissive(0);
        },
        barrel: null,
        turretY: 2.5, muzzle: [0, 1.1, 0.4]
      };
    },

    pharos: function (b, t, acc) {
      plinth(b, t, 2.3);
      /* A lighthouse. Tallest silhouette in the set, which is most of why it
         costs what it costs. */
      b.color(HULL.mid).tooth(1.0);
      b.prism(1.85, 1.15, 5.2, 7, 1.25, 0.2);
      b.color(HULL.trim).tooth(0.7);
      b.ring(1.15, 1.5, 7, 6.4);
      b.color(HULL.light).tooth(0.8);
      b.prism(1.05, 1.0, 0.7, 7, 6.45, 0.2);
      return {
        turret: function (tb) {
          tb.color(acc).tooth(0.06).emissive(1.0);
          tb.prism(0.7, 0.62, 1.0, 6, 0);
          tb.emissive(0);
          tb.color(HULL.dark).tooth(0.5);
          tb.lathe([[0.85, 1.0], [0.9, 1.15], [0.35, 1.5], [0, 1.62]], 7);
          /* The reflector: a solid wedge that occludes the lamp, so the beam
             direction is legible from the model alone. */
          tb.color(HULL.trim).tooth(0.4);
          tb.push(); tb.translate(0, 0.5, -0.55); tb.box(1.35, 1.0, 0.28); tb.pop();
          if (t >= 2) {
            tb.color(acc).tooth(0.06).emissive(1.0);
            tb.push(); tb.translate(0, 1.85, 0); tb.prism(0.42, 0.36, 0.6, 6, 0); tb.pop();
            tb.emissive(0);
          }
        },
        barrel: null,
        turretY: 7.15, muzzle: [0, 0.5, 0.8]
      };
    },

    toxin: function (b, t, acc) {
      /* Xeno hardware is accumulated, never designed. No plinth ring: a
         swollen sac that grew where it landed. */
      b.color(HULL.dark).tooth(1.0);
      b.prism(2.1, 1.95, 0.6, 7, 0);
      b.color('#1b1526').tooth(1.0);
      b.push(); b.translate(0, 1.35, 0); b.scale(1.15, 0.95, 1.15); b.ico(1.35, 0); b.pop();
      b.color(acc).tooth(0.35).emissive(0.5);
      for (var i = 0; i < 4 + t * 2; i++) {
        var a = (i / (4 + t * 2)) * U.TAU + 0.7;
        b.push();
        b.translate(Math.cos(a) * 1.15, 1.6 + Math.sin(i * 2.1) * 0.3, Math.sin(a) * 1.15);
        b.rotateZ(Math.cos(a) * 0.5); b.rotateX(Math.sin(a) * 0.5);
        b.shard(0.14, 0.7, 0.15, 4, 0);
        b.pop();
      }
      b.emissive(0);
      return {
        turret: function (tb) {
          tb.color('#241a33').tooth(0.95);
          tb.push(); tb.scale(1, 0.8, 1.2); tb.ico(0.85, 0); tb.pop();
          tb.color(acc).tooth(0.15).emissive(0.95);
          tb.push(); tb.translate(0, 0.15, 0.62); tb.shard(0.28, 0.34, 0.3, 5, 0); tb.pop();
          tb.emissive(0);
        },
        barrel: function (bb) {
          bb.color('#1b1526').tooth(0.8);
          bb.limb([0, 0, 0.3], [0, 0.12, 1.5 + t * 0.2], 0.24, 0.14, 5);
        },
        turretY: 2.55, muzzle: [0, 0.12, 1.7]
      };
    },

    maw: function (b, t, acc) {
      b.color(HULL.dark).tooth(1.0);
      b.prism(2.2, 2.05, 0.7, 6, 0);
      b.color('#170f22').tooth(1.0);
      b.push(); b.translate(0, 1.3, 0); b.scale(1.25, 1.0, 1.25); b.ico(1.45, 0); b.pop();
      return {
        turret: function (tb) {
          /* Two jaw halves that open on the wind-up. Modelled as one part
             each so the animation can hinge them. */
          tb.color('#241428').tooth(0.95);
          tb.push(); tb.scale(1.1, 0.75, 1.0); tb.ico(0.95, 0); tb.pop();
          tb.color(acc).tooth(0.1).emissive(1.0);
          tb.push(); tb.translate(0, 0, 0.5); tb.scale(0.8, 0.55, 0.5); tb.ico(0.6, 0); tb.pop();
          tb.emissive(0);
          /* Teeth. Count is the tier. */
          tb.color('#c9c2d8').tooth(0.3);
          var n = 5 + t * 2;
          for (var i = 0; i < n; i++) {
            var a = -0.9 + (i / (n - 1)) * 1.8;
            tb.push();
            tb.translate(Math.sin(a) * 0.9, 0.35, Math.cos(a) * 0.9);
            tb.rotateX(0.5); tb.rotateY(a);
            tb.cone(0.11, 0.5, 4, 0);
            tb.pop();
            tb.push();
            tb.translate(Math.sin(a) * 0.9, -0.35, Math.cos(a) * 0.9);
            tb.rotateX(Math.PI - 0.5); tb.rotateY(a);
            tb.cone(0.11, 0.5, 4, 0);
            tb.pop();
          }
        },
        barrel: null,
        turretY: 2.45, muzzle: [0, 0, 1.2]
      };
    },

    pyre: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(1.0);
      b.frustum(2.0, 2.0, 1.7, 1.7, 1.0, 1.25);
      /* Fuel tanks, welded on at angles. The Pirates build like this. */
      b.color('#3a2318').tooth(0.9);
      for (var i = 0; i < 2 + t; i++) {
        var a = 2.3 + i * 0.9;
        b.push();
        b.translate(Math.cos(a) * 1.25, 1.85, Math.sin(a) * 1.25);
        b.rotateZ(0.14 * (i % 2 ? 1 : -1));
        b.prism(0.42, 0.4, 1.5, 6, -0.75);
        b.pop();
      }
      b.color(HULL.trim).tooth(0.7);
      b.push(); b.translate(0, 2.3, 0); b.box(1.5, 0.22, 1.5); b.pop();
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.85);
          tb.box(1.25, 0.75, 1.35);
          tb.color('#4a2a1a').tooth(0.8);
          tb.push(); tb.translate(0, 0.5, -0.35); tb.prism(0.45, 0.42, 0.7, 6, 0); tb.pop();
        },
        barrel: function (bb) {
          bb.color(HULL.dark).tooth(0.6);
          bb.limb([0, 0, 0.2], [0, 0, 1.5], 0.22, 0.34, 6);
          bb.color(acc).tooth(0.1).emissive(0.9);
          bb.push(); bb.translate(0, 0, 1.6); bb.prism(0.36, 0.44, 0.22, 6, 0); bb.pop();
          bb.emissive(0);
          /* Pilot light: always lit, so the tower reads as armed at rest. */
          bb.color(acc).tooth(0).emissive(1.0);
          bb.push(); bb.translate(0.3, 0.22, 1.35); bb.shard(0.07, 0.2, 0.06, 4, 0); bb.pop();
          bb.emissive(0);
        },
        turretY: 2.6, muzzle: [0, 0, 1.85]
      };
    },

    cyclone: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(0.95);
      b.prism(1.7, 1.5, 1.5, 6, 1.25);
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.8);
          tb.prism(1.2, 1.15, 0.55, 8, 0);
          tb.color(HULL.trim).tooth(0.6);
          tb.ring(1.2, 1.5, 8, 0.3);
          tb.color(acc).tooth(0.15).emissive(0.7);
          tb.push(); tb.translate(0, 0.35, 0); tb.prism(0.35, 0.3, 0.3, 6, 0); tb.pop();
          tb.emissive(0);
        },
        /* The fan is the "barrel": it spins continuously, which is this
           tower's whole read at a distance. */
        barrel: function (bb) {
          bb.color(HULL.dark).tooth(0.45);
          var n = 3 + t;
          for (var i = 0; i < n; i++) {
            var a = (i / n) * U.TAU;
            bb.push();
            bb.rotateY(a);
            bb.translate(0, 0, 0.75);
            bb.rotateX(0.62);
            bb.box(0.55, 0.09, 1.35);
            bb.pop();
          }
          bb.color(HULL.trim);
          bb.prism(0.3, 0.26, 0.28, 6, -0.14);
        },
        turretY: 2.75, muzzle: [0, 0.4, 0]
      };
    },

    railgun: function (b, t, acc) {
      plinth(b, t, 2.35);
      b.color(HULL.mid).tooth(0.95);
      b.frustum(2.5, 1.9, 2.1, 1.5, 0.75, 1.25);
      /* Capacitor bank down one flank: cold, industrial, Vigil. */
      b.color(HULL.trim).tooth(0.75);
      for (var i = 0; i < 4; i++) {
        b.push(); b.translate(-1.5 + i * 1.0, 1.45, -1.15); b.prism(0.3, 0.28, 0.85, 6, 0); b.pop();
      }
      return {
        turret: function (tb) {
          tb.color(HULL.light).tooth(0.8);
          tb.box(1.35, 0.6, 2.1);
          tb.color(HULL.mid);
          tb.push(); tb.translate(0, 0.42, -0.75); tb.box(1.0, 0.55, 0.9); tb.pop();
          tb.color(acc).tooth(0.15).emissive(0.85);
          tb.push(); tb.translate(0, 0.5, -0.72); tb.box(0.45, 0.2, 0.14); tb.pop();
          tb.emissive(0);
        },
        barrel: function (bb) {
          /* Two parallel rails with a charged gap between them, which is the
             whole silhouette and the reason the name is legible. */
          bb.color(HULL.dark).tooth(0.5);
          var sep = 0.30, len = 3.4 + t * 0.5;
          bb.limb([sep, 0, 0], [sep, 0, len], 0.14, 0.11, 5);
          bb.limb([-sep, 0, 0], [-sep, 0, len], 0.14, 0.11, 5);
          if (t >= 2) {
            bb.limb([0, sep, 0], [0, sep, len], 0.12, 0.10, 5);
            bb.limb([0, -sep, 0], [0, -sep, len], 0.12, 0.10, 5);
          }
          bb.color(acc).tooth(0.05).emissive(1.0);
          for (var i = 1; i <= 3 + t; i++) {
            bb.push(); bb.translate(0, 0, (len / (4 + t)) * i); bb.box(0.5, 0.06, 0.09); bb.pop();
          }
          bb.emissive(0);
          bb.color(HULL.trim);
          bb.push(); bb.translate(0, 0, 0.2); bb.box(0.95, 0.55, 0.35); bb.pop();
        },
        turretY: 2.2, muzzle: [0, 0, 3.6 + t * 0.5]
      };
    },

    singularity: function (b, t, acc) {
      plinth(b, t);
      b.color(HULL.mid).tooth(0.9);
      /* A containment cage. The tower is the thing inside it. */
      for (var i = 0; i < 4 + t; i++) {
        var a = (i / (4 + t)) * U.TAU;
        b.push();
        b.translate(Math.cos(a) * 1.35, 1.25, Math.sin(a) * 1.35);
        b.rotateY(-a);
        b.rotateX(-0.3);
        b.box(0.22, 3.1, 0.3);
        b.pop();
      }
      b.color(HULL.trim).tooth(0.6);
      b.ring(1.05, 1.45, 9, 2.85);
      return {
        turret: function (tb) {
          /* Emissive is deliberately ZERO here and the colour is nearly black:
             a singularity that glows is a lamp. The read comes from the ring
             around it and from what it does to everything nearby. */
          tb.color('#05030a').tooth(0.0);
          tb.ico(0.62 + t * 0.08, 1);
          tb.color(acc).tooth(0.05).emissive(1.0);
          tb.ring(0.85 + t * 0.08, 1.0 + t * 0.08, 16, 0);
          tb.emissive(0);
        },
        barrel: null,
        turretY: 2.85, muzzle: [0, 0, 0]
      };
    },

    vault: function (b, t, acc) {
      plinth(b, t, 2.25);
      b.color(HULL.mid).tooth(1.0);
      b.box(3.0, 2.1, 2.4);
      b.push(); b.translate(0, 1.05, 0); b.pop();
      b.color(HULL.trim).tooth(0.8);
      b.push(); b.translate(0, 2.2, 0); b.box(3.15, 0.28, 2.55); b.pop();
      /* Ledger spools: one per tier, the visible income upgrade. */
      b.color(acc).tooth(0.2).emissive(0.7);
      for (var i = 0; i <= t; i++) {
        b.push();
        b.translate(-0.85 + i * 0.85, 2.62, 0);
        b.rotateX(Math.PI / 2);
        b.prism(0.3, 0.3, 0.34, 8, -0.17);
        b.pop();
      }
      b.emissive(0);
      return {
        turret: function (tb) {
          /* The door. Rotates slowly and opens on payout. */
          tb.color(HULL.light).tooth(0.85);
          tb.push(); tb.rotateX(Math.PI / 2); tb.prism(1.0, 0.95, 0.28, 8, -0.14); tb.pop();
          tb.color(acc).tooth(0.1).emissive(0.9);
          tb.push(); tb.rotateX(Math.PI / 2); tb.prism(0.34, 0.3, 0.34, 6, -0.17); tb.pop();
          tb.emissive(0);
          tb.color(HULL.trim);
          for (var i = 0; i < 4; i++) {
            var a = (i / 4) * U.TAU + 0.4;
            tb.push();
            tb.translate(Math.cos(a) * 0.62, 0, Math.sin(a) * 0.62);
            tb.box(0.16, 0.16, 0.5);
            tb.pop();
          }
        },
        barrel: null,
        turretY: 1.1, muzzle: [0, 0, 1.4]
      };
    }
  };

  /* Public tower accessor. Returns cached meshes plus the metadata the rig
     and the sim need. */
  function tower(id, tier) {
    var key = 'tower:' + id + ':' + tier;
    return memo(key, function () {
      var def = DATA.TOWERS[id];
      if (!def) throw new Error('MODELS.tower: unknown tower "' + id + '"');
      var builder = TOWER_BUILD[id];
      if (!builder) throw new Error('MODELS.tower: no builder for "' + id + '"');
      var acc = elementColor(def.element);

      var baseB = MESH.builder('tw:' + id + ':' + tier);
      var meta = builder(baseB, tier, acc);

      /* THE ELEMENT COLLAR. Added here rather than in each builder so it is
         identical on all fourteen towers: same height, same size, same shape.
         Reactions are the deepest system in the game and they are unplayable
         if the player cannot tell a frost tower from a storm tower at a
         glance, and the per-tower accents alone could not carry that: on a
         blue-grey hull the frost and kinetic accents disappeared entirely
         while radiant and void popped, so the readability of a tower depended
         on which element it happened to be.
         A collar is emissive, so it bypasses the lighting ramp and reads at
         any distance, in any faction palette, in shadow or out of it. */
      baseB.color(acc).tooth(0.05).emissive(1.0);
      baseB.ring(2.00, 2.34, 6, 0.60);
      baseB.emissive(0);

      var baseMesh = GL.mesh(baseB.build({ jitter: 0.028 }));

      var turretMesh = null, barrelMesh = null;
      if (meta.turret) {
        var tb = MESH.builder('tw:' + id + ':t:' + tier);
        meta.turret(tb);
        turretMesh = GL.mesh(tb.build({ jitter: 0.024 }));
      }
      if (meta.barrel) {
        var bb = MESH.builder('tw:' + id + ':b:' + tier);
        meta.barrel(bb);
        barrelMesh = GL.mesh(bb.build({ jitter: 0.02 }));
      }
      return {
        base: baseMesh, turret: turretMesh, barrel: barrelMesh,
        turretY: meta.turretY, muzzle: meta.muzzle,
        accent: U.hex2rgb(acc)
      };
    });
  }

  /* ---------- denizens ----------
     Four rig archetypes cover every enemy. Each is built once per (rig, scale
     bucket) and shared, with the faction only changing the emissive core
     colour, which is a uniform rather than geometry. */

  var DENIZEN_BUILD = {
    /* CRAWLER: low, four legs, fast. The chaff. */
    crawler: function (core) {
      return [
        { name: 'body', bind: [0, 1.12, 0], build: function (b) {
            b.color('#100c1c').tooth(0.95);
            b.push(); b.scale(1.0, 0.72, 1.35); b.ico(0.92, 0); b.pop();
            b.color('#1a1330');
            b.push(); b.translate(0, 0.26, -0.5); b.scale(0.8, 0.6, 0.7); b.ico(0.66, 0); b.pop();
          } },
        { name: 'core', parent: 'body', bind: [0, 0.08, 0.74], build: function (b) {
            b.color(core).tooth(0.05).emissive(1.0);
            b.shard(0.26, 0.36, 0.3, 5, 0);
          } },
        legs(4, 0.60, 0.44, 0.50, '#171126')
      ].flat();
    },
    /* WALKER: bipedal-ish, mid weight, the line infantry. */
    walker: function (core) {
      return [
        { name: 'body', bind: [0, 1.95, 0], build: function (b) {
            b.color('#100c1c').tooth(0.95);
            b.push(); b.scale(0.95, 1.15, 0.85); b.ico(1.02, 0); b.pop();
            b.color('#1a1330').tooth(0.9);
            b.push(); b.translate(0, 0.78, 0.14); b.scale(0.75, 0.55, 0.75); b.ico(0.72, 0); b.pop();
            b.color('#231a3d').tooth(0.85);
            b.push(); b.translate(0, -0.14, 0.78); b.box(1.05, 0.7, 0.4); b.pop();
          } },
        { name: 'head', parent: 'body', bind: [0, 1.22, 0.2], build: function (b) {
            b.color('#150f26').tooth(0.9);
            b.push(); b.scale(0.8, 0.7, 1.0); b.ico(0.52, 0); b.pop();
          } },
        { name: 'core', parent: 'head', bind: [0, 0.03, 0.44], build: function (b) {
            b.color(core).tooth(0.05).emissive(1.0);
            b.shard(0.23, 0.3, 0.24, 5, 0);
          } },

    },
    /* STRIDER: tall, heavy, four long legs. Bosses and elites. */
    strider: function (core) {
      return [
        { name: 'body', bind: [0, 2.4, 0], build: function (b) {
            b.color('#0d0918').tooth(1.0);
            b.push(); b.scale(1.35, 0.95, 1.7); b.ico(0.95, 0); b.pop();
            b.color('#191128').tooth(0.95);
            b.push(); b.translate(0, 0.6, -0.2); b.scale(1.0, 0.7, 1.1); b.ico(0.72, 0); b.pop();
            /* Carapace plates: the heavy silhouette. */
            b.color('#241a3d').tooth(0.9);

              var a = -0.9 + i * 0.45;
              b.push();

            b.color('#150f26').tooth(0.9);
            b.push(); b.scale(0.9, 0.75, 1.2); b.ico(0.5, 0); b.pop();
            b.color('#c9c2d8').tooth(0.3);
            for (var i = 0; i < 4; i++) {

    },
    /* FLYER: no legs, a hovering hull with vanes. */
    flyer: function (core) {
      return [
        { name: 'body', bind: [0, 2.9, 0], build: function (b) {
            b.color('#100c1c').tooth(0.9);
            b.push(); b.scale(1.25, 0.45, 1.5); b.ico(0.88, 0); b.pop();
            b.color('#1a1330').tooth(0.85);
            b.push(); b.translate(0, 0.22, -0.28); b.scale(0.7, 0.4, 0.7); b.ico(0.6, 0); b.pop();
          } },
        { name: 'vaneL', parent: 'body', bind: [0.88, 0.02, -0.14], build: function (b) {

          } },
        { name: 'vaneR', parent: 'body', bind: [-0.88, 0.02, -0.14], build: function (b) {

        { name: 'core', parent: 'body', bind: [0, -0.03, 0.8], build: function (b) {

          } }
      ];

  };

  /* Leg part generator shared by the three walking rigs. Upper and lower are
     SIBLINGS rather than parent and child, because the IK solver writes each
     bone an absolute aim in the creature's local space and composing that
     through a parent would require inverting the parent every frame for no
     visual gain. See the note in 07-rig.js driveLeg. */
  function legs(count, spread, upperLen, lowerLen, col) {
    var out = [];
    for (var i = 0; i < count; i++) {
      var side = (i % 2) ? 1 : -1;
      var row = Math.floor(i / 2);
      var zOff = count > 2 ? (row === 0 ? spread * 0.75 : -spread * 0.75) : 0;
      (function (idx, sx, sz) {
        out.push({
          name: 'legU' + idx, bind: [spread * sx, upperLen + lowerLen, sz],
          build: function (b) {
            b.color(col).tooth(0.8);
            b.limb([0, 0, 0], [0, -upperLen, 0], 0.13, 0.10, 4);
          }
        });
        out.push({
          name: 'legL' + idx, bind: [spread * sx, upperLen + lowerLen, sz],
          build: function (b) {
            b.color(col).tooth(0.8);
            b.limb([0, 0, 0], [0, -lowerLen, 0], 0.10, 0.07, 4);
          }
        });
      })(i, side, zOff);
    }
    return out;
  }

  /* Build (and cache) the mesh set for a denizen archetype. The faction only
     changes the core colour. */
  function denizen(rigType, faction) {
    var key = 'den:' + rigType + ':' + faction;
    return memo(key, function () {
      var pal = PAINT.FACTIONS[faction] || PAINT.FACTIONS.xeno;
      var builder = DENIZEN_BUILD[rigType];
      if (!builder) throw new Error('MODELS.denizen: unknown rig "' + rigType + '"');
      var spec = builder(pal.accent);
      var parts = [];
      for (var i = 0; i < spec.length; i++) {
        var s = spec[i];
        var b = MESH.builder('den:' + rigType + ':' + faction + ':' + s.name);
        s.build(b);
        var data = b.build({ jitter: 0.022 });
        parts.push({
          name: s.name,
          parent: s.parent || null,
          bind: s.bind,
          mesh: GL.mesh(data),
          /* The raw vertex data is retained alongside the uploaded mesh so the
             death effect can read the model's own facets back out and throw
             them individually. GL.mesh uploads and then forgets, so without
             this the shatter has nothing to shatter, and the central visual
             idea of the whole art direction (a body comes apart into the brush
             strokes it was painted with) has no data to work from. */
          data: data
        });
      }
      return { parts: parts, rigType: rigType };
    });
  }

  /* ---------- projectiles and shared props ---------- */
  function projectile(kind, colorHex) {
    var key = 'proj:' + kind + ':' + colorHex;
    return memo(key, function () {
      var b = MESH.builder(key);
      b.color(colorHex).tooth(0.05).emissive(1.0);
      if (kind === 'shell') b.ico(0.28, 0);
      else if (kind === 'bolt') b.shard(0.10, 0.42, 0.14, 4, 0);
      else b.shard(0.08, 0.3, 0.1, 4, 0);
      return GL.mesh(b.build({ jitter: 0.01 }));
    });
  }

  function ring(rInner, rOuter, segs, colorHex) {
    var key = 'ring:' + rInner + ':' + rOuter + ':' + segs + ':' + colorHex;
    return memo(key, function () {
      var b = MESH.builder(key);
      b.color(colorHex);
      b.ring(rInner, rOuter, segs, 0);
      return GL.mesh(b.build({ jitter: 0 }));
    });
  }

  function beam(colorHex) {
    return memo('beam:' + colorHex, function () {
      var b = MESH.builder('beam:' + colorHex);
      b.color(colorHex).tooth(0).emissive(1.0);
      /* A unit-length box along +Z, scaled per draw. Built as a thin prism so
         it has a little volume from the side and does not vanish edge-on the
         way a flat quad would. */
      b.prism(0.5, 0.5, 1.0, 4, 0, Math.PI / 4);
      return GL.mesh(b.build({ jitter: 0 }));
    });
  }

  function dome(colorHex) {
    return memo('dome:' + colorHex, function () {
      var b = MESH.builder('dome:' + colorHex);
      b.color(colorHex);
      b.lathe([[0, 1], [0.45, 0.92], [0.78, 0.68], [0.95, 0.35], [1.0, 0]], 12);
      return GL.mesh(b.build({ jitter: 0 }));
    });
  }

  /* The goal marker: what the denizens are walking toward, and the thing the
     player is defending. It has to read as important from the first frame. */
  function goalMesh(accentHex) {
    return memo('goal:' + accentHex, function () {
      var b = MESH.builder('goal:' + accentHex);
      b.color(HULL.dark).tooth(1.0);
      b.prism(3.1, 2.7, 1.0, 8, 0);
      b.color(HULL.mid).tooth(0.9);
      b.prism(2.4, 1.7, 1.6, 8, 1.0);
      b.color(HULL.trim).tooth(0.7);
      b.ring(1.75, 2.25, 8, 2.6);
      b.color(accentHex).tooth(0.05).emissive(1.0);
      b.push(); b.translate(0, 4.3, 0); b.shard(0.85, 2.1, 1.5, 6, 0); b.pop();
      b.emissive(0);
      b.color(HULL.light).tooth(0.8);
      for (var i = 0; i < 4; i++) {
        var a = (i / 4) * U.TAU + 0.4;
        b.push();
        b.translate(Math.cos(a) * 1.9, 2.6, Math.sin(a) * 1.9);
        b.rotateY(-a); b.rotateX(-0.18);
        b.box(0.28, 2.6, 0.4);
        b.pop();
      }
      return GL.mesh(b.build({ jitter: 0.03 }));
    });
  }

  function spawnMesh(accentHex) {
    return memo('spawn:' + accentHex, function () {
      var b = MESH.builder('spawn:' + accentHex);
      b.color('#0a0714').tooth(1.0);
      b.prism(3.3, 3.0, 0.7, 7, 0);
      b.color('#150d22').tooth(0.95);
      for (var i = 0; i < 5; i++) {
        var a = (i / 5) * U.TAU + 0.2;
        b.push();
        b.translate(Math.cos(a) * 2.2, 0.5, Math.sin(a) * 2.2);
        b.rotateY(-a); b.rotateZ(Math.cos(a * 2) * 0.3);
        b.prism(0.5, 0.18, 3.4 + (i % 3), 5, 0);
        b.pop();
      }
      b.color(accentHex).tooth(0.05).emissive(1.0);
      b.ring(1.5, 2.1, 14, 0.75);
      return GL.mesh(b.build({ jitter: 0.05 }));
    });
  }

  function clearCache() {
    for (var k in cache) delete cache[k];
  }

  return {
    tower: tower,
    denizen: denizen,
    projectile: projectile,
    ring: ring,
    beam: beam,
    dome: dome,
    goalMesh: goalMesh,
    spawnMesh: spawnMesh,
    elementColor: elementColor,
    HULL: HULL,
    clearCache: clearCache
  };
})();


/* ===== 10-audio.js ===== */
/* RELIQUARY :: 10-audio
   Everything you hear, synthesised at runtime. No sample files, because the
   whole game has to survive as one self-contained HTML.

   THE BUS LAYOUT, and why it is not just "connect to destination":

     voice -> [pan] -> [send] -> reverb -> \
                                            +-> sfxGain -> comp -> limiter -> out
     voice -> [pan] ------------------------/
     music ---------------------------------> musicGain -^
     ui ------------------------------------> uiGain ----^

   A COMPRESSOR IS NOT OPTIONAL HERE. A tower defence at wave eighteen can fire
   forty shots a second. Without a compressor the summed peaks clip the output
   stage and the result is not "loud", it is a crackle that sounds like broken
   hardware. The compressor rides the whole mix down when the board is busy,
   which is also the effect that makes a big wave FEEL big: everything else
   ducks under the explosion.

   THE THING THAT MAKES SYNTHESISED SFX SOUND CHEAP is that every instance is
   identical. Real sound never repeats exactly. Every recipe here jitters
   pitch, timing and filter cutoff per shot, which is the difference between a
   machine gun and a machine gun sound effect played forty times.

   AUTOPLAY. Browsers refuse to start an AudioContext without a user gesture.
   That is handled by creating the context lazily on the first real input and
   by making every play() a no-op until then, rather than by throwing. */
'use strict';

var AUDIO = (function () {

  var ctx = null;
  var master = null, comp = null, limiter = null;
  var sfxGain = null, musicGain = null, uiGain = null, reverbSend = null;
  var noiseBuf = null;
  var ready = false;
  var muted = false;
  var volumes = { master: 0.85, sfx: 0.9, music: 0.5, ui: 0.7 };
  var errors = [];

  /* Voice budget. A cap per sound family, because forty simultaneous identical
     shots is both inaudible as detail and expensive. Oldest wins eviction is
     wrong for gunfire (you want the NEWEST), so over-budget calls are simply
     dropped, which is inaudible when the budget is generous. */
  var voices = Object.create(null);
  var VOICE_CAP = { shot: 14, impact: 10, death: 8, hit: 12, react: 6, ui: 6 };

  function now() { return ctx ? ctx.currentTime : 0; }

  function noteVoice(family) {
    var cap = VOICE_CAP[family] || 8;
    var t = now();
    var arr = voices[family] || (voices[family] = []);
    /* Drop expired entries, then check the budget. */
    var w = 0;
    for (var i = 0; i < arr.length; i++) if (arr[i] > t) arr[w++] = arr[i];
    arr.length = w;
    if (arr.length >= cap) return false;
    arr.push(t + 0.35);
    return true;
  }

  /* ---------- init ---------- */

  function init() {
    if (ctx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { errors.push('no AudioContext'); return false; }
      ctx = new AC();

      limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -1.5;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.08;

      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 8;
      comp.ratio.value = 3.5;
      comp.attack.value = 0.006;
      comp.release.value = 0.22;

      master = ctx.createGain();
      master.gain.value = volumes.master;

      sfxGain = ctx.createGain(); sfxGain.gain.value = volumes.sfx;
      musicGain = ctx.createGain(); musicGain.gain.value = volumes.music;
      uiGain = ctx.createGain(); uiGain.gain.value = volumes.ui;

      /* Reverb from a synthesised impulse: exponentially decaying noise with a
         low-pass sweep, which is a passable small hall and costs one buffer.
         The send is deliberately quiet: a game this busy turns to mud fast. */
      var conv = ctx.createConvolver();
      conv.buffer = buildImpulse(1.9, 2.6);
      reverbSend = ctx.createGain();
      reverbSend.gain.value = 0.22;
      reverbSend.connect(conv);
      conv.connect(sfxGain);

      sfxGain.connect(comp);
      musicGain.connect(comp);
      uiGain.connect(comp);
      comp.connect(master);
      master.connect(limiter);
      limiter.connect(ctx.destination);

      noiseBuf = buildNoise(2.0);
      ready = true;
      return true;
    } catch (e) {
      errors.push(String(e && e.message || e));
      ctx = null;
      return false;
    }
  }

  /* Resume must be called from inside a real user gesture handler. */
  function resume() {
    if (!ctx) init();
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(function (e) { errors.push('resume: ' + e); });
    }
    return !!ctx && ctx.state === 'running';
  }

  function buildNoise(seconds) {
    var n = Math.floor(ctx.sampleRate * seconds);
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = buf.getChannelData(0);
    var r = U.rng('noise');
    for (var i = 0; i < n; i++) d[i] = r() * 2 - 1;
    return buf;
  }

  function buildImpulse(seconds, decay) {
    var n = Math.floor(ctx.sampleRate * seconds);
    var buf = ctx.createBuffer(2, n, ctx.sampleRate);
    var r = U.rng('impulse');
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < n; i++) {
        var t = i / n;
        /* A short pre-delay of silence gives the tail a sense of room size
           that a bare decaying noise burst does not have. */
        var pre = t < 0.012 ? 0 : 1;
        d[i] = (r() * 2 - 1) * Math.pow(1 - t, decay) * pre;
      }
    }
    return buf;
  }

  /* ---------- primitives ---------- */

  function env(param, t0, peak, attack, decay, sustain, release, dur) {
    param.cancelScheduledValues(t0);
    param.setValueAtTime(0.0001, t0);
    param.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + attack);
    var s = Math.max(0.0001, peak * (sustain === undefined ? 0 : sustain));
    param.exponentialRampToValueAtTime(s, t0 + attack + decay);
    param.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }

  /* A single tone voice: oscillator through a filter through a gain, with
     optional pitch sweep. The workhorse. */
  function tone(o) {
    if (!ready || muted) return;
    var t0 = now() + (o.delay || 0);
    var osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1 !== undefined) {
      if (o.sweepExp === false) osc.frequency.linearRampToValueAtTime(o.f1, t0 + (o.sweep || o.dur));
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + (o.sweep || o.dur));
    }
    var g = ctx.createGain();
    var dur = o.dur || 0.2;
    env(g.gain, t0, o.gain === undefined ? 0.3 : o.gain,
        o.attack === undefined ? 0.004 : o.attack,
        o.decay === undefined ? dur * 0.4 : o.decay,
        o.sustain, o.release, dur);

    var node = osc;
    if (o.filter) {
      var f = ctx.createBiquadFilter();
      f.type = o.filter;
      f.frequency.setValueAtTime(o.cutoff || 1200, t0);
      if (o.cutoff1 !== undefined) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.cutoff1), t0 + dur);
      f.Q.value = o.q === undefined ? 1 : o.q;
      node.connect(f); node = f;
    }
    node.connect(g);
    routeOut(g, o);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  /* A noise burst: the basis of every impact, explosion and mechanical
     movement in the game. */
  function noise(o) {
    if (!ready || muted) return;
    var t0 = now() + (o.delay || 0);
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = o.rate === undefined ? 1 : o.rate;
    src.loop = true;
    var offset = (o.offset === undefined ? Math.random() * 1.5 : o.offset);
    var g = ctx.createGain();
    var dur = o.dur || 0.2;
    env(g.gain, t0, o.gain === undefined ? 0.3 : o.gain,
        o.attack === undefined ? 0.002 : o.attack,
        o.decay === undefined ? dur * 0.5 : o.decay,
        o.sustain, o.release, dur);

    var node = src;
    var f = ctx.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.cutoff || 900, t0);
    if (o.cutoff1 !== undefined) {
      f.frequency.exponentialRampToValueAtTime(Math.max(30, o.cutoff1), t0 + dur);
    }
    f.Q.value = o.q === undefined ? 1.0 : o.q;
    node.connect(f); node = f;
    node.connect(g);
    routeOut(g, o);
    src.start(t0, offset);
    src.stop(t0 + dur + 0.05);
  }

  /* Pan by screen position. A sound coming from the left of the board should
     arrive on the left, and this is nearly free: it is the cheapest thing that
     makes a 2D-ish mix feel like a space. */
  function routeOut(node, o) {
    var target = o.bus === 'music' ? musicGain : (o.bus === 'ui' ? uiGain : sfxGain);
    var out = node;
    if (o.pan !== undefined && ctx.createStereoPanner) {
      var p = ctx.createStereoPanner();
      p.pan.value = U.clamp(o.pan, -1, 1);
      out.connect(p);
      out = p;
    }
    out.connect(target);
    if (o.reverb && reverbSend) out.connect(reverbSend);
  }

  /* ---------- SFX recipes ----------
     Each takes an options object carrying at least `pan`. Every one jitters,
     because identical repeats are what make synth SFX sound synthetic. */

  var J = Math.random;

  var SFX = {
    /* Tower fire, one per attack kind. These are the sounds the player will
       hear ten thousand times, so they are short, dry and mid-forward, and
       they deliberately leave the low end to the impacts. */
    fire_bullet: function (o) {
      var j = 1 + (J() - 0.5) * 0.18;
      noise({ pan: o.pan, dur: 0.09, gain: 0.20, filter: 'bandpass',
              cutoff: 2100 * j, cutoff1: 700, q: 1.4, attack: 0.001, decay: 0.03 });
      tone({ pan: o.pan, type: 'square', f0: 300 * j, f1: 90, dur: 0.08,
             gain: 0.13, filter: 'lowpass', cutoff: 1800, attack: 0.001 });
    },
    fire_shell: function (o) {
      var j = 1 + (J() - 0.5) * 0.12;
      noise({ pan: o.pan, dur: 0.22, gain: 0.30, filter: 'lowpass',
              cutoff: 900 * j, cutoff1: 180, q: 0.7, attack: 0.002, decay: 0.09, reverb: true });
      tone({ pan: o.pan, type: 'triangle', f0: 130 * j, f1: 42, dur: 0.26, gain: 0.24,
             filter: 'lowpass', cutoff: 700, attack: 0.002 });
    },
    fire_beam: function (o) {
      /* Beams are CONTINUOUS, so this is only the ignition tick. The sustain
         is handled by beamLoop below, because retriggering a sound every frame
         is the classic way to turn a laser into a buzzsaw. */
      tone({ pan: o.pan, type: 'sawtooth', f0: 620, f1: 1500, dur: 0.14, gain: 0.10,
             filter: 'bandpass', cutoff: 1400, q: 4, attack: 0.006 });
    },
    fire_chain: function (o) {
      var j = 1 + (J() - 0.5) * 0.3;
      noise({ pan: o.pan, dur: 0.16, gain: 0.22, filter: 'highpass',
              cutoff: 2400 * j, cutoff1: 5200, q: 0.8, attack: 0.001, decay: 0.05 });
      tone({ pan: o.pan, type: 'square', f0: 1800 * j, f1: 420, dur: 0.13, gain: 0.09,
             filter: 'bandpass', cutoff: 2600, q: 6 });
    },
    fire_cone: function (o) {
      noise({ pan: o.pan, dur: 0.30, gain: 0.22, filter: 'bandpass',
              cutoff: 700, cutoff1: 1500, q: 0.6, attack: 0.03, decay: 0.16, reverb: true });
    },
    fire_hitscan: function (o) {
      var j = 1 + (J() - 0.5) * 0.08;
      tone({ pan: o.pan, type: 'sawtooth', f0: 1400 * j, f1: 70, dur: 0.34, gain: 0.24,

/* ===== 11-fx.js ===== */
/* HIGHPOLY :: 11-fx
   Particles, shatter, floating text and screen impact. Amplified edition:
   everything the base system did, plus GLOW and EMBER particle kinds, a
   coreFlash emitter (the heart of an explosion), sparks, dust, trails,
   combo-string impactKick, and colored screen flashes.

   THE SHATTER IS STILL THE THESIS. When something dies it comes apart into
   the FACETS it was painted with, each keeping its own colour. Everything
   else in this file exists to make that moment resonate: the flash beneath
   it, the ring around it, the sparks that break the silence.

   POOLING IS NOT OPTIONAL. Every array is allocated once at boot and reused
   with a live-count cursor, because the whole point of the amplification was
   MORE particles, and more particles means GC pressure matters more. */
'use strict';

var FX = (function () {

  var V = U.V;

  /* ---------- particles ---------- */
  var MAX = 6300;
  var px = new Float32Array(MAX), py = new Float32Array(MAX), pz = new Float32Array(MAX);
  var vx = new Float32Array(MAX), vy = new Float32Array(MAX), vz = new Float32Array(MAX);
  var pr = new Float32Array(MAX), pg = new Float32Array(MAX), pb = new Float32Array(MAX);
  var life = new Float32Array(MAX), maxLife = new Float32Array(MAX);
  var size = new Float32Array(MAX), size1 = new Float32Array(MAX);
  var rot = new Float32Array(MAX), rotv = new Float32Array(MAX);
  var kind = new Float32Array(MAX), drag = new Float32Array(MAX), grav = new Float32Array(MAX);
  var alpha0 = new Float32Array(MAX);
  var count = 0;

  var KIND = { SPARK: 0, SMOKE: 1, RING: 2, FLAKE: 3, GLOW: 4, EMBER: 5 };

  function spawn(o) {
    if (count >= MAX) return -1;
    var i = count++;
    px[i] = o.x; py[i] = o.y; pz[i] = o.z;
    vx[i] = o.vx || 0; vy[i] = o.vy || 0; vz[i] = o.vz || 0;
    pr[i] = o.r; pg[i] = o.g; pb[i] = o.b;
    life[i] = maxLife[i] = o.life;
    size[i] = o.size; size1[i] = o.size1 === undefined ? o.size * 0.2 : o.size1;
    rot[i] = o.rot || 0; rotv[i] = o.rotv || 0;
    kind[i] = o.kind || 0;
    drag[i] = o.drag === undefined ? 1.6 : o.drag;
    grav[i] = o.grav === undefined ? -14 : o.grav;
    alpha0[i] = o.alpha === undefined ? 1 : o.alpha;
    return i;
  }

  function update(dt) {
    var i = 0;
    while (i < count) {
      life[i] -= dt;
      if (life[i] <= 0) {
        var last = --count;
        if (i !== last) {
          px[i] = px[last]; py[i] = py[last]; pz[i] = pz[last];
          vx[i] = vx[last]; vy[i] = vy[last]; vz[i] = vz[last];
          pr[i] = pr[last]; pg[i] = pg[last]; pb[i] = pb[last];
          life[i] = life[last]; maxLife[i] = maxLife[last];
          size[i] = size[last]; size1[i] = size1[last];
          rot[i] = rot[last]; rotv[i] = rotv[last];
          kind[i] = kind[last]; drag[i] = drag[last]; grav[i] = grav[last];
          alpha0[i] = alpha0[last];

      var d = Math.exp(-drag[i] * dt);
      vx[i] *= d; vz[i] *= d;
      vy[i] = vy[i] * d + grav[i] * dt;
      px[i] += vx[i] * dt; py[i] += vy[i] * dt; pz[i] += vz[i] * dt;
      rot[i] += rotv[i] * dt;

        py[i] = 0.05;
        vy[i] *= -0.32;

        rotv[i] *= 0.5;
      }
      i++;
    }
  }

    for (var i = 0; i < count; i++) {

      var s = U.mix(size[i], size1[i], t);
      /* Alpha holds, then falls. GLOW spends slightly longer at full, so the
         heart of an explosion breathes before it dies. */
      var a = alpha0[i] * (t < 0.55 ? 1 : 1 - (t - 0.55) / 0.45);
      if (kind[i] === KIND.GLOW) a = alpha0[i] * (t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3);
      R.pushParticle(px[i], py[i], pz[i], pr[i], pg[i], pb[i], a, s, rot[i], kind[i]);
    }
  }

        vz: Math.sin(ph) * Math.sin(th) * s,

        size1: (opts.size || 0.32) * 0.1,
        rot: rnd() * U.TAU, rotv: (rnd() - 0.5) * 9,

  function smoke(pos, color, n, scale) {
    n = n || 6;

      spawn({
        x: pos[0] + (rnd() - 0.5) * 1.2 * scale,
        y: pos[1] + rnd() * 0.6 * scale,
        z: pos[2] + (rnd() - 0.5) * 1.2 * scale,
        vx: (rnd() - 0.5) * 2.2, vy: 1.2 + rnd() * 2.0, vz: (rnd() - 0.5) * 2.2,
        r: color[0], g: color[1], b: color[2],
        life: 1.1 + rnd() * 1.0,
        size: (1.1 + rnd() * 0.8) * scale, size1: (2.6 + rnd()) * scale,

  }

  function shockRing(pos, color, radius, life) {
    spawn({
      x: pos[0], y: pos[1] + 0.2, z: pos[2],
      vx: 0, vy: 0, vz: 0,
      r: color[0], g: color[1], b: color[2],
      life: life || 0.42,
      size: radius * 0.35, size1: radius * 2.1,
      rot: 0, rotv: 0, kind: KIND.RING, drag: 0, grav: 0, alpha: 0.55

      x: pos[0], y: pos[1], z: pos[2],

/* RELIQUARY :: 12-sim
   The simulation. Everything that would still be true with the renderer
   switched off.

   ONE MARK AT A TIME. A denizen carries at most one elemental mark. Applying a
   second element that pairs with it triggers a reaction, consumes the mark,
   and leaves the new element as the standing mark. The alternative, letting
   marks stack, was rejected on legibility grounds: with three marks up the
   player cannot predict which reaction the next shot produces, and a reaction
   system nobody can predict is a random damage multiplier wearing a costume.

   ARMOUR IS MULTIPLICATIVE AND CAPPED. Additive flat reduction makes low-damage
   fast towers worthless against armour and is the usual reason a tower defence
   collapses into one correct build. Capping at 75% keeps every tower relevant
   while still making SUPERCONDUCT worth firing.

   THE ERROR BUFFER. Anything that throws inside a step is recorded in
   `errors` and reported, never swallowed. A delayed effect that throws on
   every trigger, forever, with every gate green, is a real failure mode: the
   parent project shipped exactly that for its whole life. */
'use strict';

var SIM = (function () {

  var V = U.V;
  var errors = [];
  function recordError(where, e) {
    if (errors.length < 40) errors.push({ where: where, msg: String(e && e.message || e) });
    if (typeof console !== 'undefined') console.error('[SIM:' + where + ']', e);
  }

  /* ---------- state ---------- */
  var G = null;

  function create(opts) {
    /* TEAR THE PREVIOUS RUN DOWN FIRST.
       Replacing G with a fresh object does NOT stop the oscillators the old
       game's beam and sweep towers left running: a Web Audio node keeps
       playing until something calls stop() on it, and nothing else holds a
       reference once G is gone. Every restart used to leak one running voice
       per beam tower, forever, and the symptom is a rising drone that the
       player cannot mute or explain. */
    if (G && G.towers) {
      for (var i = 0; i < G.towers.length; i++) {
        if (G.towers[i].voice) { G.towers[i].voice.stop(); G.towers[i].voice = null; }
      }
    }
    errors.length = 0;

    var diff = opts.difficulty || DATA.DIFFICULTIES[1];
    var board = TERRAIN.build(opts.boardDef);
    var cmd = DATA.COMMANDERS[opts.commander] || DATA.COMMANDERS.vanta;

    G = {
      board: board,
      boardDef: opts.boardDef,
      faction: opts.faction || 'human',
      enemyFaction: opts.enemyFaction || 'xeno',
      commander: cmd,
      difficulty: diff,

      gold: DATA.START_GOLD + (cmd.id === 'axiom' ? 150 : 0),
      lives: diff.lives,
      maxLives: diff.lives,
      wave: 0,
      waveActive: false,
      waveTimer: 0,
      betweenWaves: 6.0,
      spawnQueue: [],

      denizens: [],
      towers: [],
      projs: [],
      delayed: [],

      time: 0,
      status: 'prep',        /* prep | play | won | lost */
      leaked: 0,
      kills: 0,
      damageDealt: 0,
      goldEarned: 0,
      reactionCounts: {},

      abilities: {
        q: { cd: 0, active: 0 },
        e: { cd: 0, active: 0 }

      globalBuffs: { fireRate: 1, damage: 1, range: 1, slowAll: 0, stopAll: 0 },

  function state() { return G; }

  function costOf(def, tier) {

  }
  function upgradeCost(tower) {

      chains: d.chains || 0, chainRange: d.chainRange || 0,
      chainFalloff: d.chainFalloff || 0.7,
      coneAngle: d.coneAngle || 0, pierce: d.pierce || 0,
      execute: d.execute || 0, pull: d.pull || 0, income: d.income || 0,

      sweepRate: d.sweepRate || 1, launch: d.launch || 0,

      if (u.splash) s.splash *= u.splash;
      if (u.chains) s.chains += u.chains;

      if (u.execute) s.execute *= u.execute;
      if (u.pull) s.pull *= u.pull;
      if (u.income) s.income *= u.income;
      if (u.rampMax) s.rampMax *= u.rampMax;
      if (u.rampRate) s.rampRate *= u.rampRate;
      if (u.sweepRate) s.sweepRate *= u.sweepRate;

      poison: 0, poisonT: 0, poisonStacks: 0, poisonSrc: null,
      stun: 0,
      shred: 0, shredT: 0,
      healRev: 0,
      flash: 0,
      scale: def.scale || 1,
      animPhase: Math.random(),
      bob: 0, bobV: 0,
      lean: 0, leanV: 0,
      rig: null,
      summonT: 0,
      phaseIdx: 0,
      enrage: 1,
      spawnT: 0.32,               /* pop-in scale anim, consumed in the pose */
      lastHitBy: null
    };
    var s = G.board.pathAt(d.dist);
    d.pos = [s.pos[0], G.board.heightAt(s.pos[0], s.pos[2]), s.pos[2]];
    d.yaw = Math.atan2(s.dir[0], s.dir[2]);
    G.denizens.push(d);
    /* The arrival has to read as WEIGHT, not as a teleport: a ground ring, a
       low burst and a puff of dust under the body. The hue matches the enemy
       faction accent so spawn and death read as the same people. */
    var ePal = PAINT.FACTIONS[G.enemyFaction] || PAINT.FACTIONS.xeno;
    var col = U.hex2rgb(ePal.accent);
    FX.shockRing([d.pos[0], d.pos[1] + 0.2, d.pos[2]], col, 2.6, 0.4);
    FX.burst([d.pos[0], d.pos[1] + 0.6, d.pos[2]], col, { count: 8, speed: 5, life: 0.4, size: 0.24 });
    FX.dust([d.pos[0], d.pos[1], d.pos[2]], [0.35, 0.28, 0.5], 4, 0.8);
    return d;
  }

  function armorOf(d) {
    var a = (d.def.armor || 0) * (1 - d.shred);
    if (d.def.trait === 'shield' && d.hp > d.maxHp * 0.5) a += (d.def.shield ? d.def.shield.amount : 0.3);
    return U.clamp(a, 0, 0.75);
  }

  /* THE DAMAGE PIPELINE. One function, so there is exactly one place where a
     damage rule can be added and exactly one place to look when a number is
     wrong. */
  function damage(d, amount, opts) {
    if (!d.alive || d.dying > 0) return 0;
    opts = opts || {};
    var element = opts.element || null;
    var src = opts.source || null;

    var reaction = null;
    if (element) {
      if (d.mark && d.mark !== element) {
        reaction = DATA.reactionFor(d.mark, element);
      }
      d.mark = element;
      d.markT = 6.0;
    }

    /* REACTIONS HAVE A PER-BODY COOLDOWN.
       Without one, a field tower (SINGULARITY applies VOID continuously)
       re-marks its target every tick, so every kinetic shot landing on that
       target triggers RUPTURE. Measured at wave nine with a full board: 110
       RUPTURE against 2 PLASMA, a callout on screen almost every frame. That
       is not a deep system, it is a damage multiplier with a light show, and
       it drowns out the reactions the player actually set up.
       The mark still updates while on cooldown, so nothing is lost except the
       spam: the next reaction simply lands on the beat instead of instantly. */
    if (reaction) {
      if (d.reactCd > 0) reaction = null;
      else d.reactCd = 0.55;
    }

    var mult = 1;
    if (reaction) {
      mult *= reaction.mult;
      if (G.commander.id === 'seraph') mult *= 1.15;
      applyReaction(d, reaction, opts);
      G.reactionCounts[reaction.id] = (G.reactionCounts[reaction.id] || 0) + 1;
    }

    var armor = armorOf(d);
    var dealt = amount * mult * (1 - armor);

    if (reaction && reaction.missingHp) {
      dealt += (d.maxHp - d.hp) * reaction.missingHp;
    }

    d.hp -= dealt;
    d.flash = Math.max(d.flash, reaction ? 1.0 : 0.55);
    d.lastHitBy = src;
    G.damageDealt += dealt;
    if (src) { src.damage += dealt; }

    /* Impact sparkle on solid hits, throttled by a per-body timer so a field
       tower (which applies damage every tick) does not flood the buffer. A
       hit at 9+ damage sprays 3-4 coloured sparks off the body; a reaction
       gets its full treatment further down. */
    if (dealt >= 9 && (d.sparkCd === undefined || d.sparkCd <= 0)) {
      d.sparkCd = 0.08;
      var hitCol = element && DATA.ELEMENTS[element]
        ? U.hex2rgb(DATA.ELEMENTS[element].color) : [0.85, 0.9, 1];
      FX.sparks([d.pos[0], d.pos[1] + 1.0 * d.scale, d.pos[2]], hitCol,
        { count: 4, speed: 8, size: 0.2, life: 0.35 });
      if (dealt >= 30) FX.hit(0.06, { aberr: false });
    }

    /* Execute: MAW kills anything below a threshold outright, except bosses,
       because an instant kill on a boss is not a mechanic, it is a bug the
       player found. */
    if (opts.execute && !d.def.boss && d.hp > 0 && d.hp < d.maxHp * opts.execute) {
      d.hp = 0;
    }

    if (d.hp <= 0) kill(d, opts);
    return dealt;
  }

  function applyReaction(d, r, opts) {
    try {
      if (r.burn) { d.burn = Math.max(d.burn, r.burn.dps); d.burnT = Math.max(d.burnT, r.burn.dur); }
      if (r.shred) { d.shred = Math.max(d.shred, r.shred.amount); d.shredT = Math.max(d.shredT, r.shred.dur); }
      if (r.stun) d.stun = Math.max(d.stun, r.stun);
      if (r.healReversal) d.healRev = Math.max(d.healRev, r.healReversal);
      if (r.amplify && d.poisonStacks > 0) d.poisonStacks = Math.min(12, Math.round(d.poisonStacks * r.amplify));
      if (r.pull) {
        for (var i = 0; i < G.denizens.length; i++) {
          var o = G.denizens[i];
          if (o === d || !o.alive) continue;
          if (V.dist(o.pos, d.pos) < r.pull * 2.2) {
            o.dist = U.mix(o.dist, d.dist, 0.35);
          }
        }
      }
      if (r.spread) {
        for (var j = 0; j < G.denizens.length; j++) {
          var e = G.denizens[j];
          if (e === d || !e.alive) continue;
          if (V.dist(e.pos, d.pos) < r.spread && !e.mark) { e.mark = d.mark; e.markT = 4.0; }
        }
      }
      /* The callout and the sound, once per reaction, at the body. The full
         treatment: a hot flash at the skin, a spray of sparks, two rings (the
         inner one fast and bright, the outer one slow and wide), embers that
         linger, and a tinted screen flash so the whole frame changes colour. */
      FX.text([d.pos[0], d.pos[1] + 2.4 * d.scale, d.pos[2]], r.name,
        { color: r.color, life: 1.05, size: 1.15, cls: 'reaction' });
      var c = U.hex2rgb(r.color);
      FX.coreFlash([d.pos[0], d.pos[1] + 1.4 * d.scale, d.pos[2]], c, 1.7, 0.32);
      FX.sparks([d.pos[0], d.pos[1] + 1.2 * d.scale, d.pos[2]], c,
        { count: 24, speed: 14, size: 0.28, life: 0.8 });
      FX.shockRing([d.pos[0], d.pos[1] + 0.3, d.pos[2]], c, 2.4, 0.3);
      FX.shockRing([d.pos[0], d.pos[1] + 0.3, d.pos[2]], c, 4.4, 0.55);
      for (var ei = 0; ei < 8; ei++) FX.ember([d.pos[0], d.pos[1] + 0.8, d.pos[2]], c);
      AUDIO.play('reaction', { pan: panOf(d.pos), mult: r.mult });
      FX.hit(Math.min(0.9, 0.25 * r.mult), {
        stop: r.mult > 2 ? 0.05 : 0,
        flash: r.mult > 1.9 ? 0.12 : 0.05,
        flashColor: c
      });
    } catch (e) {
      recordError('applyReaction:' + r.id, e);
    }
  }

  function kill(d, opts) {
    if (!d.alive || d.dying > 0) return;
    d.alive = false;
    d.dying = 0.55;
    d.hp = 0;
    G.kills++;

    var bounty = d.def.bounty * G.difficulty.gold;
    if (G.commander.id === 'rake') bounty *= 1.25;
    bounty = Math.round(bounty);
    G.gold += bounty;
    G.goldEarned += bounty;
    if (d.lastHitBy) d.lastHitBy.kills++;

    FX.text([d.pos[0], d.pos[1] + 2.0 * d.scale, d.pos[2]], '+' + bounty,
      { color: '#fbbf24', life: 0.9, size: 0.9, cls: 'gold' });

    var pal = PAINT.FACTIONS[G.enemyFaction] || PAINT.FACTIONS.xeno;
    var col = U.hex2rgb(pal.accent);
    var big = d.def.boss || d.scale > 1.55;
    FX.coreFlash([d.pos[0], d.pos[1] + 0.9 * d.scale, d.pos[2]], col, big ? 2.8 : 1.1, big ? 0.5 : 0.22);
    FX.burst([d.pos[0], d.pos[1] + 1.0 * d.scale, d.pos[2]], col,
      { count: big ? 46 : 18, speed: big ? 20 : 11, life: big ? 1.1 : 0.6, size: big ? 0.6 : 0.34 });
    if (big) {
      for (var bi = 0; bi < 14; bi++) FX.ember([d.pos[0], d.pos[1] + 0.8, d.pos[2]], col);
      FX.smoke([d.pos[0], d.pos[1] + 0.6, d.pos[2]], [0.35, 0.28, 0.5], 12, 1.6);
      FX.shockRing([d.pos[0], d.pos[1] + 0.2, d.pos[2]], col, 9, 0.6);
      FX.hit(1.5, { stop: 0.09, flash: 0.13, flashColor: col });
      AUDIO.play('death_big', { pan: panOf(d.pos) });
      AUDIO.duck(0.45, 1.1);
    } else {
      AUDIO.play('death', { pan: panOf(d.pos) });
      FX.hit(0.16);
    }

    /* SPLIT: a broodmother becomes three gnawlings at the same point on the
       path, fanned slightly so they do not overlap into one silhouette. */
    if (d.def.trait === 'split' && d.def.split) {
      for (var i = 0; i < d.def.split.count; i++) {
        var c = spawnDenizen(d.def.split.into, { dist: Math.max(0, d.dist - i * 1.4) });
        if (c) { c.hp = c.maxHp * 0.8; c.flash = 0.4; }
      }
    }
  }

  function leak(d) {
    d.alive = false;
    d.dying = 0.01;
    G.leaked++;
    var cost = d.def.boss ? 5 : 1;
    G.lives -= cost;
    FX.hit(1.1, { flash: 0.2 });
    AUDIO.play('lifeLost');
    if (G.lives <= 0) {
      G.lives = 0;
      endGame(false);
    }
  }

  function endGame(won) {
    if (G.status === 'won' || G.status === 'lost') return;
    G.status = won ? 'won' : 'lost';
    for (var i = 0; i < G.towers.length; i++) {
      if (G.towers[i].voice) { G.towers[i].voice.stop(); G.towers[i].voice = null; }
    }
    AUDIO.play(won ? 'victory' : 'defeat');
    AUDIO.setIntensity(0);
  }

  /* Pan a world position to -1..1 by its screen X, so the mix follows the
     camera rather than the world axes. Falls back to centre before the first
     frame has established a projection. */
  function panOf(pos) {
    var p = R.project(pos);
    if (!p) return 0;
    var w = R.W / (R.quality.scale || 1);
    return U.clamp((p.x / (w || 1)) * 2 - 1, -1, 1) * 0.7;
  }

  /* ---------- waves ---------- */

  function startWave() {
    if (G.waveActive || G.status !== 'play') return false;
    G.wave++;
    if (G.wave > DATA.WAVES.length) { endGame(true); return false; }
    var w = DATA.WAVES[G.wave - 1];
    G.waveActive = true;
    G.spawnQueue.length = 0;
    for (var i = 0; i < w.groups.length; i++) {
      var g = w.groups[i];
      for (var k = 0; k < g.count; k++) {
        G.spawnQueue.push({ of: g.of, at: (g.delay || 0) + k * g.gap });
      }
    }
    G.spawnQueue.sort(function (a, b) { return a.at - b.at; });
    G.waveTimer = 0;
    for (var t = 0; t < G.towers.length; t++) G.towers[t].wavesSurvived++;
    AUDIO.play('waveStart');
    if (w.boss) { AUDIO.play('bossSpawn'); AUDIO.duck(0.5, 2.2); }
    return true;
  }

  function endWave() {
    G.waveActive = false;
    var w = DATA.WAVES[G.wave - 1];
    var bonus = Math.round((w ? w.bonus : 40) * G.difficulty.gold);
    /* Vault income pays here rather than continuously, so the player can see
       exactly what the economy tower bought them. */
    var income = 0;
    for (var i = 0; i < G.towers.length; i++) {
      var t = G.towers[i];
      if (DATA.TOWERS[t.id].kind === 'support') income += Math.round(stats(t).income);
    }
    G.gold += bonus + income;
    G.goldEarned += bonus + income;
    G.waveTimer = 0;
    if (G.wave >= DATA.WAVES.length) { endGame(true); return { bonus: bonus, income: income }; }
    return { bonus: bonus, income: income };
  }

  /* ---------- targeting ---------- */

  function inRange(t, d, s) {
    if (!d.alive || d.dying > 0) return false;
    var def = DATA.TOWERS[t.id];
    if (d.flying && !def.air) return false;
    /* A launched ground unit counts as airborne, which is the entire point of
       CYCLONE: it converts a ground wave into an anti-air problem. */
    if (d.airborne > 0 && !def.air) return false;
    var dx = d.pos[0] - t.pos[0], dz = d.pos[2] - t.pos[2];
    var d2 = dx * dx + dz * dz;
    if (d2 > s.range * s.range) return false;
    if (s.minRange > 0 && d2 < s.minRange * s.minRange) return false;
    return true;
  }

  /* Highest progress along the path wins, which is the standard and correct
     default: the leader is the one about to leak. */
  function pickTarget(t, s) {
    var best = null, bestDist = -1;
    for (var i = 0; i < G.denizens.length; i++) {
      var d = G.denizens[i];
      if (!inRange(t, d, s)) continue;
      if (d.dist > bestDist) { bestDist = d.dist; best = d; }
    }
    return best;
  }

  /* ---------- projectiles ---------- */

  function fireProjectile(t, s, from, target, def) {
    var p = {
      uid: G.nextId++,
      pos: [from[0], from[1], from[2]],
      start: [from[0], from[1], from[2]],
      target: target,
      lastKnown: [target.pos[0], target.pos[1] + 0.8 * target.scale, target.pos[2]],
      speed: s.projSpeed,
      dmg: s.dps / Math.max(0.001, s.fireRate),
      splash: s.splash,
      element: def.element,
      source: t,
      kind: def.kind,
      arc: !!def.arc,
      t: 0, life: 4.0,
      execute: s.execute,
      launch: s.launch,
      slow: s.slow, burn: s.burn, poison: s.poison,
      airBonus: s.airBonus,
      spin: Math.random() * 6
    };
    G.projs.push(p);
    return p;
  }

  function updateProjectiles(dt) {
    var w = 0;
    for (var i = 0; i < G.projs.length; i++) {
      var p = G.projs[i];
      p.t += dt;
      p.life -= dt;

      /* RE-ACQUIRE ON THE WAY IN. Aiming at where the target was when the shot
         left the barrel means every shot at a moving target misses, and with
         several towers converging on one runner they all miss together. The
         projectile tracks its target while the target lives, and falls back to
         its last known position once it does not. */
      var aim = p.lastKnown;
      if (p.target && p.target.alive && p.target.dying <= 0) {
        aim = [p.target.pos[0], p.target.pos[1] + 0.8 * p.target.scale, p.target.pos[2]];
        p.lastKnown = aim;
      }

      var to = V.sub(aim, p.pos);
      var dist = V.len(to);
      var step = p.speed * dt;

      if (dist <= step || p.life <= 0) {
        detonate(p, aim);
        continue;
      }
      var dir = V.scale(to, 1 / dist);
      p.pos[0] += dir[0] * step;
      p.pos[1] += dir[1] * step;
      p.pos[2] += dir[2] * step;
