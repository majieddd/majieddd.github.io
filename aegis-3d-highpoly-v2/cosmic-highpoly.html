<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmic Conquest: HIGHPOLY v2</title>
<meta name="description" content="A high fidelity 3D tower defence set in the Cosmic Conquest universe, painted in the Neon Reliquary style with amplified FX, fluid motion and modern UI. Zero dependencies, one file, WebGL2.">
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* RELIQUARY :: interface
   Dials for this work, per the pre-flight gates:
     DESIGN_VARIANCE 7   a game HUD should be memorable, not a settings dialog
     MOTION_INTENSITY 6   a game earns motion, but controls used every few
                          seconds stay snappy and some get none at all
     VISUAL_DENSITY 6     gold, lives, wave, cooldowns and fourteen towers have
                          to coexist without a scroll

   ACCENT POLICY (gate G3). ONE accent: --accent, which is set from the chosen
   faction at runtime, so a Federation run is gold throughout and a Humanity
   run is cyan throughout. Exactly one second hue exists, --danger, and it has
   a single named semantic job: cannot afford, or about to lose. It never
   appears decoratively.

   GROUND POLICY (gate G5). No #000 and no #fff anywhere. Every surface is
   tinted toward --void, the same hued near-black the renderer paints its
   shadows with, so the interface and the picture share one darkness. */

:root {
  /* Set from the faction palette at runtime by UI.applyPalette. These are the
     Humanity defaults so the page is never unstyled during boot. */
  --accent: #38e8ff;
  --accent-2: #7dd3fc;
  --accent-dim: rgba(56, 232, 255, 0.18);
  --accent-glow: rgba(56, 232, 255, 0.42);

  --danger: #ff5470;
  --gold: #fbbf24;

  --void: #0a0e17;
  --ground: #0d1220;
  --panel: rgba(17, 22, 38, 0.82);
  --panel-solid: #131828;
  --raised: rgba(30, 38, 62, 0.9);
  --line: rgba(140, 160, 210, 0.16);
  --line-strong: rgba(150, 175, 230, 0.32);

  /* Text tiers. Measured against --panel for AA: #e8ecf8 on rgba(17,22,38,.82)
     over the dark canvas gives well above 4.5:1, and --text-dim stays above
     4.5:1 as well. --text-faint is used only at 14px+ and only for
     non-essential labels. */
  --text: #e8ecf8;
  --text-dim: #a8b4d0;
  --text-faint: #8492b0;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;

  --shadow: 0 10px 34px rgba(4, 6, 14, 0.62);
  --shadow-lg: 0 22px 64px rgba(4, 6, 14, 0.74);

  /* Motion. Every duration is under 300ms per the motion law, and every curve
     is ease-out or a spring-ish custom: never ease-in on interface motion. */
  --t-fast: 110ms;
  --t-base: 180ms;
  --t-slow: 260ms;
  --e-out: cubic-bezier(0.22, 0.9, 0.28, 1);
  --e-back: cubic-bezier(0.34, 1.42, 0.44, 1);

  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

/* Buttons do NOT inherit color, font or background from their parent: the user
   agent gives them its own defaults, which are pure black or pure white text
   on a system grey. Every button-shaped control in this file therefore states
   its colour explicitly. Missing this on .ability and .card was caught by the
   measured no-pure-black-or-white gate rather than by reading the CSS, which
   is exactly why that gate measures computed style instead of grepping. */
button, input, select, textarea {
  color: var(--text);
  font-family: inherit;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--void);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#stage { position: fixed; inset: 0; }
#gl { display: block; width: 100%; height: 100%; }

/* The HUD layer never eats pointer events as a whole: only its own controls
   do. A full-screen overlay that swallows clicks is the single most common way
   a game HUD breaks the game under it. */
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
#hud > * { pointer-events: auto; }

/* ---------- shared primitives (kit rule: reach for these before inventing) */

.glass {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  backdrop-filter: blur(14px) saturate(1.25);
  -webkit-backdrop-filter: blur(14px) saturate(1.25);
  box-shadow: var(--shadow);
}

.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--raised);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 8px 14px;
  border-radius: var(--r-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: transform var(--t-fast) var(--e-out),
              background-color var(--t-fast) var(--e-out),
              border-color var(--t-fast) var(--e-out),
              opacity var(--t-fast) var(--e-out);
}
.btn:hover { background: rgba(52, 66, 104, 0.92); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: 0.42; cursor: not-allowed; }
.btn[disabled]:hover { background: var(--raised); border-color: var(--line-strong); }

.btn-primary {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
  border-color: transparent;
  color: #0a1018;
  font-weight: 700;
}
.btn-primary:hover { filter: brightness(1.1); background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: var(--r-sm);
  background: rgba(11, 15, 26, 0.72);
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }

/* Flavor text: mechanics lead, flavor follows in italic, visually demarcated
   (gate G12). */
.flavor {
  font-style: italic;
  color: var(--text-faint);
  font-size: 12.5px;
  line-height: 1.4;
  border-left: 2px solid var(--line);
  padding-left: 9px;
  margin-top: 7px;
}

/* ---------- top bar (gate G7: one line, under 80px) ---------- */

#topbar {
  margin: 12px 12px 0;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  flex-wrap: nowrap;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 62px;
  padding: 0 10px;
  border-right: 1px solid var(--line);
}
.stat:last-of-type { border-right: none; }
.stat .k {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  color: var(--text-faint);
  text-transform: uppercase;
  line-height: 1.2;
}
.stat .v {
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 700;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.stat .v.gold { color: var(--gold); }
.stat .v.lives { color: var(--accent); }
.stat .v.lives.low { color: var(--danger); }

/* The gold counter pops when it changes. Pure transform, so it composites. */
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
.v.bump { animation: pop 260ms var(--e-out); }

#wavebar {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(9, 12, 22, 0.8);
  overflow: hidden;
  min-width: 60px;
}
#wavefill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transform-origin: left center;
  transition: width var(--t-slow) var(--e-out);
}

.spacer { flex: 1; }

.iconbtn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  font-size: 15px;
  padding: 0;
}
.iconbtn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* ---------- commander abilities ---------- */

#abilities {
  position: absolute;
  left: 12px;
  bottom: 158px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ability {
  color: var(--text);
  width: 132px;
  padding: 9px 11px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform var(--t-fast) var(--e-out), border-color var(--t-fast) var(--e-out);
}
.ability:hover { transform: translateX(3px); border-color: var(--accent); }
.ability:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ability .key {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 12px; font-weight: 800;
  flex: none;
}
.ability .nm { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; }
.ability .cd { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); }
.ability .sweep {
  position: absolute; inset: 0;
  background: rgba(6, 9, 18, 0.78);
  transform-origin: bottom center;
  transform: scaleY(0);
  pointer-events: none;
}
.ability.ready .key { box-shadow: 0 0 0 0 var(--accent-glow); animation: readyPulse 2.4s ease-out infinite; }
@keyframes readyPulse {
  0% { box-shadow: 0 0 0 0 var(--accent-glow); }
  70% { box-shadow: 0 0 0 9px rgba(56, 232, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(56, 232, 255, 0); }
}

/* ---------- tower dock ---------- */

#dock {
  margin: 0 12px 12px;
  padding: 10px;
  display: flex;
  gap: 8px;
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
#dock::-webkit-scrollbar { height: 6px; }
#dock::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

.card {
  position: relative;
  flex: none;
  width: 92px;
  padding: 8px 8px 9px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: rgba(14, 19, 33, 0.86);
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
  transition: transform var(--t-fast) var(--e-out),
              border-color var(--t-fast) var(--e-out),
              background-color var(--t-fast) var(--e-out);
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.sel {
  border-color: var(--accent);
  background: var(--accent-dim);
  transform: translateY(-3px);
}
.card.poor { opacity: 0.44; }
.card.poor .cost { color: var(--danger); }

.card .hk {
  position: absolute;
  top: 5px; right: 6px;
  font-size: 9px;
  font-family: var(--mono);
  color: var(--text-faint);
}
.card .el {
  width: 100%;
  height: 3px;
  border-radius: 2px;
  margin-bottom: 7px;
}
.card .nm {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .rl {
  font-size: 9.5px;
  color: var(--text-faint);
  line-height: 1.25;
  height: 24px;
  overflow: hidden;
  margin-top: 2px;
}
.card .cost {
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--gold);
}

/* ---------- inspector ---------- */

#inspector {
  position: absolute;
  right: 12px;
  top: 80px;
  width: 262px;
  padding: 14px;
  transform: translateX(calc(100% + 20px));
  opacity: 0;
  transition: transform var(--t-slow) var(--e-out), opacity var(--t-base) var(--e-out);
}
#inspector.show { transform: translateX(0); opacity: 1; }

#inspector h3 {
  margin: 0;
  font-size: 15px;
  letter-spacing: 0.06em;
  font-weight: 800;
}
#inspector .sub {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-top: 2px;
}
.tiers { display: flex; gap: 4px; margin: 10px 0 4px; }
.tierpip {
  flex: 1; height: 4px; border-radius: 2px;
  background: rgba(120, 140, 190, 0.2);
}
.tierpip.on { background: var(--accent); }

.rows { margin: 10px 0; display: grid; gap: 5px; }
.row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px;
  gap: 10px;
}
.row .k { color: var(--text-dim); }
.row .v { font-family: var(--mono); font-weight: 600; }
.row .v.up { color: var(--accent); }

#inspector .acts { display: flex; gap: 6px; margin-top: 12px; }
#inspector .acts .btn { flex: 1; text-align: center; }

/* ---------- wave banner ---------- */

#banner {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translate(-50%, 0) scale(0.94);
  opacity: 0;
  text-align: center;
  pointer-events: none;
  transition: opacity var(--t-slow) var(--e-out), transform var(--t-slow) var(--e-back);
}
#banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#banner .big {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: 0.14em;
  line-height: 1;
  text-shadow: 0 0 34px var(--accent-glow), 0 4px 20px rgba(0, 0, 0, 0.8);
}
#banner .small {
  font-size: 13px;
  letter-spacing: 0.32em;
  color: var(--accent);
  margin-top: 8px;
  text-transform: uppercase;
}

/* ---------- floating combat text ---------- */

#floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float {
  position: absolute;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  transform: translate(-50%, -50%);
  text-shadow: 0 2px 6px rgba(4, 6, 14, 0.95);
  will-change: transform, opacity;
}
.float.reaction {
  font-family: var(--font);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.float.gold { color: var(--gold); }

/* Health bars. Only drawn for bodies that have taken damage, so a healthy
   wave shows the art and a hurt one shows the information. The fill is a
   scaleX transform rather than a width change: width animates on the layout
   thread and would cost a reflow per bar per frame. */
.hpbar {
  position: absolute;
  height: 4px;
  border-radius: 2px;
  background: rgba(6, 8, 16, 0.82);
  border: 1px solid rgba(150, 175, 230, 0.28);
  overflow: hidden;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.hpbar > i {
  display: block;
  height: 100%;
  width: 100%;
  transform-origin: left center;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
}
.hpbar.crit > i { background: linear-gradient(90deg, #ff8fa3, var(--danger)); }
.hpbar.boss {
  height: 7px;
  border-color: rgba(255, 120, 160, 0.55);
}
.hpbar.boss > i { background: linear-gradient(90deg, #ff2fd6, var(--danger)); }

/* ---------- screens (start, pause, end) ---------- */

.screen {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(120% 90% at 50% 0%, rgba(22, 12, 40, 0.86) 0%, rgba(6, 8, 16, 0.95) 70%);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-slow) var(--e-out);
}
.screen.show { opacity: 1; pointer-events: auto; }

.sheet {
  width: min(940px, 100%);
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 20px 30px 18px;
  border-radius: var(--r-lg);
  background: var(--panel-solid);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-lg);
}

.title {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 0.1em;
  line-height: 1.02;
  margin: 0;
}
.title .thin { font-weight: 300; color: var(--text-dim); }
.tagline {
  color: var(--text-dim);
  font-size: 13.5px;
  margin-top: 8px;
  max-width: 62ch;
}

.grouplabel {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin: 12px 0 7px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.grouplabel::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  flex: 1 1 168px;
  min-width: 148px;
  padding: 11px 13px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: rgba(20, 26, 44, 0.7);
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
  transition: transform var(--t-fast) var(--e-out),
              border-color var(--t-fast) var(--e-out),
              background-color var(--t-fast) var(--e-out);
}
.opt:hover { transform: translateY(-2px); border-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.sel { border-color: var(--accent); background: var(--accent-dim); }
.opt .on {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 7px;
}
.opt .od { font-size: 11px; color: var(--text-faint); margin-top: 3px; line-height: 1.35; }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.startrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.startrow .btn { font-size: 14px; padding: 11px 24px; }

.endstats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 10px;
  margin: 18px 0 4px;
}
.endstat {
  padding: 11px 13px;
  border-radius: var(--r-sm);
  background: rgba(20, 26, 44, 0.7);
  border: 1px solid var(--line);
}
.endstat .k {
  font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-faint);
}
.endstat .v {
  font-family: var(--mono); font-size: 21px; font-weight: 700; margin-top: 2px;
}

/* ---------- help and codex ---------- */

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: 16px; }
.keylist { display: grid; gap: 5px; margin-top: 6px; }
.keyrow { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
kbd {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(30, 38, 62, 0.9);
  border: 1px solid var(--line-strong);
  border-bottom-width: 2px;
  min-width: 22px;
  text-align: center;
}
.reactgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 7px; margin-top: 6px; }
.reactrow {
  padding: 8px 10px;
  border-radius: var(--r-sm);
  background: rgba(20, 26, 44, 0.62);
  border: 1px solid var(--line);
  font-size: 11.5px;
}
.reactrow .nm { font-weight: 700; letter-spacing: 0.05em; }
.reactrow .pair { color: var(--text-faint); font-size: 10.5px; margin-top: 2px; }

/* ---------- toast ---------- */

#toast {
  position: absolute;
  left: 50%;
  bottom: 156px;
  transform: translate(-50%, 8px);
  opacity: 0;
  padding: 8px 16px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  pointer-events: none;
  transition: opacity var(--t-base) var(--e-out), transform var(--t-base) var(--e-out);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- perf readout ---------- */

#perf {
  position: absolute;
  right: 12px;
  bottom: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-faint);
  padding: 5px 9px;
  border-radius: var(--r-sm);
  background: rgba(9, 12, 22, 0.62);
  border: 1px solid var(--line);
  pointer-events: none;
}
#perf.hidden { display: none; }

/* ---------- responsive ---------- */

@media (max-width: 980px) {
  #inspector { width: 232px; top: 74px; }
  #abilities { bottom: 150px; }
  .title { font-size: 30px; }
}

@media (max-width: 720px) {
  #topbar { height: 52px; gap: 6px; padding: 0 8px; margin: 8px 8px 0; }
  .stat { min-width: 52px; padding: 0 7px; }
  .stat .v { font-size: 16px; }
  #dock { margin: 0 8px 8px; padding: 8px; }
  .card { width: 80px; }
  #inspector { width: calc(100vw - 24px); right: 12px; top: auto; bottom: 150px; }
  #abilities { bottom: auto; top: 74px; left: 8px; flex-direction: row; }
  .ability { width: auto; }
  .ability .nm, .ability .cd { display: none; }
  #banner .big { font-size: 30px; }
  .sheet { padding: 20px 18px; }
}

/* ---------- reduced motion (gate G9) ----------
   Not "disable animation": remove the DECORATIVE motion and keep the
   functional state changes, which is what the preference actually asks for.
   The canvas itself keeps rendering, because a tower defence with a frozen
   board is not a game. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .card:hover, .opt:hover, .ability:hover { transform: none; }
  #banner { transition: opacity 0.001ms linear; }
}

</style>

/* RELIQUARY :: 01-gl

   with the failure modes made loud.

   the painterly look is a SHADING problem, not a scene-graph problem. Every
   interesting decision in this project lives in a fragment shader, so the
   engine layer only has to be good enough to bind buffers and manage render
   targets without lying about errors.

   THE LAW THIS FILE OBEYS: never swallow an error. A shader that fails to
   compile in a silent try/catch produces a black screen and no explanation,
   which is the single most expensive failure mode in graphics work. Every
   compile, link and framebuffer completeness check throws with the driver's

     has exactly one buffer to assert is empty, per the project law that an
     error buffer without a named reader is a place errors go to be ignored. */

       above 1.0 to have anywhere to live. When it is missing we fall back to
       RGBA8 targets and a tonemap that runs before the bright pass instead of
       after, which loses some glow range but still renders. Measured present
       on both this machine's real GPU and on the headless software rasteriser
       (ANGLE Microsoft Basic Render Driver), so the fallback is defensive
       rather than routine. */

/* RELIQUARY :: 02-mesh
   The mesh builder. This file is where the ART lives, not just the geometry.

   THE CENTRAL IDEA
   The style law for this universe (ART-BIBLE section 1, "Neon Reliquary") asks
   for figures built from flat interlocking shapes, drawing carried by heavy
   shadow masses, silhouette readable before detail. A low-poly mesh is already
   flat interlocking shapes: the job is to stop it reading as CAD output and
   start it reading as a palette knife.

   Three decisions do that, and they are the reason this is not just a box
   generator:

   1. NON-INDEXED, PER-FACE NORMALS. Every triangle carries its own normal, so
      lighting breaks hard at every edge. No smoothing groups, ever. This is
      the single biggest contributor to the look.

   2. HAND-HEWN JITTER. After a primitive is built its vertices are displaced
      by a small seeded amount and the normals recomputed. A perfect cylinder
      becomes a hewn column. The jitter is applied per UNIQUE POSITION, not per
      vertex, or shared corners split apart and the model develops cracks that
      the shadow pass then renders as light leaks.

   3. PER-FACET PAINT DATA. Each triangle gets a stable random seed in aux.x
      which the shader uses to nudge value and hue. Two adjacent facets of the
      same nominal colour land on slightly different steps of the posterise
      ramp, which is exactly what a knife does when it lays two strokes of the
      same paint.

     pos3, nrm3, col3, aux3   where aux = (facetSeed, toothWeight, emissive) */

  /* ---------- transform stack builder ---------- */

    var tris = [];               /* {p:[3][3], c:[3], tooth, emis} in local space */
    var stack = [];

    var col = [1, 0, 1];
    var tooth = 1.0;
    var emis = 0.0;

    var B = {};

    B.rnd = rnd;

    B.push = function () { stack.push(new Float32Array(M)); return B; };
    B.pop = function () {
      if (!stack.length) throw new Error('MESH.builder: pop with empty stack');
      M = stack.pop();
      return B;

       order they are written, which is what reads naturally when assembling a
       model top down. */
    function apply(T) { M = U.m4mul(M, T); }

    B.translate = function (x, y, z) { apply(U.m4trs(x, y, z, 0, 0, 0, 1, 1, 1)); return B; };
    B.rotateX = function (a) { apply(U.m4trs(0, 0, 0, a, 0, 0, 1, 1, 1)); return B; };
    B.rotateY = function (a) { apply(U.m4trs(0, 0, 0, 0, a, 0, 1, 1, 1)); return B; };
    B.rotateZ = function (a) { apply(U.m4trs(0, 0, 0, 0, 0, a, 1, 1, 1)); return B; };

         goes wrong is indexing a palette with a negative modulo, which in JS

         inside a colour conversion names neither the palette nor the caller.
         An explicit message costs one branch at mesh build time, which happens
         a few hundred times at boot and never again. */
      if (c === undefined || c === null) {
        throw new Error('MESH.color: got ' + c + '. A palette lookup probably ' +

      }

/* RELIQUARY :: 03-shaders
   Every GLSL source in the project. This is the file that decides what the
   game LOOKS like, so the reasoning is written down next to the code.

   THE PROBLEM
   Low-poly 3D defaults to a clean, cheerful, vector-art look: smooth ramps,
   pastel palettes, ambient occlusion, soft shadows. That is the opposite of
   this universe. The ART-BIBLE style law asks for a painted cutscene
   illustration: flat interlocking shapes, the drawing carried by heavy shadow
   masses, hard cel edges, spot blacks, screen-print grain, and colour that is
   faction identity before it is anything else.

   1. WRAP-LIT, THEN POSTERISED. Lighting is wrapped (n dot l remapped to 0..1
      rather than clamped) so the terminator is wide, then quantised to a small
      number of hard bands. Wrapping first is what gives the big readable
      shadow mass; quantising second is what gives the cel edge.

      random seed. That seed nudges where the band boundary falls for that
      facet alone, so two coplanar-ish facets of the same paint land on
      different steps. This is the single trick that makes the result read as
      knife strokes instead of as a shaded polyhedron, and it costs one add.

      a saturated void-violet, not toward zero. The plates in this universe
      have purple and magenta living inside their blacks, and a neutral shadow
      instantly reads as generic 3D.

      the background, which the style law demands happen before detail is read.

      glossy; this is the catch-light on the ridge of a knife stroke, and it
      is why the surfaces read as wet rather than as matte cardboard.

    '  p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }',
    'float vnoise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x),',
    '             mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y);',
    '}',
    'float fbm(vec2 p){',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++){ v += a * vnoise(p); p *= 2.03; a *= 0.5; }',
    '  return v;',
    '}'
  ].join('\n');

  /* The posterised ramp, shared by the mesh pass and by anything that needs to
     match it (the tower preview thumbnails, the shatter facets). Extracted so
     there is exactly ONE definition of what this game's light looks like: two
     copies would drift apart the first time the art direction was tuned. */
  var RAMP = [
    'uniform float uBands;',
    'uniform float uRampGamma;',
    'uniform float uFacetJitter;',
    'uniform float uWash;',
    'uniform vec3  uShadowColor;',
    'uniform vec3  uLightColor;',
    'uniform float uShadowLift;',
    '',
    'float posterise(float ndl, float seed){',
    /* Wrap lighting: remap -1..1 to 0..1 rather than clamping at zero. The
       back of a form keeps a readable value instead of going flat black, and
       the terminator becomes a wide band that the quantiser can carve up. */
    '  float t = ndl * 0.5 + 0.5;',
    '  t = pow(clamp(t, 0.0, 1.0), uRampGamma);',
    /* The per-facet band offset. Centred on zero so the mean brightness of a
       surface is unchanged and only its internal break-up varies. */
    '  t += (seed - 0.5) * uFacetJitter;',
    '  t = clamp(t, 0.0, 0.9999);',
    '  return floor(t * uBands) / max(1.0, uBands - 1.0);',
    '}',
    '',
    'vec3 rampColor(float q, vec3 albedo){',
    /* Three stops, sampled by the already-quantised t, so the mixes never
       produce a gradient: they only choose which of a few discrete colours
       this facet is painted with.

       THE LIT STOP KEEPS ALBEDO DOMINANT (mix 0.18, not the 0.28 an earlier
       pass used). Pushing the lit band hard toward the light colour makes
       every surface converge on the same off-white in its highlights, which
       throws away exactly the thing the style law puts first: a scene has to
       read as its faction in the first half second. A cyan tower and a gold
       tower whose lit faces are both near-white do not.

       The deep stop is nearly pure hued shadow (shadowLift 0.24), which is
       what "the drawing is carried by heavy shadow masses" means in a
       shader. */
    /* THE LIT STOP STAYS NEAR THE ALBEDO. At mix 0.18 and a 1.30 multiplier
       the lit band landed around 0.48 luminance for a 0.13 albedo: a dark
       violet ground rendered as pale lavender, because the ramp was doing the
       job of a light source instead of the job of a palette. The reference
       plates are dark AND saturated at the same time, which is only possible
       if the lit band is the albedo's own colour with a little light in it,
       not a march toward white. */
    '  vec3 deep = mix(uShadowColor, albedo * 0.22, uShadowLift);',
    '  vec3 mid  = albedo * 0.62;',
    '  vec3 lite = mix(albedo, uLightColor, 0.11) * 1.07;',
    '  return q < 0.5 ? mix(deep, mid, q * 2.0) : mix(mid, lite, (q - 0.5) * 2.0);',
    '}'
  ].join('\n');

  /* ---------- main mesh pass ---------- */

  var MESH_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNrm;',
    'layout(location=2) in vec3 aCol;',
    'layout(location=3) in vec3 aAux;',
    '',
    'uniform mat4 uProj, uView, uModel, uLightVP;',
    'uniform mat3 uNormalMat;',
    'uniform vec3 uTint;',
    'uniform float uTintMix;',
    /* Dissolve drives both the spawn-in and the death burn. Kept in the vertex
       stage as well as the fragment stage because the facet also PUSHES along
       its normal as it burns, which is what makes a unit come apart into
       strokes rather than simply fade. */
    'uniform float uDissolve;',
    'uniform float uExplode;',
    '',
    'out vec3 vWorld;',
    'out vec3 vView;',
    'flat out vec3 vNormal;',
    'flat out vec3 vAlbedo;',
    'flat out float vSeed;',
    'flat out float vTooth;',
    'flat out float vEmis;',
    'out vec4 vShadowCoord;',
    '',
    'void main(){',
    '  vec3 nrm = normalize(uNormalMat * aNrm);',
    '  vec3 pos = aPos + aNrm * uExplode;',
    '  vec4 world = uModel * vec4(pos, 1.0);',
    '  vWorld = world.xyz;',
    '  vNormal = nrm;',
    '  vAlbedo = mix(aCol, uTint, uTintMix);',
    '  vSeed = aAux.x;',
    '  vTooth = aAux.y;',
    '  vEmis = aAux.z;',
    '  vShadowCoord = uLightVP * world;',
    '  vec4 vp = uView * world;',
    '  vView = vp.xyz;',
    '  gl_Position = uProj * vp;',
    '}'
  ].join('\n');

  var MESH_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DShadow;',
    '',
    'in vec3 vWorld;',
    'in vec3 vView;',
    'flat in vec3 vNormal;',
    'flat in vec3 vAlbedo;',
    'flat in float vSeed;',
    'flat in float vTooth;',
    'flat in float vEmis;',
    'in vec4 vShadowCoord;',
    '',
    'layout(location=0) out vec4 oColor;',
    'layout(location=1) out vec4 oNormal;',
    '',
    'uniform vec3 uLightDir;',
    'uniform vec3 uCamPos;',
    'uniform vec3 uRimColor;',
    'uniform float uRimStrength;',
    'uniform float uRimPower;',
    'uniform vec3 uAmbientSky;',
    'uniform vec3 uAmbientGround;',
    'uniform float uAmbient;',
    'uniform float uSpecStrength;',
    'uniform float uSpecPower;',
    'uniform sampler2DShadow uShadow;',
    'uniform float uShadowTexel;',
    'uniform float uShadowStrength;',
    'uniform sampler2D uTooth;',
    'uniform float uToothScale;',
    'uniform float uToothStrength;',
    'uniform float uTime;',
    'uniform float uFlash;',
    'uniform vec3 uFlashColor;',
    'uniform float uDissolve;',
    'uniform vec3 uDissolveColor;',
    'uniform float uFogDensity;',
    'uniform vec3 uFogColor;',
    'uniform float uAlpha;',
    'uniform float uDebugMode;',
    '',
    NOISE,
    RAMP,
    '',
    /* Five-tap PCF in a plus pattern. The hardware comparison sampler already
       gives bilinear filtering inside each tap, so five taps buys a soft edge
       that looks like about twenty. A wider kernel is wasted here because the
       shadow is going to be posterised into the ramp anyway. */
    'float shadowVis(){',
    '  vec3 pc = vShadowCoord.xyz / vShadowCoord.w;',
    '  pc = pc * 0.5 + 0.5;',
    '  if (pc.z > 1.0 || pc.x < 0.0 || pc.x > 1.0 || pc.y < 0.0 || pc.y > 1.0) return 1.0;',
    /* Slope-scaled bias. A constant bias either peters out into acne on
       surfaces facing the light edge-on, or detaches contact shadows on
       surfaces facing it square. */
    '  float ndl = max(dot(vNormal, uLightDir), 0.0);',
    '  float bias = mix(0.0035, 0.0006, ndl);',
    '  float z = pc.z - bias;',
    '  float s = texture(uShadow, vec3(pc.xy, z));',
    '  s += texture(uShadow, vec3(pc.xy + vec2( uShadowTexel, 0.0), z));',
    '  s += texture(uShadow, vec3(pc.xy + vec2(-uShadowTexel, 0.0), z));',
    '  s += texture(uShadow, vec3(pc.xy + vec2(0.0,  uShadowTexel), z));',
    '  s += texture(uShadow, vec3(pc.xy + vec2(0.0, -uShadowTexel), z));',
    '  return s * 0.2;',
    '}',
    '',
    /* Triplanar so the tooth follows the surface without any UVs, which the
       procedural meshes do not have and would be a lot of code to give them.
       The blend weights are raised to a power so the seams between the three
       projections are narrow. */
    'float toothSample(vec3 p, vec3 n){',
    '  vec3 w = pow(abs(n), vec3(4.0));',
    '  w /= max(w.x + w.y + w.z, 1e-4);',
    '  float x = texture(uTooth, p.zy * uToothScale).r;',
    '  float y = texture(uTooth, p.xz * uToothScale).r;',
    '  float z = texture(uTooth, p.xy * uToothScale).r;',
    '  return x * w.x + y * w.y + z * w.z;',
    '}',
    '',
    'void main(){',
    '  vec3 N = normalize(vNormal);',
    '  vec3 Vd = normalize(uCamPos - vWorld);',
    '  vec3 L = normalize(uLightDir);',
    '',
    /* DISSOLVE. A noise threshold over world position. Facets vanish in a
       ragged front with a hot emissive edge, which is the death effect and
       also (played backwards) the build-in effect.
       Computed ONCE and reused below for the burn edge: an earlier draft
       evaluated this same fbm twice per fragment, which is four octaves of
       noise paid for and thrown away on every lit pixel in the scene. */
    '  float dNoise = 0.0;',
    '  if (uDissolve > 0.0){',
    '    dNoise = fbm(vWorld.xz * 3.1 + vWorld.y * 2.0) * 0.7 + vSeed * 0.3;',
    '    if (dNoise < uDissolve) discard;',
    '  }',
    '',
    '  float ndl = dot(N, L);',
    '  float sh = mix(1.0, shadowVis(), uShadowStrength);',
    /* The shadow is folded into the lighting term BEFORE quantising, so a
       shadowed facet steps down a whole band rather than being darkened
       smoothly. That keeps the cel edge intact inside shadows, which is where
       most cel-shaded renderers give themselves away. */
    'float lit = posterise(ndl * mix(0.18, 1.0, sh), vSeed);',
    'vec3 col = rampColor(lit, vAlbedo);',
    '',
    /* Hemispheric ambient. Sky colour from above, bounce colour from below.
       Cheap, and it is what stops the unlit side reading as a hole rather
       than as a shadow. Kept deliberately low (uAmbient defaults to 0.20):
       ambient is the enemy of a heavy shadow mass, and every point of it
       spent here is contrast taken out of the picture. */
    '  float hemi = N.y * 0.5 + 0.5;',
    '  col += vAlbedo * mix(uAmbientGround, uAmbientSky, hemi) * uAmbient;',
    '',
    /* Paint tooth. Modulates value only, never hue, so it reads as the canvas
       under the paint rather than as dirt on top of it. */
    '  float tooth = toothSample(vWorld, N);',
    '  col *= 1.0 + (tooth - 0.5) * uToothStrength * vTooth;',
    '',
    /* The wet specular. Posterised to two steps: either the knife ridge
       catches the light or it does not. A smooth lobe here would drag the
       whole image back toward conventional 3D. */
    '  vec3 H = normalize(L + Vd);',
    '  float spec = pow(max(dot(N, H), 0.0), uSpecPower);',
    '  spec = step(0.35, spec) * (0.55 + 0.45 * step(0.75, spec));',
    '  col += uLightColor * spec * uSpecStrength * sh;',
    '',
    /* WATERCOLOUR WASH. A soft world-space cool/warm pooling that shifts
       neighbouring facets a whisper of temperature the way a wet wash does,
       keeping the palette-knife structure while moving the whole read toward
       watercolour rather than flat poster paint. Deliberately tiny. */
    '  float washN = fbm(vWorld.xz * 0.9 + vec2(0.0, vWorld.y * 0.6)) * 0.5 + 0.5;',
    '  vec3 washTint = vec3(0.97, 1.0, 1.03) + vAlbedo * 0.05;',
    '  col = mix(col, col * washTint, washN * uWash);',
    '',
    /* Rim. Biased toward the light side so it reads as light wrapping around
       the form, not as a uniform outline glow. */
    '  float fres = pow(1.0 - clamp(dot(N, Vd), 0.0, 1.0), uRimPower);',
    '  float rimSide = clamp(dot(N, L) * 0.5 + 0.65, 0.0, 1.0);',
    '  col += uRimColor * fres * rimSide * uRimStrength;',
    '',
    /* Emissive facets bypass the ramp entirely. */
    '  col = mix(col, vAlbedo * 1.9 + uRimColor * 0.35, vEmis);',
    '',
    /* Damage flash and the dissolve burn edge. */
    '  col = mix(col, uFlashColor, uFlash);',
    '  if (uDissolve > 0.0){',
    '    float edge = 1.0 - smoothstep(uDissolve, uDissolve + 0.16, dNoise);',
    '    col += uDissolveColor * edge * 0.85;',
    '  }',
    '',
    /* Height and distance fog, tinted to the sky so distant scenery sinks
       into the backdrop the way it does in the painted plates. */
    '  float depth = length(vView);',
    '  float fog = 1.0 - exp(-depth * uFogDensity);',
    '  fog *= clamp(1.0 - vWorld.y * 0.03, 0.0, 1.0);',
    '  col = mix(col, uFogColor, clamp(fog, 0.0, 0.85));',
    '',
    /* DEBUG CHANNELS. Kept in the shipping shader on purpose: the ground once
       rendered seven times darker than the arithmetic said it should, and no
       amount of bisecting the POST chain could find it because the divergence
       was upstream. Being able to display the albedo, the band and the ramp
       output directly is what turns that from an argument into a measurement.
       uDebugMode is 0 in every normal frame and the branch is uniform, so it
       costs nothing real. */
    '  if (uDebugMode > 0.5){',
    '    if (uDebugMode < 1.5)      { oColor = vec4(vAlbedo, 1.0); }',
    '    else if (uDebugMode < 2.5) { oColor = vec4(vec3(lit), 1.0); }',
    '    else if (uDebugMode < 3.5) { oColor = vec4(rampColor(lit, vAlbedo), 1.0); }',
    '    else if (uDebugMode < 4.5) { oColor = vec4(vec3(ndl * 0.5 + 0.5), 1.0); }',
    '    else if (uDebugMode < 5.5) { oColor = vec4(vec3(sh), 1.0); }',
    '    else                       { oColor = vec4(N * 0.5 + 0.5, 1.0); }',
    '    oNormal = vec4(N * 0.5 + 0.5, depth);',
    '    return;',
    '  }',
    '  oColor = vec4(col, uAlpha);',
    /* Attachment 1 carries the surface normal and the linear view depth for
       the ink pass. WORLD space normals are correct here even though the edge
       detection is done in screen space: Sobel compares a normal against its
       neighbours, and a difference between two normals is equally visible in
       any single consistent space. Converting to view space would cost a
       matrix multiply per fragment and change nothing on screen.
       Packed to 0..1 because this target falls back to RGBA8 on drivers with
       no float render target support. */
    '  oNormal = vec4(N * 0.5 + 0.5, depth);',
    '}'
  ].join('\n');

  /* ---------- shadow depth pass ---------- */

  var SHADOW_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNrm;',
    'uniform mat4 uLightVP, uModel;',
    'uniform float uExplode;',
    'void main(){',
    '  vec3 pos = aPos + aNrm * uExplode;',
    '  gl_Position = uLightVP * uModel * vec4(pos, 1.0);',
    '}'
  ].join('\n');

  var SHADOW_FS = [
    '#version 300 es',
    'precision highp float;',
    'void main(){}'
  ].join('\n');

  /* ---------- sky ----------
     Not a cubemap and not a gradient quad: a full-screen shader that paints a
     nebula in the faction palette with the same posterised logic as the
     meshes, so the background belongs to the same picture as the foreground.
     This is where most stylised 3D falls down, with a beautifully shaded
     subject sitting in front of a smooth gradient that gives the whole thing
     away as computer graphics. */
  var SKY_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec2 aPos;',
    'out vec2 vUV;',
    'void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 1.0, 1.0); }'
  ].join('\n');

  var SKY_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'layout(location=0) out vec4 oColor;',
    'layout(location=1) out vec4 oNormal;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform vec3 uSkyTop, uSkyBottom, uNebulaA, uNebulaB;',
    'uniform float uStarDensity;',
    'uniform mat4 uInvViewProj;',
    'uniform vec3 uCamPos;',
    NOISE,
    'void main(){',
    '  vec2 uv = vUV;',
    '  float aspect = uRes.x / max(uRes.y, 1.0);',
    /* Reconstruct a world ray so the sky parallaxes correctly when the camera
       orbits. A screen-space-only sky slides with the camera and instantly
       reads as a painted backdrop on a stage flat. */
    '  vec4 ndc = vec4(uv * 2.0 - 1.0, 1.0, 1.0);',
    '  vec4 wp = uInvViewProj * ndc;',
    '  vec3 dir = normalize(wp.xyz / max(wp.w, 1e-6) - uCamPos);',
    '',
    '  float h = dir.y * 0.5 + 0.5;',
    '  vec3 col = mix(uSkyBottom, uSkyTop, pow(clamp(h, 0.0, 1.0), 0.72));',
    '',
    /* Two nebula layers at different scales, each posterised into a handful of
       steps so they read as laid-in shapes rather than as airbrush. */
    '  vec2 np = dir.xz / max(abs(dir.y) + 0.35, 0.2);',
    '  float n1 = fbm(np * 0.75 + uTime * 0.004);',
    '  float n2 = fbm(np * 1.9 - uTime * 0.007 + 21.3);',
    '  float b1 = floor(clamp(n1 * 1.35, 0.0, 0.999) * 5.0) / 4.0;',
    '  float b2 = floor(clamp(n2 * 1.15, 0.0, 0.999) * 4.0) / 3.0;',
    '  col = mix(col, uNebulaA, b1 * 0.55 * smoothstep(-0.15, 0.5, dir.y));',
    '  col = mix(col, uNebulaB, b2 * 0.34 * smoothstep(-0.05, 0.7, dir.y));',
    '',
    /* Stars on a hashed lattice, with a size and brightness spread so the
       field has structure instead of reading as uniform noise. */
    '  vec2 sp = dir.xz / max(abs(dir.y) + 0.25, 0.15) * 26.0;',
    '  vec2 sc = floor(sp);',
    '  vec2 sf = fract(sp);',
    '  float sh = hash12(sc);',
    '  if (sh > 1.0 - uStarDensity){',
    '    vec2 off = hash22(sc + 3.7) * 0.6 + 0.2;',
    '    float d = length(sf - off);',
    '    float mag = hash11(sh * 71.3);',
    '    float star = smoothstep(0.10 + mag * 0.06, 0.0, d);',
    '    col += vec3(0.85, 0.92, 1.0) * star * (0.35 + mag * 0.9) * smoothstep(-0.1, 0.35, dir.y);',
    '  }',
    '',
    /* A single large body low on the horizon. Every plate in this universe has
       one, and it gives the eye a scale reference the star field cannot. */
    '  vec3 planetDir = normalize(vec3(0.55, 0.16, -0.82));',
    '  float pd = dot(dir, planetDir);',
    '  float disc = smoothstep(0.9955, 0.9972, pd);',
    '  if (disc > 0.0){',
    '    vec3 pn = normalize(dir - planetDir * 0.995);',
    '    float term = clamp(dot(pn, normalize(vec3(-0.6, 0.5, 0.3))) * 0.5 + 0.5, 0.0, 1.0);',
    '    float band = floor(term * 4.0) / 3.0;',
    '    vec3 pc = mix(uNebulaA * 0.35, uNebulaB * 1.25, band);',
    '    pc = mix(pc, vec3(0.02, 0.01, 0.05), 1.0 - band);',
    '    col = mix(col, pc, disc);',
    '  }',
    '',
    '  oColor = vec4(col, 1.0);',
    /* The sky must write a normal and a huge depth so the ink pass does not
       find an edge between sky pixels, and DOES find one at the horizon of
       every solid object. */
    '  oNormal = vec4(0.5, 0.5, 0.5, 1e5);',
    '}'
  ].join('\n');

  /* ---------- ink outline ----------
     Sobel over the packed normal and linear depth. Depth alone misses the
     interior creases that make a silhouette legible; normals alone find every
     facet edge and turn the model into a wireframe. The two thresholds
     together give the spot-black ink the style law asks for. */
  var POST_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec2 aPos;',
    'out vec2 vUV;',
    'void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  var INK_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'out vec4 oColor;',
    'uniform sampler2D uColor;',
    'uniform sampler2D uNormalDepth;',
    'uniform vec2 uTexel;',
    'uniform float uDepthThreshold;',
    'uniform float uNormalThreshold;',
    'uniform vec3 uInkColor;',
    'uniform float uInkStrength;',
    'uniform float uThickness;',
    '',
    'void main(){',
    '  vec3 base = texture(uColor, vUV).rgb;',
    '  vec2 t = uTexel * uThickness;',
    '',
    '  vec4 c  = texture(uNormalDepth, vUV);',
    '  vec4 l  = texture(uNormalDepth, vUV - vec2(t.x, 0.0));',
    '  vec4 r  = texture(uNormalDepth, vUV + vec2(t.x, 0.0));',
    '  vec4 u  = texture(uNormalDepth, vUV + vec2(0.0, t.y));',
    '  vec4 d  = texture(uNormalDepth, vUV - vec2(0.0, t.y));',
    '',
    /* Depth edge, scaled by the centre depth. Without the scale, a fixed
       threshold produces heavy outlines up close and none in the distance. */
    '  float dc = c.a;',
    '  float dd = (abs(l.a - dc) + abs(r.a - dc) + abs(u.a - dc) + abs(d.a - dc));',
    '  float depthEdge = step(uDepthThreshold * max(dc, 1.0) * 0.06, dd);',
    '',
    /* Normal edge. Sum of angular differences from the centre normal. */
    '  vec3 nc = c.rgb * 2.0 - 1.0;',
    '  float nd = 0.0;',
    '  nd += 1.0 - dot(nc, l.rgb * 2.0 - 1.0);',
    '  nd += 1.0 - dot(nc, r.rgb * 2.0 - 1.0);',
    '  nd += 1.0 - dot(nc, u.rgb * 2.0 - 1.0);',
    '  nd += 1.0 - dot(nc, d.rgb * 2.0 - 1.0);',
    /* Creases fade with distance, silhouettes do not. Without this the whole
       far half of the board turns into a mesh of ink lines as facets get
       smaller than a pixel. */
    '  float fade = clamp(1.0 - (dc - 18.0) / 55.0, 0.15, 1.0);',
    '  float normalEdge = step(uNormalThreshold, nd) * fade;',
    '',
    '  float edge = clamp(max(depthEdge, normalEdge), 0.0, 1.0) * uInkStrength;',
    /* Ink DARKENS rather than replaces: min() against the ink colour. A bright
       emissive surface therefore keeps its glow and only gains a dark seam,
       which is how ink sits over paint. Replacing outright (the usual
       mix-to-black) puts flat black holes through every glowing edge in the
       scene, and this game is mostly glowing edges. */
    '  vec3 col = mix(base, min(base, uInkColor), edge);',
    '  oColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* ---------- bloom ---------- */

  var BRIGHT_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'out vec4 oColor;',
    'uniform sampler2D uColor;',
    'uniform float uThreshold;',
    'uniform float uSoftKnee;',
    'void main(){',
    '  vec3 c = texture(uColor, vUV).rgb;',
    '  float br = max(c.r, max(c.g, c.b));',
    /* Soft knee so a surface hovering at the threshold does not pop in and out
       between frames as the camera moves. */
    '  float knee = uThreshold * uSoftKnee + 1e-5;',
    '  float soft = clamp(br - uThreshold + knee, 0.0, 2.0 * knee);',
    '  soft = soft * soft / (4.0 * knee + 1e-5);',
    '  float contrib = max(soft, br - uThreshold) / max(br, 1e-5);',
    '  oColor = vec4(c * contrib, 1.0);',
    '}'
  ].join('\n');

  /* Separable 9-tap Gaussian, run at half resolution over several mip levels.
     Cheaper and wider than one big kernel at full res. */
  var BLUR_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'out vec4 oColor;',
    'uniform sampler2D uColor;',
    'uniform vec2 uDir;',
    'void main(){',
    '  vec3 sum = texture(uColor, vUV).rgb * 0.227027;',
    '  vec2 o1 = uDir * 1.3846153846;',
    '  vec2 o2 = uDir * 3.2307692308;',
    '  sum += (texture(uColor, vUV + o1).rgb + texture(uColor, vUV - o1).rgb) * 0.3162162162;',
    '  sum += (texture(uColor, vUV + o2).rgb + texture(uColor, vUV - o2).rgb) * 0.0702702703;',
    '  oColor = vec4(sum, 1.0);',
    '}'
  ].join('\n');

  /* ---------- final composite ----------
     Tonemap, grade, then the print-shop layer: halftone that only bites in the
     shadows, canvas weave in screen space, grain, chromatic aberration and a
     vignette. Screen space is the important part for the canvas: it must feel
     like the whole image was painted on one surface, which means it does NOT
     move with the camera. */
  var COMPOSITE_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'out vec4 oColor;',
    'uniform sampler2D uColor;',
    'uniform sampler2D uBloom;',
    'uniform sampler2D uTooth;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform float uBloomStrength;',
    'uniform float uExposure;',
    'uniform float uSaturation;',
    'uniform float uContrast;',
    'uniform vec3 uLift, uGain;',
    'uniform float uVignette;',
    'uniform float uGrain;',
    'uniform float uHalftone;',
    'uniform float uCanvas;',
    'uniform float uAberration;',
    'uniform float uShake;',
    'uniform float uFlashWhite;',
    'uniform vec3 uFlashColor;',
    'uniform float uDesaturate;',
    NOISE,
    '',
    /* ACES-ish filmic curve. The approximation rather than the full fit:
       cheaper, and the difference is invisible under a posterised palette. */
    'vec3 tonemap(vec3 x){',
    '  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;',
    '  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);',
    '}',
    '',
    'void main(){',
    '  vec2 uv = vUV;',
    /* Chromatic aberration, radial, strongest at the corners. Driven by hit
       impact and by the shake amount, so it is a gameplay signal rather than a
       constant filter. */
    '  vec2 ctr = uv - 0.5;',
    '  float r2 = dot(ctr, ctr);',
    '  float ab = uAberration * (0.4 + r2 * 2.2);',
    '  vec3 col;',
    '  if (ab > 0.0001){',
    '    col.r = texture(uColor, uv - ctr * ab).r;',
    '    col.g = texture(uColor, uv).g;',
    '    col.b = texture(uColor, uv + ctr * ab).b;',
    '  } else {',
    '    col = texture(uColor, uv).rgb;',
    '  }',
    '',
    '  vec3 bloom = texture(uBloom, uv).rgb;',
    '  col += bloom * uBloomStrength;',
    '',
    '  col *= uExposure;',
    '  col = tonemap(col);',
    '',
    /* Grade: lift and gain, then contrast about mid grey, then saturation. */
    '  col = col * uGain + uLift;',
    '  col = (col - 0.5) * uContrast + 0.5;',
    '  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));',
    '  col = mix(vec3(lum), col, uSaturation);',
    '  col = mix(col, vec3(lum), uDesaturate);',
    '',
    /* HALFTONE. A rotated dot screen whose dot SIZE tracks luminance, applied
       only where the image is already dark. Applying it everywhere is the
       classic mistake: it turns highlights into a moire mess and reads as a
       filter. Confined to the shadow mass it reads as the print process that
       the style law actually asks for. */
    '  if (uHalftone > 0.0){',
    '    float ang = 0.4363;',
    '    vec2 hp = vec2(uv.x * uRes.x, uv.y * uRes.y);',
    '    vec2 rp = vec2(hp.x * cos(ang) - hp.y * sin(ang), hp.x * sin(ang) + hp.y * cos(ang));',
    '    vec2 cell = fract(rp / 3.4) - 0.5;',
    '    float dotR = length(cell) * 2.0;',
    '    float shadowMask = 1.0 - smoothstep(0.06, 0.42, lum);',
    '    float screen = smoothstep(dotR - 0.35, dotR + 0.35, 0.35 + lum * 1.1);',
    '    col = mix(col, col * (0.62 + 0.38 * screen), shadowMask * uHalftone);',
    '  }',
    '',
    /* CANVAS WEAVE in screen space. Value only. This is the layer that makes
       the whole frame feel like one painted surface. */
    '  if (uCanvas > 0.0){',
    '    float weave = texture(uTooth, uv * uRes / 512.0).g;',
    '    col *= 1.0 + (weave - 0.5) * uCanvas;',
    '  }',
    '',
    /* Vignette, hued rather than black, matching the shadow logic in the mesh
       shader so the frame edge belongs to the same palette. */
    '  float vig = 1.0 - uVignette * smoothstep(0.25, 0.95, length(ctr) * 1.35);',
    '  col *= vig;',
    '  col = mix(col, vec3(0.035, 0.015, 0.06), (1.0 - vig) * 0.55);',
    '',
    /* Grain, animated. Kept subtle and monochrome: coloured grain reads as
       sensor noise, monochrome grain reads as print. */
    '  if (uGrain > 0.0){',
    '    float g = hash12(uv * uRes + fract(uTime) * 813.7) - 0.5;',
    '    col += g * uGrain;',
    '  }',
    '',
    '  col = mix(col, mix(vec3(1.0), uFlashColor, 0.45), uFlashWhite);',
    '  oColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
    '}'
  ].join('\n');

  /* ---------- particles ----------
     Instanced billboards. One draw call for every spark, ember, smoke puff and
     damage flake in the scene. The vertex shader builds the quad from
     gl_VertexID so there is no quad buffer at all. */
  var PARTICLE_VS = [
    '#version 300 es',
    'precision highp float;',
    /* instance attributes */
    'layout(location=0) in vec3 iPos;',
    'layout(location=1) in vec4 iColor;',
    'layout(location=2) in vec3 iParams;',  /* size, rotation, kind */
    'uniform mat4 uProj, uView;',
    'uniform vec3 uRight, uUp;',
    'out vec2 vUV;',
    'out vec4 vColor;',
    'flat out float vKind;',
    /* Six vertices per instance, built from gl_VertexID against a constant
       table. An earlier draft derived the corners with a chain of ternaries
       and got the winding wrong on the second triangle, which showed up as
       every particle being a triangle rather than a quad: cheap to get wrong,
       and invisible until you look closely at a single spark. A literal table
       cannot be wrong. */
    'const vec2 CORNERS[6] = vec2[6](',
    '  vec2(-1.0, -1.0), vec2( 1.0, -1.0), vec2( 1.0,  1.0),',
    '  vec2(-1.0, -1.0), vec2( 1.0,  1.0), vec2(-1.0,  1.0));',
    'void main(){',
    '  vec2 corner = CORNERS[gl_VertexID];',
    '  vUV = corner * 0.5 + 0.5;',
    '  vColor = iColor;',
    '  vKind = iParams.z;',
    '  float s = iParams.x, rot = iParams.y;',
    '  float cs = cos(rot), sn = sin(rot);',
    '  vec2 rc = vec2(corner.x * cs - corner.y * sn, corner.x * sn + corner.y * cs) * s;',
    '  vec3 world = iPos + uRight * rc.x + uUp * rc.y;',
    '  gl_Position = uProj * uView * vec4(world, 1.0);',
    '}'
  ].join('\n');

  var PARTICLE_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'in vec4 vColor;',
    'flat in float vKind;',
    'out vec4 oColor;',
    NOISE,
    'void main(){',
    '  vec2 p = vUV * 2.0 - 1.0;',
    '  float d = length(p);',
    '  float a = 0.0;',
    '  if (vKind < 0.5){',
    /* SPARK: a hard-edged diamond, not a soft round blob. Round soft sprites
       are the fastest way to make a stylised game look like a 2009 particle
       demo. A diamond with a crisp edge reads as a chip of paint. */
    '    float dm = abs(p.x) + abs(p.y);',
    '    a = 1.0 - step(0.95, dm);',
    '    a *= 0.65 + 0.35 * step(dm, 0.55);',
    '  } else if (vKind < 1.5){',
    /* SMOKE: soft, but with a posterised alpha so it still bands. */
    '    float n = fbm(vUV * 3.5 + vColor.r * 17.0);',
    '    a = smoothstep(1.0, 0.25, d) * n * 1.4;',
    '    a = floor(a * 4.0) / 3.5;',
    '  } else if (vKind < 2.5){',
    /* RING: an expanding shock annulus. */
    '    a = smoothstep(0.55, 0.78, d) * (1.0 - smoothstep(0.9, 1.0, d));',
    '  } else if (vKind < 3.5){',
    /* FLAKE: a rotated hard square, the paint-chip debris. */
    '    a = (abs(p.x) < 0.72 && abs(p.y) < 0.72) ? 1.0 : 0.0;',
    '  } else if (vKind < 4.5){',
    /* GLOW: a soft radial bloom with a hot core. The heart of an explosion. */
    '    a = smoothstep(1.0, 0.0, d);',
    '    a *= a;',
    '    a = min(1.0, a + smoothstep(0.42, 0.0, d) * 0.8);',
    '  } else {',
    /* EMBER: a pulsing point of light that flickers as it floats. The fbm
       break-up keeps it from reading as a static dot. */
    '    float n2 = fbm(vUV * 6.0 + vColor.r * 31.0);',
    '    a = smoothstep(0.45, 0.0, d);',
    '    a *= 0.7 + 0.3 * n2;',
    '  }',
    '  if (a <= 0.003) discard;',
    '  oColor = vec4(vColor.rgb, vColor.a * a);',
    '}'
  ].join('\n');

  /* ---------- unlit / additive geometry ----------
     Beams, range rings, placement ghosts, projectile trails. Shares the mesh
     vertex layout so it can reuse any built mesh, but skips lighting. */
  var UNLIT_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNrm;',
    'layout(location=2) in vec3 aCol;',
    'layout(location=3) in vec3 aAux;',
    'uniform mat4 uProj, uView, uModel;',
    'uniform vec3 uCamPos;',
    'out vec3 vWorld;',
    'flat out vec3 vCol;',
    'flat out vec3 vNrm;',
    'flat out float vSeed;',
    'void main(){',
    '  vec4 w = uModel * vec4(aPos, 1.0);',
    '  vWorld = w.xyz;',
    '  vCol = aCol;',
    '  vNrm = mat3(uModel) * aNrm;',
    '  vSeed = aAux.x;',
    '  gl_Position = uProj * uView * w;',
    '}'
  ].join('\n');

  var UNLIT_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec3 vWorld;',
    'flat in vec3 vCol;',
    'flat in vec3 vNrm;',
    'flat in float vSeed;',
    'layout(location=0) out vec4 oColor;',
    'layout(location=1) out vec4 oNormal;',
    'uniform vec3 uTint;',
    'uniform float uAlpha;',
    'uniform float uDebugMode;',
    'uniform float uTime;',
    'uniform float uPulse;',
    'uniform vec3 uCamPos;',
    'uniform float uFresnel;',
    'void main(){',
    '  vec3 col = vCol * uTint;',
    '  float a = uAlpha;',
    '  if (uFresnel > 0.0){',
    /* Edge-on falloff for the range ring and shield domes, so a flat disc
       does not read as a sticker. */
    '    vec3 V = normalize(uCamPos - vWorld);',
    '    float f = pow(1.0 - abs(dot(normalize(vNrm), V)), 2.0);',
    '    a *= mix(1.0, f, uFresnel);',
    '    col += vCol * f * 0.8;',
    '  }',
    '  col *= 1.0 + uPulse * (0.5 + 0.5 * sin(uTime * 6.0 + vSeed * 12.0));',
    '  if (a <= 0.004) discard;',
    '  oColor = vec4(col, a);',
    /* Unlit geometry must NOT contribute an ink edge: a range ring outlined in
       black looks like a decal. Writing a huge depth keeps the Sobel blind to
       it while still letting it composite over the scene. */
    '  oNormal = vec4(0.5, 0.5, 0.5, 1e5);',
    '}'
  ].join('\n');

  return {
    NOISE: NOISE, RAMP: RAMP,
    MESH_VS: MESH_VS, MESH_FS: MESH_FS,
    SHADOW_VS: SHADOW_VS, SHADOW_FS: SHADOW_FS,
    SKY_VS: SKY_VS, SKY_FS: SKY_FS,
    POST_VS: POST_VS, INK_FS: INK_FS,
    BRIGHT_FS: BRIGHT_FS, BLUR_FS: BLUR_FS, COMPOSITE_FS: COMPOSITE_FS,
    PARTICLE_VS: PARTICLE_VS, PARTICLE_FS: PARTICLE_FS,
    UNLIT_VS: UNLIT_VS, UNLIT_FS: UNLIT_FS
  };
})();


/* ===== 04-paint.js ===== */
/* RELIQUARY :: 04-paint
   Procedural textures, generated on a 2D canvas at boot and uploaded once.

   WHY PROCEDURAL: the whole artifact has to be a single self-contained HTML
   file that runs from file:// with no network. Shipping image assets would
   mean base64 blobs measured in megabytes. Generating them costs about 30ms at
   boot and makes the texture parameters art-directable in source.

   ONE TEXTURE, THREE CHANNELS. Packing avoids three samplers and three binds:
     R  paint tooth      mid-frequency knife-stroke grain, used triplanar on
                         every lit surface
     G  canvas weave     a woven linen pattern, used in SCREEN space in the
                         final composite so the whole frame shares one surface
     B  streak           low-frequency directional streaks, for the ground

   SEAMLESS IS NOT OPTIONAL. The tooth is sampled triplanar across large
   terrain, so any seam becomes a visible grid line running the length of the
   board. Every generator here is either built from tiling trig or is mirrored
   into place. */
'use strict';

var PAINT = (function () {

  /* Seamless value noise on a torus. Sampling a 2D noise field along two
     circles guarantees the result wraps in both axes with no blending seam,
     which the usual "blend the edges" trick does not: that leaves a soft band
     that reads as a smudge once it is tiled twenty times across a floor. */
  function tileNoise(w, h, freq, seed) {
    var rnd = U.rng('tile:' + seed);
    /* Build a small random lattice, then sample it with bilinear interpolation
       at wrapped coordinates. */
    var N = Math.max(2, freq | 0);
    var lat = new Float32Array(N * N);
    for (var i = 0; i < N * N; i++) lat[i] = rnd();
    var out = new Float32Array(w * h);
    function at(x, y) {
      x = ((x % N) + N) % N;
      y = ((y % N) + N) % N;
      return lat[y * N + x];
    }
    for (var py = 0; py < h; py++) {
      for (var px = 0; px < w; px++) {
        var fx = px / w * N, fy = py / h * N;
        var x0 = Math.floor(fx), y0 = Math.floor(fy);
        var tx = fx - x0, ty = fy - y0;
        var sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        var a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
        out[py * w + px] = (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
      }
    }
    return out;
  }

  function fbmTile(w, h, baseFreq, octaves, seed) {
    var out = new Float32Array(w * h);
    var amp = 0.5, total = 0, f = baseFreq;
    for (var o = 0; o < octaves; o++) {
      var layer = tileNoise(w, h, f, seed + ':' + o);
      for (var i = 0; i < out.length; i++) out[i] += layer[i] * amp;
      total += amp;
      amp *= 0.5;
      f *= 2;
    }
    for (var k = 0; k < out.length; k++) out[k] /= total;
    return out;
  }

  /* The packed atlas. 512 square is enough: it is sampled at a scale where
     individual weave threads are one to two pixels on screen, and doubling it
     costs 3MB of upload for detail nobody will resolve. */
  function buildAtlas(size) {
    size = size || 512;
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var ctx = cv.getContext('2d');
    var img = ctx.createImageData(size, size);
    var d = img.data;

    var tooth = fbmTile(size, size, 8, 4, 'tooth');
    var streak = fbmTile(size, size, 3, 3, 'streak');
    var fine = fbmTile(size, size, 32, 2, 'fine');

    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var i = y * size + x;
        var o = i * 4;

        /* R: knife tooth. The fbm is contrast-stretched and then given a
           directional bias, so strokes have a dominant angle the way a hand
           holding a knife does. */
        var t = tooth[i];
        var dir = (Math.sin((x * 0.9 + y * 0.42) * U.TAU / size * 6.0) * 0.5 + 0.5);
        t = U.sat(0.5 + (t - 0.5) * 1.9);
        t = U.mix(t, dir, 0.22);
        t = U.mix(t, fine[i], 0.18);

        /* G: canvas weave. Two perpendicular thread systems, each a raised
           cosine, multiplied so the crossings read as knots. The tiny noise
           term stops it looking like a screen-door moire. */
        var wx = Math.cos((x / size) * U.TAU * (size / 4)) * 0.5 + 0.5;
        var wy = Math.cos((y / size) * U.TAU * (size / 4)) * 0.5 + 0.5;
        var weave = U.sat(0.34 + 0.5 * (wx * 0.55 + wy * 0.55) + (fine[i] - 0.5) * 0.35);

        /* B: long streaks for ground and large flat panels. */
        var s = U.sat(0.5 + (streak[i] - 0.5) * 2.3);

        d[o] = Math.round(t * 255);
        d[o + 1] = Math.round(weave * 255);
        d[o + 2] = Math.round(s * 255);
        d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  }

  /* ---------- faction palettes ----------
     Straight from ART-BIBLE section 2, which is LOCKED. The hexes are not
     invented here and must not be tuned: colour is faction identity in this
     universe and a shifted cyan is a different faction.

     Each palette adds the derived values this renderer needs, which the bible
     does not specify because it was written for 2D plates: the ambient
     hemisphere, the hued shadow, the nebula pair and the ink colour. Those ARE
     art choices made here, and they are made by pushing the locked key colour
     through HSL rather than by picking new hues, so a faction can never drift
     off its own identity. */
  function derive(key, opts) {
    var k = U.hex2rgb(key);
    var hsl = U.rgb2hsl(k);
    opts = opts || {};
    var shadowHue = opts.shadowHue === undefined ? 0.70 : opts.shadowHue;
    return {
      key: key,
      keyRgb: k,
      /* The shadow is the key colour dragged toward the void hue and crushed.
         Never neutral: the plates always have colour living in the blacks. */
      shadow: U.hsl2rgb([shadowHue, 0.62, 0.075]),
      light: U.hsl2rgb([(hsl[0] + (opts.lightWarm || 0.06)) % 1, 0.32, 0.86]),
      rim: U.hsl2rgb([(hsl[0] + (opts.rimShift || 0.0)) % 1, 1.0, 0.66]),
      ambientSky: U.hsl2rgb([shadowHue - 0.06, 0.55, 0.20]),
      ambientGround: U.hsl2rgb([shadowHue + 0.05, 0.60, 0.085]),
      skyTop: U.hsl2rgb([shadowHue - 0.02, 0.72, 0.055]),
      skyBottom: U.hsl2rgb([shadowHue + 0.06, 0.60, 0.115]),
      nebulaA: U.hsl2rgb([(hsl[0] + (opts.nebA || 0.0)) % 1, 0.86, 0.42]),
      nebulaB: U.hsl2rgb([(hsl[0] + (opts.nebB || 0.52)) % 1, 0.90, 0.52]),
      ink: U.hsl2rgb([shadowHue, 0.75, 0.035]),
      fog: U.hsl2rgb([shadowHue + 0.02, 0.55, 0.075])
    };
  }

  /* MAGENTA IS THE UNIVERSAL KEY LIGHT, not a faction colour (ART-BIBLE:
     "Neon magenta, vaporwave key light, skies, accents"). Every palette below
     therefore reaches magenta through its nebula or its rim, which is what
     makes five very different colour schemes still look like one game. */
  var FACTIONS = {
    human: Object.assign(derive('#38e8ff', { shadowHue: 0.66, rimShift: 0.02, nebA: 0.02, nebB: 0.42 }), {
      id: 'human', name: 'HUMANITY',
      motto: 'Cold competent industry.',
      accent: '#38e8ff', accent2: '#7dd3fc'
    }),
    light: Object.assign(derive('#fbbf24', { shadowHue: 0.74, lightWarm: 0.02, rimShift: -0.02, nebA: 0.86, nebB: 0.78 }), {
      id: 'light', name: 'FEDERATION OF LIGHT',
      motto: 'A cathedral that answers.',
      accent: '#fbbf24', accent2: '#fde68a'
    }),
    xeno: Object.assign(derive('#7c3aed', { shadowHue: 0.76, rimShift: 0.10, nebA: 0.08, nebB: 0.90 }), {
      id: 'xeno', name: 'THE XENO',
      motto: 'Accumulated, never designed.',
      accent: '#7c3aed', accent2: '#c084fc'
    }),
    pirate: Object.assign(derive('#ef4444', { shadowHue: 0.72, rimShift: 0.03, nebA: 0.97, nebB: 0.86 }), {
      id: 'pirate', name: 'THE PIRATES',
      motto: 'No two ships from the same yard.',
      accent: '#ef4444', accent2: '#fb923c'
    }),
    robotic: Object.assign(derive('#94a3b8', { shadowHue: 0.62, rimShift: 0.02, nebA: 0.50, nebB: 0.88 }), {
      id: 'robotic', name: 'THE VIGIL',
      motto: 'Tending a garden for a maker who is not coming back.',
      accent: '#94a3b8', accent2: '#5eead4'
    })
  };

  /* The vaporwave key. Held separately so effects can reach for it without
     going through a faction, and so there is exactly one definition of it. */
  var MAGENTA = U.hex2rgb('#ff2fd6');
  var VOID = U.hex2rgb('#0a0e17');

  return {
    buildAtlas: buildAtlas,
    fbmTile: fbmTile,
    FACTIONS: FACTIONS,
    MAGENTA: MAGENTA,
    VOID: VOID,
    derive: derive
  };
})();


/* ===== 05-render.js ===== */
/* RELIQUARY :: 05-render
   The frame. Owns every render target, every program, and the order the
   passes run in.

   PASS ORDER, and why each one is where it is:

     1  shadow     depth only, from the sun, into a comparison-sampled texture

    p.u1f('uGrain', ART.grain);

    p.u1f('uCanvas', ART.canvas);

/* ===== 06-terrain.js ===== */
/* RELIQUARY :: 06-terrain
   The board: heightfield, path, build plots, scenery.

   WHY A HEIGHTFIELD AND NOT A PLANE. The first render of this project used a
   single flat slab for the ground and it came out as one uniform pale wash.
   The reason is structural, not a tuning problem: the posterised ramp assigns
   a band from the surface normal, so a plane with ONE normal gets ONE band
   across its entire area, and every painterly quality in the shader is
   defeated at the same time. A gently undulating heightfield gives adjacent
   quads slightly different normals, they land on different bands, and the
   ground becomes the patchwork of knife strokes the art direction is after.
   The undulation is small enough (well under a unit) that it never affects
   gameplay or placement.

   The path is a Catmull-Rom spline through hand-placed waypoints, densified
   into a polyline. Units walk the polyline by arc length so they move at a
   constant speed regardless of how the control points are spaced, which a
   naive t-parameterised spline does not give you: units would sprint through
   straights and crawl round corners. */
'use strict';

var TERRAIN = (function () {

  var V = U.V;

  /* Catmull-Rom through p0..p3 at t. Standard uniform form: good enough for
     hand-placed control points that are roughly evenly spaced, and it does not
     need the chord-length bookkeeping the centripetal variant does. */
  function catmull(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return [
      0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
      0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
      0.5 * ((2 * p1[2]) + (-p0[2] + p2[2]) * t + (2 * p0[2] - 5 * p1[2] + 4 * p2[2] - p3[2]) * t2 + (-p0[2] + 3 * p1[2] - 3 * p2[2] + p3[2]) * t3)
    ];
  }

  /* Densify a waypoint list into an arc-length-parameterised polyline. The
     cumulative length table is what makes constant-speed travel possible. */
  function buildPath(waypoints, samplesPerSeg) {
    var pts = [];
    var n = waypoints.length;
    if (n < 2) return { pts: waypoints.slice(), cum: [0], length: 0 };
    /* Duplicate the endpoints so the spline reaches the first and last
       waypoint instead of easing away from them. */
    var w = [waypoints[0]].concat(waypoints, [waypoints[n - 1]]);
    var spp = samplesPerSeg || 14;
    for (var i = 0; i < w.length - 3; i++) {
      for (var s = 0; s < spp; s++) {
        pts.push(catmull(w[i], w[i + 1], w[i + 2], w[i + 3], s / spp));
      }
    }
    pts.push(w[w.length - 2].slice());

    var cum = [0];
    var total = 0;
    for (var k = 1; k < pts.length; k++) {
      total += V.dist(pts[k - 1], pts[k]);
      cum.push(total);
    }
    return { pts: pts, cum: cum, length: total };
  }

  /* Position and forward direction at arc-length d along the path. Binary
     search over the cumulative table: called for every unit every frame, so a
     linear scan would be O(units * samples). */
  function pathAt(path, d) {
    var cum = path.cum, pts = path.pts;
    if (d <= 0) {
      var f0 = V.norm(V.sub(pts[1] || pts[0], pts[0]));
      return { pos: pts[0].slice(), dir: f0, t: 0 };
    }
    if (d >= path.length) {
      var last = pts.length - 1;
      var fl = V.norm(V.sub(pts[last], pts[last - 1] || pts[last]));
      return { pos: pts[last].slice(), dir: fl, t: 1 };
    }
    var lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= d) lo = mid; else hi = mid;
    }
    var seg = cum[hi] - cum[lo];
    var f = seg > 1e-6 ? (d - cum[lo]) / seg : 0;
    var a = pts[lo], b = pts[hi];
    return {
      pos: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f],
      dir: V.norm(V.sub(b, a)),
      t: d / path.length
    };
  }

  /* Shortest distance from a point to the path polyline, in XZ. Used to carve
     the path into the heightfield and to reject build plots that sit on it. */
  function distToPath(path, x, z) {

      var dx = bx - ax, dz = bz - az;

  /* ---------- board generation ---------- */

  function build(def) {

    var rnd = U.rng('terrain:' + seed);
    var CS = def.cell || 3.0;
    var GW = def.gw || 30, GH = def.gh || 22;
    var halfW = GW * CS / 2, halfH = GH * CS / 2;
    var pathWidth = def.pathWidth || 4.2;

    var path = buildPath(def.waypoints, 16);

    /* Height field, sampled on grid CORNERS so adjacent quads share exact
       corner heights and the surface stays watertight. Sampling at cell
       centres instead leaves gaps the shadow pass renders as light leaks. */
    var HW = GW + 1, HH = GH + 1;
    var height = new Float32Array(HW * HH);
    var pdist = new Float32Array(HW * HH);
    /* IN-PLANE CORNER JITTER. A perfectly regular grid reads as a tiled floor
       no matter how its colour varies, because the eye finds the repeating
       lattice before it finds the paint. Displacing each interior corner in XZ
       by up to a third of a cell breaks the lattice while keeping the surface
       watertight, since neighbours share the displaced corner rather than each
       computing their own. The boundary ring is left alone so the plate keeps
       a clean straight edge against the void. */
    var jitX = new Float32Array(HW * HH);
    var jitZ = new Float32Array(HW * HH);
    var jr = U.rng('gridjit:' + seed);
    for (var jj = 0; jj < HH; jj++) {

    function nz(x, z, f) {
      /* Two octaves of cheap trig noise. Not a real fbm: the amplitude here is
         under a unit and the only requirement is that it be smooth, aperiodic
         over the board, and identical every run. */
      return Math.sin(x * f * 0.71 + z * f * 0.33 + 1.7) * 0.6 +
             Math.sin(x * f * 0.29 - z * f * 0.83 + 4.1) * 0.4;
    }

    var i, j, idx;
    for (j = 0; j < HH; j++) {
      for (i = 0; i < HW; i++) {
        idx = j * HW + i;
        var wx = -halfW + i * CS, wz = -halfH + j * CS;
        var d = distToPath(path, wx, wz);
        pdist[idx] = d;

        /* RELIEF IS DELIBERATELY SMALL, and this is an art decision that was

           An earlier version ran relief at 1.35 with a 1.15 low-frequency term

           share of ground facets tilt away from the sun, land on the deep band
           and go nearly black. Measured: path [81,103,166] against ground

           The fix is not to fight it with grading. It is to notice that the
           painterly patchwork should come from COLOUR, the way it does in the
           reference plates, and not from geometry. The ground is a play

        /* The board falls away at its rim so it reads as a plate floating in
           space rather than as a cropped infinite plane. */
        var edge = Math.max(Math.abs(wx) / halfW, Math.abs(wz) / halfH);
        h -= U.smoothstep(0.82, 1.02, edge) * 7.0;

           just outside it so the road reads as cut into the ground. */

      var x0 = Math.floor(fx), z0 = Math.floor(fz);

        var z0 = -halfH + j * CS, z1 = z0 + CS;
        var pd = (pdist[i00] + pdist[i10] + pdist[i01] + pdist[i11]) * 0.25;
        var onPath = pd < pathWidth * 1.05;

        var r = rnd();
        var col = onPath

          : groundCols[Math.floor(r * groundCols.length) % groundCols.length];

           Giving both triangles of a quad the same colour makes the board read
           as square TILES, which is a floor, not a painting. A knife lays down
           one stroke at a time and no two carry quite the same mix, so each
           triangle takes the cell's base colour with a small independent shift.
           Keeping the base per cell is what stops it dissolving into noise: the
           result is coherent patches with visible internal brushwork, which is
           what the reference plates actually do. */

        if (pr() < 0.22) continue;

          id: 'p' + i + '_' + j,
          x: cx, z: cz,
          y: heightAt(cx, cz),
          gx: i, gz: j,
          tower: null,
          dist: d2

    /* ---------- scenery ----------
       Baked into a single merged mesh: it never moves, so there is no reason
       to pay a draw call per rock. */
    var decor = [];
    var dr = U.rng('decor:' + seed);
    var rockProto = [];
    for (var rp = 0; rp < 4; rp++) {
      var rb = MESH.builder('rockproto' + rp);
      rb.tooth(1.0);
      rb.color(groundCols[rp % groundCols.length]);
      rb.ico(1.0, rp === 3 ? 1 : 0);
      rockProto.push(rb.build({ jitter: 0.22 }));
    }
    var pieces = [];
    /* DECOR IS SCENERY, NOT SUBJECT. The first pass scattered 190 rocks at up
       to 3 units and they took over the frame: the board read as a quarry with
       a tower hidden in it. Scenery in this art direction exists to give the
       silhouette something to sit against, so the count is down and, more
       importantly, the size curve is much flatter. Anything large now has to
       earn its place as a spire on the rim instead. */
    var attempts = def.decor === undefined ? 95 : def.decor;
    for (var a = 0; a < attempts; a++) {
      var ang = dr() * U.TAU;
      var rad = Math.sqrt(dr()) * Math.min(halfW, halfH) * 1.02;
      var dx2 = Math.cos(ang) * rad * (halfW / Math.min(halfW, halfH));
      var dz2 = Math.sin(ang) * rad * (halfH / Math.min(halfW, halfH));
      if (Math.abs(dx2) > halfW * 0.97 || Math.abs(dz2) > halfH * 0.97) continue;
      if (distToPath(path, dx2, dz2) < pathWidth * 1.15) continue;
      var hy = heightAt(dx2, dz2);
      if (hy < -3) continue;
      var s = 0.30 + dr() * dr() * 1.15;
      var M = U.m4trs(dx2, hy + s * 0.28, dz2,
        dr() * 0.5 - 0.25, dr() * U.TAU, dr() * 0.5 - 0.25,
        s * (0.75 + dr() * 0.6), s * (0.55 + dr() * 0.7), s * (0.75 + dr() * 0.6));

       the board rather than clutter it, and they are dark so they read as
