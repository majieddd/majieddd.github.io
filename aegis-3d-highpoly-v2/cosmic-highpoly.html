  function tickOverlay(dt) {
    var G = GAME.state;
    if (!G) return;

    /* THE HUD MUST TRACK THE SIMULATION, NOT THE INPUT.
       refresh() used to be called only from click and key handlers, so gold,
       lives and the wave counter went stale the moment the player stopped
       touching anything: a screenshot at wave nine showed the banner reading
       WAVE 9 over a top bar still reading WAVE 1. Gold changes on every kill
       and lives change on every leak, neither of which is an input event.
       Calling it per frame is correct and cheap, because both structural
       rebuilds inside it are behind signature guards. */
    refresh();

    if (bannerTimer > 0) {
      bannerTimer -= dt;
      if (bannerTimer <= 0) el.banner.classList.remove('show');
    }
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) el.toast.classList.remove('show');
    }

    /* wave progress */
    if (el.wavefill) {
      var frac = 0;
      if (G.waveActive) {
        var total = 0, alive = 0;
        for (var i = 0; i < G.denizens.length; i++) if (G.denizens[i].alive) alive++;
        total = alive + G.spawnQueue.length;
        var w = DATA.WAVES[G.wave - 1];
        var started = 0;
        if (w) for (var q = 0; q < w.groups.length; q++) started += w.groups[q].count;
        frac = started > 0 ? 1 - (total / started) : 0;
      } else {
        frac = U.sat(G.waveTimer / G.betweenWaves);
      }
      el.wavefill.style.width = (U.sat(frac) * 100).toFixed(1) + '%';
    }

    /* ability cooldown sweeps */
    ['q', 'e'].forEach(function (slot) {
      var n = $('ab-' + slot);
      if (!n) return;
      var a = slot === 'q' ? G.commander.q : G.commander.e;
      var st = G.abilities[slot];
      var sweep = n.querySelector('.sweep');
      var cdText = n.querySelector('.cd');
      var frac = st.cd > 0 ? st.cd / a.cd : 0;
      if (sweep) sweep.style.transform = 'scaleY(' + frac.toFixed(3) + ')';
      if (cdText) cdText.textContent = st.cd > 0 ? Math.ceil(st.cd) + 's' :
        (st.active > 0 ? 'ACTIVE' : 'READY');
      n.classList.toggle('ready', st.cd <= 0);
    });

    /* floating combat text */
    var texts = FX.texts;
    var used = 0;
    for (var t = 0; t < texts.length; t++) {
      var f = texts[t];
      var p = R.project([f.x, f.y, f.z]);
      if (!p) continue;
      var node = floatPool[used];
      if (!node) {
        node = mk('div', 'float');
        el.floats.appendChild(node);
        floatPool[used] = node;
      }
      used++;
      var life = f.life / f.max;
      var cls = 'float' + (f.cls ? ' ' + f.cls : '');
      if (node.__cls !== cls) { node.className = cls; node.__cls = cls; }
      if (node.__str !== f.str) { node.textContent = f.str; node.__str = f.str; }
      if (node.__col !== f.color) { node.style.color = f.color; node.__col = f.color; }
      node.style.transform = 'translate(-50%,-50%) translate(' +
        p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) scale(' +
        (f.size * (0.8 + life * 0.35)).toFixed(3) + ')';
      node.style.opacity = life > 0.7 ? '1' : (life / 0.7).toFixed(2);
      node.style.display = '';
    }
    for (var k = used; k < floatPool.length; k++) {
      if (floatPool[k].style.display !== 'none') floatPool[k].style.display = 'none';
    }

    /* HEALTH BARS, only on bodies that have actually been hurt.
       Showing one over every unit turns a wave into a bar chart and hides the
       art; showing none means the player cannot tell a body about to die from
       one at full health, which is the single most important read in the game
       during a boss. Pooled and parked rather than created and destroyed, for
       the same reason the floating text is. */
    var bars = 0;
    for (var bi = 0; bi < G.denizens.length; bi++) {
      var dn = G.denizens[bi];
      if (!dn.alive || dn.hp >= dn.maxHp - 0.5) continue;
      var bp = R.project([dn.pos[0], dn.pos[1] + 2.35 * dn.scale, dn.pos[2]]);
      if (!bp) continue;
      var bar = barPool[bars];
      if (!bar) {
        bar = mk('div', 'hpbar');
        bar.appendChild(mk('i'));
        el.floats.appendChild(bar);
        barPool[bars] = bar;
      }
      bars++;
      var frac = U.sat(dn.hp / dn.maxHp);
      var w = dn.def.boss ? 86 : (dn.scale > 1.4 ? 46 : 30);
      bar.style.transform = 'translate(-50%,-50%) translate(' +
        bp.x.toFixed(1) + 'px,' + bp.y.toFixed(1) + 'px)';
      bar.style.width = w + 'px';
      bar.firstChild.style.transform = 'scaleX(' + frac.toFixed(3) + ')';
      bar.className = 'hpbar' + (dn.def.boss ? ' boss' : '') + (frac < 0.3 ? ' crit' : '');
      bar.style.display = '';
    }
    for (var bk = bars; bk < barPool.length; bk++) {
      if (barPool[bk].style.display !== 'none') barPool[bk].style.display = 'none';
    }

    if (perfOn && el.perf) {
      el.perf.textContent =
        Math.round(GAME.stats.fps) + ' fps  ' +
        GAME.stats.frameMs.toFixed(1) + ' ms  ' +
        FX.count + ' particles  ' +
        G.denizens.length + ' units  ' +
        G.towers.length + ' towers';
    }

    /* wave transitions produce their own banners */
    if (G.__lastWave !== G.wave && G.waveActive) {
      G.__lastWave = G.wave;
      var w = DATA.WAVES[G.wave - 1];
      showBanner('WAVE ' + G.wave, w && w.banner ? w.banner : '', w && w.boss ? 3.0 : 1.8);
      lastDockSig = '';
    }
    if (G.status === 'won' || G.status === 'lost') {
      if (!G.__ended) { G.__ended = true; showEnd(G.status === 'won'); }
    }
    if (GAME.paused && !el.pauseScreen.classList.contains('show')) {
      el.pauseScreen.classList.add('show');
    } else if (!GAME.paused && el.pauseScreen.classList.contains('show')) {
      el.pauseScreen.classList.remove('show');
    }
  }

  function showEnd(won) {
    var G = GAME.state;
    var sheet = $('end-sheet');
    if (!sheet) return;
    var reactions = 0;
    for (var k in G.reactionCounts) reactions += G.reactionCounts[k];
    var best = null, bestN = 0;
    for (var r in G.reactionCounts) if (G.reactionCounts[r] > bestN) { bestN = G.reactionCounts[r]; best = r; }
    var bestName = '-';
    for (var i = 0; i < DATA.REACTIONS.length; i++) {
      if (DATA.REACTIONS[i].id === best) bestName = DATA.REACTIONS[i].name;
    }

    var h = '';
    h += '<h1 class="title">' + (won ? 'THE LANE HELD' : 'THE LANE BROKE') + '</h1>';
    h += '<p class="tagline">' + (won
      ? 'Twenty waves answered. The reliquary stands, and whatever was walking toward it has stopped.'
      : 'Wave ' + G.wave + ' reached the plate. Rebuild, re-read the reactions, and take the lane back.') + '</p>';
    h += '<div class="endstats">';
    h += endStat('WAVE', G.wave + '/' + DATA.WAVES.length);
    h += endStat('KILLS', U.fmt(G.kills));
    h += endStat('DAMAGE', U.fmt(G.damageDealt));
    h += endStat('GOLD EARNED', U.fmt(G.goldEarned));
    h += endStat('LIVES LEFT', String(G.lives));
    h += endStat('REACTIONS', U.fmt(reactions));
    h += '</div>';
    h += '<div class="faint" style="margin-top:12px;font-size:12px">Most used reaction: <strong>' +
      bestName + '</strong>' + (bestN ? ' (' + bestN + ')' : '') + '</div>';
    h += '<div class="startrow">' +
      '<button type="button" class="btn btn-primary" id="btn-again">RUN IT AGAIN</button>' +
      '<button type="button" class="btn" id="btn-back">CHANGE LOADOUT</button></div>';
    sheet.innerHTML = h;
    el.endScreen.classList.add('show');
    bindChrome();
  }

  function endStat(k, v) {
    return '<div class="endstat"><div class="k">' + k + '</div><div class="v mono">' + v + '</div></div>';
  }

  /* ---------- codex ---------- */

  function showHelp() {
    var sheet = $('help-sheet');
    if (!sheet) return;
    var h = '';
    h += '<h1 class="title" style="font-size:26px">CODEX</h1>';
    h += '<div class="cols">';

    h += '<div><div class="grouplabel">CONTROLS</div><div class="keylist">';
    [['1 to 9', 'Select a tower'], ['Click', 'Place, or inspect a built tower'],
     ['U', 'Upgrade the inspected tower'], ['S', 'Sell it'],
     ['Q / E', 'Commander abilities'], ['Enter', 'Call the next wave early'],
     ['Space', 'Cycle speed 1x 2x 4x'], ['P', 'Pause'],
     ['Drag', 'Orbit the camera'], ['Wheel', 'Zoom']].forEach(function (r) {
      h += '<div class="keyrow"><kbd>' + r[0] + '</kbd><span class="dim">' + r[1] + '</span></div>';
    });
    h += '</div></div>';

    h += '<div><div class="grouplabel">HOW REACTIONS WORK</div>' +
      '<p class="dim" style="font-size:12.5px;margin:0">A hit leaves an elemental MARK. ' +
      'Hitting a marked body with a DIFFERENT element consumes the mark and triggers a reaction. ' +
      'One mark at a time, so the next reaction is always predictable.</p>' +
      '<div class="reactgrid">';
    DATA.REACTIONS.forEach(function (r) {
      h += '<div class="reactrow"><div class="nm" style="color:' + r.color + '">' + r.name + '</div>' +
        '<div class="pair">' + DATA.ELEMENTS[r.a].name + ' + ' + DATA.ELEMENTS[r.b].name +
        ' &middot; x' + r.mult.toFixed(2) + '</div>' +
        '<div class="dim" style="margin-top:3px">' + r.blurb + '</div></div>';
    });
    h += '</div></div>';
    h += '</div>';
    h += '<div class="startrow"><button type="button" class="btn btn-primary" id="btn-closehelp">CLOSE</button></div>';
    sheet.innerHTML = h;
    $('help-screen').classList.add('show');
    bindChrome();
  }

  return {
    init: init,
    refresh: refresh,
    tickOverlay: tickOverlay,
    showBanner: showBanner,
    toast: toast,
    applyPalette: applyPalette,
    buildAbilities: buildAbilities,
    beginRun: beginRun,
    showHelp: showHelp,
    pending: pending
  };
})();


/* ===== 15-boot.js ===== */
/* RELIQUARY :: 15-boot
   Bring-up, the failure screen, and the automation surface.

   THE BOOT ORDER MATTERS AND IS ASSERTED. Every module here is a plain script
   with no module system, so a missing or reordered <script> tag produces a
   ReferenceError deep inside a frame rather than at load. Checking the globals
   up front turns that into one legible message.

   THE FAILURE SCREEN IS NOT DECORATION. A WebGL2 context can fail to create on
   older hardware, in a locked-down enterprise browser, or when the GPU process
   has crashed. Without this the page is a black rectangle with an error only
   in the console, which reads as a broken link rather than as an unsupported
   browser. */
'use strict';

(function () {

  var REQUIRED = ['U', 'GL', 'MESH', 'SH', 'PAINT', 'R', 'TERRAIN', 'RIG',
                  'DATA', 'MODELS', 'AUDIO', 'FX', 'SIM', 'GAME', 'UI'];

  function fatal(title, detail) {
    var wrap = document.createElement('div');
    wrap.setAttribute('style',
      'position:fixed;inset:0;z-index:999;display:flex;align-items:center;' +
      'justify-content:center;padding:32px;background:#0a0e17;color:#e8ecf8;' +
      'font-family:Inter,system-ui,sans-serif');
    var box = document.createElement('div');
    box.setAttribute('style', 'max-width:560px');
    var h = document.createElement('h1');
    h.textContent = title;
    h.setAttribute('style', 'font-size:24px;letter-spacing:.08em;margin:0 0 12px');
    var p = document.createElement('p');
    p.textContent = detail;
    p.setAttribute('style', 'color:#a8b4d0;font-size:14px;line-height:1.55;margin:0');
    box.appendChild(h);
    box.appendChild(p);
    wrap.appendChild(box);
    document.body.appendChild(wrap);
  }

  function boot() {
    var missing = [];
    for (var i = 0; i < REQUIRED.length; i++) {
      if (typeof window[REQUIRED[i]] === 'undefined') missing.push(REQUIRED[i]);
    }
    if (missing.length) {
      fatal('Failed to load',
        'These modules did not load: ' + missing.join(', ') +
        '. If you are opening this from a file:// path, serve the folder over HTTP instead.');
      return;
    }

    var canvas = document.getElementById('gl');
    try {
      GAME.init(canvas);
    } catch (e) {
      fatal('WebGL2 is not available',
        'This game needs WebGL2, which this browser or this machine did not provide. ' +
        'Details: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    UI.init();

    /* The AudioContext cannot start without a gesture, so the first click or
       key anywhere arms it. Registered once and then removed rather than left
       attached, because it fires on every subsequent interaction otherwise. */
    function armAudio() {
      AUDIO.init();
      AUDIO.resume();
      window.removeEventListener('pointerdown', armAudio);
      window.removeEventListener('keydown', armAudio);
    }
    window.addEventListener('pointerdown', armAudio);
    window.addEventListener('keydown', armAudio);

    /* ---------- automation surface ----------
       Everything the headless verifier needs to drive a real run without a
       mouse. This is deliberately part of the shipped file rather than a test
       build: a probe that runs against a DIFFERENT build than the one that
       ships has proved something about a program nobody plays. */
    window.__RQ = {
      version: '1.0.0',

      ready: function () {
        return !!(GAME && UI && R && R.caps());
      },
      caps: function () { return R.caps(); },

      /* Errors from every buffer in the project, in one place, so the harness
         has exactly one thing to assert is empty. The project law is that an
         error buffer without a named reader is a place errors go to be
         ignored; this is that reader. */
      errors: function () {
        return {
          gl: GL.errors(),
          render: R.errors(),
          sim: SIM.errors ? SIM.errors() : [],
          game: GAME.errors(),
          audio: AUDIO.errors()
        };
      },
      errorCount: function () {
        var e = this.errors(), n = 0;
        for (var k in e) n += e[k].length;
        return n;
      },

      start: function (opts) {
        opts = opts || {};
        UI.pending.faction = opts.faction || 'human';
        UI.pending.enemyFaction = opts.enemyFaction || 'xeno';
        UI.pending.commander = opts.commander || 'vanta';
        UI.pending.board = opts.board === undefined ? 0 : opts.board;
        UI.pending.difficulty = opts.difficulty === undefined ? 1 : opts.difficulty;
        UI.beginRun();
        return this.snapshot();
      },

      /* Advance the simulation deterministically, without waiting for real
         frames. Used by the verifier to reach wave twenty in seconds. */
      step: function (seconds, sub) {
        sub = sub || (1 / 120);
        var n = Math.max(1, Math.round(seconds / sub));
        for (var i = 0; i < n; i++) {
          SIM.step(sub);
          FX.update(sub);
          FX.updateText(sub);
        }
        return this.snapshot();
      },

      snapshot: function () {
        var G = GAME.state;
        if (!G) return { ok: false };
        var alive = 0, marked = 0;
        for (var i = 0; i < G.denizens.length; i++) {
          if (G.denizens[i].alive) alive++;
          if (G.denizens[i].mark) marked++;
        }
        var reactions = 0;
        for (var k in G.reactionCounts) reactions += G.reactionCounts[k];
        return {
          ok: true,
          status: G.status,
          wave: G.wave,
          waveActive: G.waveActive,
          gold: Math.round(G.gold),
          lives: G.lives,
          towers: G.towers.length,
          denizens: G.denizens.length,
          alive: alive,
          marked: marked,
          projectiles: G.projs.length,
          kills: G.kills,
          leaked: G.leaked,
          damage: Math.round(G.damageDealt),
          reactions: reactions,
          reactionCounts: G.reactionCounts,
          particles: FX.count,
          plots: G.board.plots.length,
          freePlots: G.board.plots.filter(function (p) { return !p.tower; }).length
        };
      },

      /* Build a tower on the Nth free plot. Returns the tower id or null. */
      build: function (towerId, plotIndex) {
        var G = GAME.state;
        if (!G) return null;
        var free = G.board.plots.filter(function (p) { return !p.tower; });
        var plot = free[plotIndex === undefined ? 0 : plotIndex % free.length];
        if (!plot) return null;
        var t = SIM.place(plot.id, towerId);
        return t ? t.uid : null;
      },

      /* Build one of every tower, spreading them along the lane. The verifier
         uses this to prove all fourteen place, target and fire. */
      buildAll: function (gold) {
        var G = GAME.state;
        if (!G) return null;
        if (gold) G.gold = gold;
        var built = [];
        var free = G.board.plots.filter(function (p) { return !p.tower; });
        /* Nearest to the lane first, so every tower actually has something in
           range rather than sitting in a corner proving nothing. */
        free.sort(function (a, b) { return a.dist - b.dist; });
        for (var i = 0; i < DATA.TOWER_ORDER.length && i < free.length; i++) {
          var t = SIM.place(free[i].id, DATA.TOWER_ORDER[i]);
          if (t) built.push(DATA.TOWER_ORDER[i]);
        }
        return built;
      },

      upgradeAll: function (gold) {
        var G = GAME.state;
        if (!G) return 0;
        if (gold) G.gold = gold;
        var n = 0;
        for (var pass = 0; pass < 2; pass++) {
          for (var i = 0; i < G.towers.length; i++) {
            if (SIM.upgrade(G.towers[i])) n++;
          }
        }
        return n;
      },

      /* Force a specific denizen onto the board, for testing behaviours the
         wave table would take minutes to reach. */
      spawn: function (typeId, count, dist) {
        var out = [];
        for (var i = 0; i < (count || 1); i++) {
          var d = SIM.spawnDenizen(typeId, { dist: (dist || 0) + i * 2 });
          if (d) out.push(d.uid);
        }
        return out;
      },

      setGold: function (v) { if (GAME.state) GAME.state.gold = v; return v; },
      setWave: function (n) { if (GAME.state) GAME.state.wave = n; return n; },
      startWave: function () { return SIM.startWave(); },
      ability: function (slot) { return SIM.useAbility(slot); },

      /* Drive a reaction directly, so the verifier can prove all ten fire
         without needing the exact tower pair on the board. */
      forceReaction: function (a, b) {
        var G = GAME.state;
        if (!G) return null;
        var d = SIM.spawnDenizen('stockman', { dist: G.board.path.length * 0.4 });
        if (!d) return null;
        d.hp = d.maxHp = 900000;
        var before = 0;
        for (var k in G.reactionCounts) before += G.reactionCounts[k];
        SIM.damage(d, 1, { element: a });
        SIM.damage(d, 1, { element: b });
        var after = 0;
        for (var k2 in G.reactionCounts) after += G.reactionCounts[k2];
        var r = DATA.reactionFor(a, b);
        d.hp = 0; SIM.kill(d, {});
        return { pair: a + '+' + b, expected: r ? r.id : null, fired: after > before };
      },

      towerReport: function () {
        var G = GAME.state;
        if (!G) return [];
        return G.towers.map(function (t) {
          return {
            id: t.id, tier: t.tier,
            kills: t.kills,
            damage: Math.round(t.damage),
            hasTarget: !!t.target
          };
        });
      },

      camera: function (o) {
        if (o.dist !== undefined) GAME.cam.targetDist = GAME.cam.dist = o.dist;
        if (o.yaw !== undefined) GAME.cam.targetYaw = GAME.cam.yaw = o.yaw;
        if (o.pitch !== undefined) GAME.cam.targetPitch = GAME.cam.pitch = o.pitch;
        if (o.focus) { GAME.cam.targetFocus = o.focus.slice(); GAME.cam.focus = o.focus.slice(); }
        return { dist: GAME.cam.dist, yaw: GAME.cam.yaw, pitch: GAME.cam.pitch };
      },

      select: function (towerId) { if (GAME.state) GAME.state.selected = towerId; },
      inspect: function (i) {
        var G = GAME.state;
        if (!G || !G.towers[i]) return null;
        G.inspecting = G.towers[i];
        UI.refresh();
        return G.towers[i].id;
      },
      screen: function (which) {
        var ids = { start: 'start-screen', end: 'end-screen', help: 'help-screen', pause: 'pause-screen' };
        var n = document.getElementById(ids[which]);
        return n ? n.classList.contains('show') : null;
      },
      closeScreens: function () {
        ['start-screen', 'end-screen', 'help-screen', 'pause-screen'].forEach(function (id) {
          var n = document.getElementById(id);
          if (n) n.classList.remove('show');
        });
      },
      audioState: function () {
        return { ready: AUDIO.isReady(), state: AUDIO.state(), sfx: AUDIO.SFX_NAMES.length };
      },
      counts: function () {
        return {
          towers: DATA.TOWER_ORDER.length,
          denizens: DATA.DENIZEN_ORDER.length,
          reactions: DATA.REACTIONS.length,
          elements: DATA.ELEMENT_ORDER.length,
          commanders: DATA.COMMANDER_ORDER.length,
          boards: DATA.BOARDS.length,
          waves: DATA.WAVES.length,
          sfx: AUDIO.SFX_NAMES.length
        };
      }
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();


</script>
</body>
</html>
