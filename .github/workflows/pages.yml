name: Deploy to Pages

# main is what majieddd.github.io serves, so every push to it publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The site runs straight from index.html + js/ + css/ with no build, but
      # the standalone bundle is offered as a download, so it must be rebuilt
      # here rather than trusted from the commit.
      - name: Build the single-file bundle
        run: node build.js

      # The narrative spine (narrative/*.html + spine.json) is the canonical
      # reference for everything on main: campaigns, towers, denizens,
      # commanders, boons, systems, each with a stable ref and a source line.
      # It is regenerated HERE, from this very commit's game data, so the
      # published document can never describe a version of the game that is
      # not the one this deploy is publishing. The generator throws (and this
      # deploy fails) if any table entry cannot be rendered or located, which
      # is the honest outcome: better no deploy than a spine that lies.
      - name: Regenerate the narrative spine from this commit
        run: node tools/storyboard.js

      - name: Verify the bundle actually inlined everything
        run: |
          for f in aegis-protocol.html aegis-artifact.html; do
            test -f "$f" || { echo "::error::$f was not written"; exit 1; }
          done
          if grep -q '<script src=' aegis-protocol.html; then
            echo "::error::bundle still references an external script"; exit 1
          fi
          for f in narrative/index.html narrative/spine.json; do
            test -f "$f" || { echo "::error::$f was not written"; exit 1; }
          done
          echo "bundle ok: $(du -h aegis-protocol.html | cut -f1), spine ok: $(du -h narrative/spine.json | cut -f1)"

      - name: Build Reliquary Forge
        run: |
          npm --prefix reliquary-forge ci
          npm --prefix reliquary-forge run check
          npm --prefix reliquary-forge run build
          cp -R reliquary-forge/dist/. reliquary-forge/
          rm -rf reliquary-forge/node_modules reliquary-forge/dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
