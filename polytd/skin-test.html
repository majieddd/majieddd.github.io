<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SKIN TEST</title>
<style>html,body{margin:0;background:#0a0e17;overflow:hidden}#gl{width:100vw;height:100vh;display:block}</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="js/gl.js"></script>
<script src="js/skin.js"></script>
<script>
window.__consoleErrs=[];
window.addEventListener('error', e=>window.__consoleErrs.push(String(e.message)));
(async ()=>{
  const canvas=document.getElementById('gl');
  const eng=new POLY.Engine(canvas);
  eng.setCam([2.5,2.2,4.5],[0.2,0.4,0]);
  eng.proj=POLY.M4.persp(0.78, canvas.width/canvas.height, 0.1, 60);
  try{
    const asset=await POLY.Skin.load('assets/crawler');
    const mesh=new POLY.Skin.SkinMesh(eng.gl, asset);
    const unit=new POLY.Skin.SkinUnit(mesh); window.__unit=unit; 
    eng.addSkin(unit);
    let phase=0;
    eng.onStep=(dt,t)=>{ unit.update(dt); phase+=dt;
      unit.model=POLY.M4.mul(POLY.M4.trans(0, 0, Math.sin(phase*0.7)*1.2), POLY.M4.trs(0,0,0, 0, phase*0.6, 0, 1,1,1));
    };
    window.__testReady=1; window.__dbg={err:window.__consoleErrs, gl:!!eng.gl, hasSkin:!!eng.skin, hasDrawSkins:!!eng.drawSkins};
    let last=performance.now();
    window.__frames=0;
    function loop(ts){
      const dt=Math.min(0.05,(ts-last)/1000); last=ts;
      try{ eng.step(dt); eng.draw(); window.__frames++; }catch(e){ window.__consoleErrs.push('DRAW:'+e.message); if(window.__frames<2) throw e; }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }catch(e){ window.__consoleErrs.push('BOOT:'+(e.stack||String(e)).slice(0,300)); window.__testReady='ERR'; }
})();
</script>
</body>
</html>
