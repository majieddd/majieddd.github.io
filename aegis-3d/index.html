<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%230a0e17'/><circle cx='8' cy='8' r='3.4' fill='%2338e8ff'/></svg>">
<title>Cosmic Conquest: LOWPOLY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="overlay"></canvas>

  <!-- Battle HUD -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="chip" id="wave-chip">WAVE 1</div>
      <div class="chip gold" id="gold-chip">0</div>
      <div class="chip lives" id="lives-chip">♥ 20</div>
      <div class="spacer"></div>
      <button class="hud-btn" id="btn-speed" title="Simulation speed">1×</button>
      <button class="hud-btn" id="btn-pause" title="Pause (Space)">❚❚</button>
      <button class="hud-btn" id="btn-mute" title="Mute">♪</button>
      <button class="hud-btn" id="btn-settings" title="Settings">⚙</button>
    </div>

    <div id="commander-panel"></div>

    <div id="shop"></div>

    <div id="inspector" class="panel hidden"></div>

    <div id="cast-hint">Click the field to cast DAMPENING FIELD · Esc to cancel</div>
    <div id="fps"></div>
  </div>

  <!-- Banners & overlays (always available) -->
  <div id="banner"></div>

  <div id="menu">
  </div>

  <div id="pause" class="hidden full-overlay">
    <div class="panel pause-panel">
      <div class="kicker">COSMIC CONQUEST: LOWPOLY</div>
      <h2>PAUSED</h2>
      <button class="btn-primary" id="pause-btn-resume">RESUME</button>
      <button class="btn-ghost" id="pause-btn-menu">MAIN MENU</button>
    </div>
  </div>

  <div id="end" class="hidden full-overlay"></div>

  <div id="settings" class="hidden">
    <div class="panel settings-panel">
      <div class="panel-title">SETTINGS</div>
      <label class="set-row">MASTER <input type="range" id="vol-master" min="0" max="100"></label>
      <label class="set-row">MUSIC <input type="range" id="vol-music" min="0" max="100"></label>
      <label class="set-row">SFX <input type="range" id="vol-sfx" min="0" max="100"></label>
      <label class="set-row">BLOOM <input type="checkbox" id="q-bloom" checked></label>
      <label class="set-row">SHADOWS <input type="checkbox" id="q-shadow" checked></label>
      <label class="set-row">HI-DPI <input type="checkbox" id="q-res" checked></label>
      <button class="btn-ghost" id="btn-settings-close">CLOSE</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/post/CopyShader.js"></script>
  <script src="vendor/post/LuminosityHighPassShader.js"></script>
  <script src="vendor/post/EffectComposer.js"></script>
  <script src="vendor/post/RenderPass.js"></script>
  <script src="vendor/post/ShaderPass.js"></script>
  <script src="vendor/post/UnrealBloomPass.js"></script>
  <script src="vendor/post/FXAAShader.js"></script>
  <script src="js/util.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/units.js"></script>
  <script src="js/towers.js"></script>
  <script src="js/commander.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
